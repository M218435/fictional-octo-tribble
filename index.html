<script>
/* ============================================================

   时钟以 BGM 的 currentTime 为准，保证音画不漂移。

var cv  = document.getElementById('cv');
var ctx = cv.getContext('2d');
var W = 1920, H = 1080, CX = W / 2;

var C = {
  ink:   '#06080E',
  ink2:  '#0A0F18',

var SANS = '"Noto Sans SC","PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif';
var SERIF = '"Noto Serif SC","Songti SC","SimSun","Noto Serif CJK SC",serif';
var MONO = 'Consolas,"SF Mono","DejaVu Sans Mono",monospace';

var DUR = 181.99;
var T = 0, playing = false, started = false, muted = false, recMode = false;
var audio = document.getElementById('bgm');
var audioReady = false;
var useAudio = true;

audio.addEventListener('canplaythrough', function(){ audioReady = true; });
audio.addEventListener('loadeddata', function(){ audioReady = true; });
audio.addEventListener('error', function(){

/* ---------------- 基础工具 ---------------- */
function clamp(x, a, b){ return x < a ? a : (x > b ? b : x); }
function seg(t, a, b){ return clamp((t - a) / (b - a), 0, 1); }
function ease(x){ x = clamp(x, 0, 1); return 1 - Math.pow(1 - x, 3); }
function easeIn(x){ x = clamp(x, 0, 1); return x * x * x; }
function lerp(a, b, p){ return a + (b - a) * p; }
function mixA(a, b, p){ return a * (1 - p) + b * p; }
function fmt(n){ return n.toLocaleString('en-US'); }

/* 稳定伪随机：同一 seed 每一帧结果一致，保证画面可复现 */
function rnd(seed){
  var s = Math.sin(seed * 127.1 + 311.7) * 43758.5453123;
  return s - Math.floor(s);
}

function setFont(size, opts){
  opts = opts || {};
  var fam = opts.mono ? MONO : (opts.serif ? SERIF : SANS);
  var weight = opts.weight || (opts.serif ? 600 : 400);
  ctx.font = weight + ' ' + size + 'px ' + fam;
  ctx.letterSpacing = (opts.ls || 0) + 'px';
}

function text(str, x, y, size, color, opts){
  opts = opts || {};
  ctx.save();
  ctx.globalAlpha *= (opts.alpha === undefined ? 1 : opts.alpha);
  setFont(size, opts);
  ctx.fillStyle = color;
  ctx.textAlign = opts.align || 'left';
  ctx.textBaseline = opts.baseline || 'alphabetic';
  ctx.fillText(str, x, y);
  ctx.restore();
}

function line(x1, y1, x2, y2, color, w, alpha){
  ctx.save();
  ctx.globalAlpha *= (alpha === undefined ? 1 : alpha);
  ctx.strokeStyle = color;
  ctx.lineWidth = w || 1;
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
  ctx.restore();
}

/* ---------------- 背景：测量仪的地面 ---------------- */
function drawBg(t){
  ctx.fillStyle = C.ink;
  ctx.fillRect(0, 0, W, H);

  // 极弱的中心冷光，让深底有纵深但不形成紫色渐变
  var rg = ctx.createRadialGradient(CX, 430, 60, CX, 430, 1180);
  rg.addColorStop(0, 'rgba(32,52,78,.32)');
  rg.addColorStop(0.55, 'rgba(14,26,42,.14)');
  rg.addColorStop(1, 'rgba(6,8,14,0)');
  ctx.fillStyle = rg;
  ctx.fillRect(0, 0, W, H);

  // 刻度网格，随时间极慢漂移
  var step = 80;
  var drift = (t * 0.55) % step;
  ctx.save();
  ctx.strokeStyle = C.line;
  ctx.globalAlpha = 0.38;
  ctx.lineWidth = 1;
  for (var x = -step + drift; x < W + step; x += step){
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (var y = -step + (t * 0.2) % step; y < H + step; y += step){
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  ctx.restore();

  // 扫描带：14 秒一次的极淡水平扫光，让画面始终在动
  var scan = ((t * 1) % 14) / 14;
  var sy = scan * (H + 260) - 130;
  var sg = ctx.createLinearGradient(0, sy - 120, 0, sy + 120);
  sg.addColorStop(0, 'rgba(120,170,220,0)');
  sg.addColorStop(0.5, 'rgba(120,170,220,.055)');
  sg.addColorStop(1, 'rgba(120,170,220,0)');
  ctx.fillStyle = sg;
  ctx.fillRect(0, sy - 120, W, 240);

  // 暗角
  var vg = ctx.createRadialGradient(CX, H * 0.45, H * 0.35, CX, H * 0.45, H * 1.05);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,.55)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);
}

/* 全片贯穿的地平线 */
var HZ = 742;
function drawHorizon(t, alpha){
  var g = ease(seg(t, 1.4, 4.4));
  if (g <= 0) return;
  var half = 780 * g;
  var a = (alpha === undefined ? 1 : alpha);
  ctx.save();
  ctx.globalAlpha *= a;
  var grd = ctx.createLinearGradient(CX - half, 0, CX + half, 0);
  grd.addColorStop(0, 'rgba(217,160,91,0)');
  grd.addColorStop(0.18, 'rgba(217,160,91,.55)');
  grd.addColorStop(0.5, 'rgba(217,160,91,.95)');
  grd.addColorStop(0.82, 'rgba(217,160,91,.55)');
  grd.addColorStop(1, 'rgba(217,160,91,0)');
  ctx.strokeStyle = grd;
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(CX - half, HZ); ctx.lineTo(CX + half, HZ); ctx.stroke();
  ctx.restore();
}

function drawSubs(t){
  for (var i = 0; i < SUBS.length; i++){
    var s = SUBS[i];
    if (t < s[0] - 0.1 || t > s[1]) continue;
    var pin = ease(seg(t, s[0], s[0] + 0.55));
    var pout = 1 - ease(seg(t, s[1] - 0.45, s[1]));
    var a = Math.min(pin, pout);
    if (a <= 0) continue;
    var dy = (1 - pin) * 12;
    var zhSize = s[2].length > 27 ? 40 : 46;
    ctx.save();
    ctx.globalAlpha = a;
    setFont(zhSize, {ls: 0.5});
    ctx.fillStyle = C.text;
    ctx.textAlign = 'center';
    ctx.fillText(s[2], CX, 872 + dy);
    setFont(19, {mono: false, ls: 0.4});
    ctx.fillStyle = 'rgba(220,228,239,.52)';
    ctx.fillText(s[3], CX, 918 + dy * 0.7);

}

function drawChrome(t){
  var fadeOut = 1 - ease(seg(t, 176, 181));
  ctx.save();
  ctx.globalAlpha = fadeOut;

  text('vibe 知识大赏', 120, 78, 16, 'rgba(117,129,143,.95)', {ls: 4});
  text('一支用代码做的片子', 120, 106, 13, 'rgba(62,72,86,.95)', {ls: 1.5});

    // 左侧竖线

    ctx.beginPath(); ctx.moveTo(lx - 18, ly - 46); ctx.lineTo(lx - 18, ly + 264); ctx.stroke();

    for (var i = 0; i < CODE_LINES.length; i++){

      if (la <= 0) continue;
      var yy = ly + i * 42;
      var isComment = CODE_LINES[i].indexOf('//') === 0 || CODE_LINES[i] === '';
      ctx.save();
      ctx.globalAlpha *= la;
      if (CODE_LINES[i] !== ''){
        text(String(i + 1).padStart(2, '0'), lx - 44, yy, 14, 'rgba(117,129,143,.5)', {mono: true});
        text(CODE_LINES[i], lx + (1 - la) * 8, yy, 22,
             isComment ? 'rgba(117,129,143,.85)' : 'rgba(220,228,239,.95)', {mono: true});
      }
      ctx.restore();
    }

    // 预览窗
    var px = 840, py = 232, pw = 560, ph = 352;
    var pIn = ease(seg(t, 25.6, 26.6));
    ctx.save();
    ctx.globalAlpha *= pIn;
    ctx.strokeStyle = 'rgba(220,228,239,.10)';
    ctx.lineWidth = 1;
    ctx.strokeRect(px, py, pw, ph);

    ctx.save();
    ctx.beginPath(); ctx.rect(px, py, pw, ph); ctx.clip();
    ctx.fillStyle = '#04060B';
    ctx.fillRect(px, py, pw, ph);

    // 网格
    var gi = ease(seg(t, 27.6, 28.6));
    ctx.strokeStyle = 'rgba(63,80,104,' + (0.55 * gi) + ')';
    for (var gx = px; gx < px + pw; gx += 40){
      ctx.beginPath(); ctx.moveTo(gx, py); ctx.lineTo(gx, py + ph); ctx.stroke();
    }
    for (var gy = py; gy < py + ph; gy += 40){
      ctx.beginPath(); ctx.moveTo(px, gy); ctx.lineTo(px + pw, gy); ctx.stroke();
    }

    // 中心环
    var ri = ease(seg(t, 29.0, 31.2));
    if (ri > 0){
      var cx2 = px + pw / 2, cy2 = py + ph / 2 - 10;
      ctx.strokeStyle = 'rgba(217,160,91,' + (0.85 * ri) + ')';
      ctx.lineWidth = 1.4;
      for (var k = 0; k < 3; k++){
        var r = (26 + k * 26) * (0.6 + ri * 0.4) + Math.sin(t * 1.6 + k * 1.2) * 4;
        ctx.globalAlpha = ri * (0.8 - k * 0.2);
        ctx.beginPath(); ctx.arc(cx2, cy2, r, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.globalAlpha = ri;
      // 轨道点
      var ang = t * 0.9;
      ctx.fillStyle = C.amber;
      ctx.beginPath();
      ctx.arc(cx2 + Math.cos(ang) * 52, cy2 + Math.sin(ang) * 52, 3.2, 0, Math.PI * 2);
      ctx.fill();
    }

    // 数字
    var ni = ease(seg(t, 30.6, 32.0));
    if (ni > 0){

    var si = ease(seg(t, 31.6, 32.8));
    if (si > 0){
      ctx.globalAlpha = si;
      ctx.fillStyle = 'rgba(220,228,239,' + (0.2 * si) + ')';
      ctx.fillRect(px + 70, py + ph - 52, 300, 3);
    }
    ctx.restore(); // clip

    text('t = ' + t.toFixed(2) + ' s', px, py + ph + 36, 17, 'rgba(220,228,239,.7)', {mono: true, ls: 1});
    text('render(t)', px + pw, py + ph + 36, 17, 'rgba(217,160,91,.85)', {mono: true, align: 'right', ls: 1});
    ctx.restore();
    ctx.restore();
  }
}

function sThreshold(t){
  var a = ease(seg(t, 40.4, 41.4)) * (1 - ease(seg(t, 50.8, 52.0)));
  if (a <= 0) return;

  ctx.save();
  ctx.globalAlpha = a;

  text('2026.09.22', CX, 330, 30, 'rgba(220,228,239,.55)', {mono: true, align: 'center', ls: 6});

  // 门槛：一堵有高度的墙，被削平，最后落成地平线
  var cut = ease(seg(t, 42.4, 44.8));
  var sink = ease(seg(t, 44.8, 48.4));
  var topY = lerp(470, HZ, cut);
  var wallW = 380;
  var wx = CX - wallW / 2;

  ctx.save();
  ctx.globalAlpha = a * (0.94 - 0.50 * sink);

  ctx.fillStyle = 'rgba(217,160,91,.10)';
  ctx.fillRect(wx, topY, wallW, Math.max(0, HZ - topY));

  ctx.strokeStyle = C.amber;
  ctx.lineWidth = lerp(1.6, 1.0, sink);
  ctx.strokeRect(wx, topY, wallW, Math.max(0, HZ - topY));

  // 顶面亮线：削平过程中最醒目的一条
  ctx.fillStyle = 'rgba(217,160,91,.95)';
  ctx.fillRect(wx, topY - 1.5, wallW, 3.4);
  ctx.restore();

  text('一个人 · 一支团队 · 几周', CX, 424, 15, 'rgba(117,129,143,.75)',
       {align: 'center', ls: 1.4, alpha: 1 - ease(seg(t, 42.6, 44.6))});

  // 门槛落下后，地平线亮起
  var lit = ease(seg(t, 48.4, 50.2));
  if (lit > 0){
    ctx.globalAlpha = a * lit;
    var grd = ctx.createLinearGradient(CX - 720, 0, CX + 720, 0);
    grd.addColorStop(0, 'rgba(217,160,91,0)');
    grd.addColorStop(0.5, 'rgba(217,160,91,.7)');
    grd.addColorStop(1, 'rgba(217,160,91,0)');
    ctx.strokeStyle = grd;
    ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.moveTo(CX - 720, HZ); ctx.lineTo(CX + 720, HZ); ctx.stroke();
  }
  ctx.restore();
}

function lerpColor(fromA, toA, p){
  return 'rgba(217,160,91,' + (fromA * (1 - p) + toA * p) + ')';
}

/* ============================================================
   幕 05 · 时间线：斜率在 9.29 改变（64 – 86s）
   ============================================================ */
var TL = {
  x0: 220, x1: 1700, y: 680, top: 372,
  span: 51,
  nodes: [
    {d: 0,  label: '9.22',  sub: '模型发布',            t: 66.4, v: 0,    unit: '0'},
    {d: 7,  label: '9.29',  sub: '平台私信邀约',         t: 68.6, v: 3,    unit: '300 万'},
    {d: 28, label: '10.20', sub: '11.7 亿次播放',        t: 74.4, v: 1170, unit: '11.7 亿'},
    {d: 51, label: '11.12', sub: '30 亿 · 日均 150 条',  t: 79.0, v: 3000, unit: '30 亿'}
  ]
};

function tlX(d){ return TL.x0 + (d / TL.span) * (TL.x1 - TL.x0); }
function tlYLog(lv){
  return TL.y - (TL.y - TL.top) * (lv / Math.log10(3001));
}
function tlY(v){ return tlYLog(Math.log10(1 + v)); }

/* 在对数空间线性插值：曲线是平滑上升的折线，而不是对数轴上的假跳变 */
function tlLogAt(t){
  var n = TL.nodes, cur = 0;
  for (var i = 0; i < n.length; i++){
    if (t >= n[i].t){
      if (i < n.length - 1){
        var p = seg(t, n[i].t, n[i + 1].t);
        cur = lerp(Math.log10(1 + n[i].v), Math.log10(1 + n[i + 1].v), p);
      } else cur = Math.log10(1 + n[i].v);
    }
  }
  return cur;
}

/* 读数取离散节点值：与字幕里的数字严格一致 */
function tlRead(t){
  var n = TL.nodes, idx = 0;
  for (var i = 0; i < n.length; i++){ if (t >= n[i].t) idx = i; }
  var p = ease(clamp((t - n[idx].t) / 0.5, 0, 1));
  return {cur: n[idx].unit, prev: idx > 0 ? n[idx - 1].unit : n[idx].unit, p: p};
}

function sTimeline(t){
  var a = ease(seg(t, 64.2, 65.2)) * (1 - ease(seg(t, 84.2, 86.0)));
  if (a <= 0) return;

  ctx.save();
  ctx.globalAlpha = a;

  // 对数刻度参考线
  var refs = [[100, '1 亿'], [1000, '10 亿'], [3000, '30 亿']];
  var ra = ease(seg(t, 65.4, 66.8));
  for (var r = 0; r < refs.length; r++){
    if (ra <= 0) continue;
    var ry = tlY(refs[r][0]);
    ctx.save();
    ctx.globalAlpha = a * ra * 0.45;
    ctx.strokeStyle = 'rgba(140,160,190,.5)';
    ctx.setLineDash([5, 7]);
    ctx.beginPath(); ctx.moveTo(TL.x0, ry); ctx.lineTo(TL.x1, ry); ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
    text(refs[r][1], TL.x1, ry - 10, 13, 'rgba(117,129,143,.75)', {align: 'right', ls: 1, alpha: a * ra});
  }
  if (ra > 0){
    text('对数刻度', TL.x1, 258, 12, 'rgba(117,129,143,.6)', {align: 'right', ls: 3, alpha: a * ra});
  }

  // 轴
  var grow = ease(seg(t, 64.6, 66.4));
  ctx.strokeStyle = 'rgba(220,228,239,.30)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(TL.x0, TL.y); ctx.lineTo(TL.x0 + (TL.x1 - TL.x0) * grow, TL.y); ctx.stroke();

  // 年份刻度
  for (var d = 0; d <= TL.span; d += 7){
    if (d / TL.span > grow) continue;
    ctx.strokeStyle = 'rgba(220,228,239,.12)';
    ctx.beginPath(); ctx.moveTo(tlX(d), TL.y - 4); ctx.lineTo(tlX(d), TL.y + 4); ctx.stroke();
  }

  // 累计曲线（时间连续，读数离散）
  var pts = [];
  if (t > 66.4){
    var span = 260;
    for (var i = 0; i < span; i++){
      var tt = 66.4 + (i / (span - 1)) * (t - 66.4);
      pts.push([tlTimeToX(tt), tlYLog(tlLogAt(tt))]);
    }
  }
  if (pts.length > 1){
    ctx.strokeStyle = 'rgba(217,160,91,.92)';
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (var j = 1; j < pts.length; j++) ctx.lineTo(pts[j][0], pts[j][1]);
    ctx.stroke();

    // 曲线下的极淡面积
    ctx.fillStyle = 'rgba(217,160,91,.085)';
    ctx.beginPath();
    ctx.moveTo(pts[0][0], TL.y);
    for (var m = 0; m < pts.length; m++) ctx.lineTo(pts[m][0], pts[m][1]);
    ctx.lineTo(pts[pts.length - 1][0], TL.y);
    ctx.closePath();
    ctx.fill();

    // 曲线末端的光点
    var lastPt = pts[pts.length - 1];
    ctx.fillStyle = C.amber;
    ctx.beginPath(); ctx.arc(lastPt[0], lastPt[1], 4.2, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(217,160,91,.35)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(lastPt[0], lastPt[1], 11, 0, Math.PI * 2); ctx.stroke();
  }

  // 节点
  for (var q = 0; q < TL.nodes.length; q++){
    var nd = TL.nodes[q];
    var na = ease(seg(t, nd.t, nd.t + 0.5));
    if (na <= 0) continue;
    var nx = tlX(nd.d);
    ctx.save();
    ctx.globalAlpha = a * na;
    ctx.fillStyle = C.amber;
    ctx.beginPath(); ctx.arc(nx, TL.y, 3.4 * na, 0, Math.PI * 2); ctx.fill();

    // 引线
    ctx.strokeStyle = 'rgba(217,160,91,.32)';
    ctx.beginPath(); ctx.moveTo(nx, TL.y); ctx.lineTo(nx, TL.y + 12); ctx.stroke();

    text(nd.label, nx, TL.y + 42, 17, 'rgba(220,228,239,.78)', {mono: true, align: 'center', ls: 1});
    text(nd.sub, nx, TL.y + 72, 15, q === 1 ? C.amber : 'rgba(117,129,143,.9)',
         {align: 'center', ls: 0.4});
    ctx.restore();
  }

  // 平台介入区间标注
  var rIn = ease(seg(t, 69.6, 70.6));
  if (rIn > 0){
    ctx.save();
    ctx.globalAlpha = a * rIn;
    ctx.strokeStyle = 'rgba(217,160,91,.5)';
    ctx.setLineDash([3, 4]);
    ctx.beginPath();
    ctx.moveTo(tlX(7), TL.y - 14);
    ctx.lineTo(tlX(10), TL.y - 14);
    ctx.stroke();
    ctx.setLineDash([]);
    text('10.2 之后：同一段 BGM 密集出现', tlX(10) + 12, TL.y - 9, 13, 'rgba(217,160,91,.72)', {ls: 0.5});
    ctx.restore();
  }

  // 左上读数：取离散节点值，与字幕里的数字严格一致
  if (t > 67.4){
    var rd = tlRead(t);
    var vIn = ease(seg(t, 67.4, 68.4));
    ctx.save();
    ctx.globalAlpha = a * vIn;
    text('累计播放', TL.x0, 392, 14, 'rgba(117,129,143,.85)', {ls: 3});
    if (rd.p < 1) text(rd.prev, TL.x0, 486, 78, 'rgba(217,160,91,.45)', {mono: true, ls: 1, alpha: 1 - rd.p});
    text(rd.cur, TL.x0, 486, 78, C.amber, {mono: true, ls: 1, alpha: rd.p});
    ctx.restore();
  }
  ctx.restore();
}

function tlTimeToX(tt){
  var n = TL.nodes;
  if (tt <= n[0].t) return TL.x0;
  for (var i = 0; i < n.length - 1; i++){
    if (tt <= n[i + 1].t){
      var p = (tt - n[i].t) / (n[i + 1].t - n[i].t);
      return tlX(n[i].d + (n[i + 1].d - n[i].d) * p);
    }
  }
  return TL.x1;
}

function buildCardLayer(){
  var oc = document.createElement('canvas');
  oc.width = CARD_W; oc.height = CARD_H;

  ox.fillStyle = '#070B13';
  ox.fillRect(0, 0, CARD_W, CARD_H);

  // 网格
  ox.strokeStyle = 'rgba(70,90,120,.20)';
  for (var x = 20; x < CARD_W; x += 26){
    ox.beginPath(); ox.moveTo(x, 0); ox.lineTo(x, CARD_H); ox.stroke();
  }

  // 发光曲线
  ox.save();
  ox.shadowColor = 'rgba(217,160,91,.9)';
  ox.shadowBlur = 9;
  ox.strokeStyle = 'rgba(217,160,91,.92)';
  ox.lineWidth = 1.3;

/* ---------- 控制 ---------- */
var ui      = document.getElementById('ui');
var gate    = document.getElementById('gate');
var btnPlay = document.getElementById('btnPlay');
var btnMute = document.getElementById('btnMute');
var btnRec  = document.getElementById('btnRec');
var btnFull = document.getElementById('btnFull');
var bar     = document.getElementById('bar');
var barFill = document.getElementById('barFill');
var barDot  = document.getElementById('barDot');
var timeEl  = document.getElementById('time');
var toastEl = document.getElementById('toast');

var toastTimer = null;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toastEl.classList.remove('on'); }, 1600);
}

function mmss(s){
  s = Math.max(0, Math.round(s));
  var m = Math.floor(s / 60), r = s % 60;
  return (m < 10 ? '0' : '') + m + ':' + (r < 10 ? '0' : '') + r;
}

function setPlaying(p){
  playing = p;
  btnPlay.textContent = p ? '❚❚' : '▶';
  if (p){
    if (useAudio && audioReady){
      try { audio.currentTime = T; audio.play(); } catch(e){ useAudio = false; }
    }
    pokeUI();
  } else {
    try { audio.pause(); } catch(e){}
    clearTimeout(hideTimer);
    ui.classList.remove('hide');
  }
}

function seekTo(t){
  T = clamp(t, 0, DUR);
  if (useAudio && audioReady){
    try { audio.currentTime = T; } catch(e){}
  }
  renderUI();
  if (!playing) draw(T);
}

function renderUI(){
  var p = clamp(T / DUR, 0, 1) * 100;
  barFill.style.width = p + '%';
  barDot.style.left = p + '%';
  timeEl.textContent = mmss(T) + ' / 03:02';
  bar.setAttribute('aria-valuenow', Math.round(p));
}

var hideTimer = null;
function pokeUI(){
  if (recMode) return;
  ui.classList.remove('hide');
  clearTimeout(hideTimer);
  if (playing){
    hideTimer = setTimeout(function(){ if (playing && !recMode) ui.classList.add('hide'); }, 2400);
  }
}

function toggleRec(){
  recMode = !recMode;
  ui.classList.toggle('hide', recMode);
  document.getElementById('stage').style.cursor = recMode ? 'none' : 'default';
  toast(recMode ? '录制模式：控件已隐藏，按 R 恢复' : '已退出录制模式');
}

/* 开始 */
function start(){
  if (started) return;
  started = true;
  gate.classList.add('gone');
  T = 0;
  setPlaying(true);
}

gate.addEventListener('click', start);
gate.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); start(); } });
gate.tabIndex = 0;

btnPlay.addEventListener('click', function(){
  if (!started) { start(); return; }
  if (T >= DUR - 0.1) { T = 0; }
  setPlaying(!playing);
});
btnMute.addEventListener('click', function(){
  muted = !muted;
  audio.muted = muted;
  var ms = document.getElementById('muteSlash');
  if (ms) ms.style.opacity = muted ? 1 : 0;
  btnMute.style.opacity = muted ? 0.45 : 1;
  toast(muted ? '已静音（画面时钟改为本地计时）' : '已恢复音乐');
  if (!muted && useAudio && audioReady && playing) audio.play().catch(function(){});
});
btnRec.addEventListener('click', toggleRec);
btnFull.addEventListener('click', function(){
  if (!document.fullscreenElement){
    document.documentElement.requestFullscreen().catch(function(){ toast('全屏失败，按 F11 试试'); });
  } else {
    document.exitFullscreen().catch(function(){});
  }
});

/* 进度条拖动 */
var dragging = false;
function barSeek(e){
  var rect = bar.getBoundingClientRect();
  var x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
  seekTo(clamp(x / rect.width, 0, 1) * DUR);
}
bar.addEventListener('mousedown', function(e){ dragging = true; barSeek(e); });
window.addEventListener('mousemove', function(e){ if (dragging) barSeek(e); });
window.addEventListener('mouseup', function(){ dragging = false; });
bar.addEventListener('touchstart', function(e){ barSeek(e); }, {passive: true});
bar.addEventListener('touchmove', function(e){ barSeek(e); }, {passive: true});

/* 键盘 */
window.addEventListener('keydown', function(e){
  if (e.target && (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT')) return;
  var k = e.key;
  if (k === ' '){ e.preventDefault(); if (!started) start(); else setPlaying(!playing); }
  else if (k === 'ArrowRight'){ e.preventDefault(); seekTo(T + 5); }
  else if (k === 'ArrowLeft'){ e.preventDefault(); seekTo(T - 5); }
  else if (k === 'r' || k === 'R'){ e.preventDefault(); toggleRec(); }
  else if (k === 'm' || k === 'M'){ e.preventDefault(); btnMute.click(); }
  else if (k === 'f' || k === 'F'){
    e.preventDefault();
    if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(function(){});
    else document.exitFullscreen().catch(function(){});
  }
});

window.addEventListener('mousemove', pokeUI);
window.addEventListener('touchstart', pokeUI, {passive: true});

/* ---------- 主循环：以音频为主时钟 ---------- */
var lastNow = performance.now();
var lastT = -1;

function frame(now){
  var dt = Math.min((now - lastNow) / 1000, 0.08);
  lastNow = now;

  if (playing){
    if (useAudio && audioReady && !audio.paused && !audio.ended){
      T = audio.currentTime;
    } else if (useAudio && audioReady && muted && !audio.paused){
      T = audio.currentTime;
    } else {
      T = Math.min(T + dt, DUR);
    }
    if (T >= DUR - 0.02){
      T = DUR;
      setPlaying(false);
      if (recMode){ /* 停在末帧，方便停止录制 */ }
    }
  }

  if (!playing && Math.abs(T - lastT) < 0.0005){
    // 暂停时只在需要时重绘（保证首帧与 seek 后正确）
  } else {
    draw(T);
    lastT = T;
  }
  renderUI();
  requestAnimationFrame(frame);
}

/* 字体就绪后强制重绘一次 */
if (document.fonts && document.fonts.ready){
  document.fonts.ready.then(function(){ draw(T); });
}

/* 支持 ?t=秒 直接定位到某一帧（便于逐幕核对与截图） */
var qs = new URLSearchParams(location.search);
if (qs.has('t')){
  T = clamp(parseFloat(qs.get('t')) || 0, 0, DUR);
  started = true;
  gate.classList.add('gone');
  if (qs.get('ui') === '0'){ recMode = true; ui.classList.add('hide'); document.getElementById('stage').style.cursor = 'none'; }
}

/* 首帧 */
draw(T);
renderUI();
requestAnimationFrame(frame);
</script>
</body>
</html>
