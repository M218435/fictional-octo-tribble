<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F4F1EA">
<title>RTSX</title>
<style>
  :root{
    --bg:#F4F1EA;
    --bg-soft:#FBF9F5;
    --ink:#191817;
    --ink-2:#5F5B53;
    --ink-3:#938E85;
    --line:#E4E0D7;
    --line-2:#EFEBE3;
    --brand:#D97757;
    --brand-2:#C4603F;
    --btn:#2A2724;
    --card:#FFFFFF;
    --danger:#BC4B2E;
  }
  *{box-sizing:border-box;}
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.001ms !important;transition-duration:.001ms !important;}
  }
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(120% 80% at 50% -10%, #FDFBF7 0%, rgba(253,251,247,0) 60%),
      var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:16px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    overflow-x:hidden;
  }
  .stage{
    position:fixed;
    inset:0;
    display:flex;
    align-items:flex-start;          /* 内容超高时从顶部开始，不再把上半截裁掉 */
    justify-content:center;
    padding:28px;
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    transform:translateY(8px);
    transition:opacity .55s cubic-bezier(.22,.61,.36,1), transform .55s cubic-bezier(.22,.61,.36,1);
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
  }
  .stage > .card,
  .stage > .home,
  .stage > .boot-inner{margin-top:auto;margin-bottom:auto;}
  .stage.on{
    opacity:1;
    visibility:visible;
    pointer-events:auto;
    transform:none;
  }

  /* ---------- brand mark : RTSX ---------- */
  .mark{
    border-radius:13px;
    background:linear-gradient(155deg,#E2916F 0%, var(--brand) 45%, var(--brand-2) 100%);
    color:#fff;
    font-family:Georgia,"Times New Roman",serif;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    line-height:1;
    letter-spacing:.02em;
    box-shadow:0 2px 4px rgba(120,60,40,.18), inset 0 1px 0 rgba(255,255,255,.28);
    user-select:none;
  }
  .wordmark{
    font-family:Georgia,"Times New Roman",serif;
    letter-spacing:.26em;
    text-transform:uppercase;
    color:var(--ink-3);
    font-size:11px;
    margin-top:14px;
    padding-left:.26em;
  }

  /* ---------- boot ---------- */
  .boot-inner{display:flex;flex-direction:column;align-items:center;}
  .boot-mark{width:40px;height:40px;font-size:21px;animation:breathe 1.9s ease-in-out infinite;}
  @keyframes breathe{
    0%,100%{opacity:.38;transform:scale(.94);}
    50%{opacity:1;transform:scale(1);}
  }
  .load{width:min(240px,64vw);margin-top:24px;}
  .load-bar{
    height:3px;border-radius:99px;background:rgba(25,24,23,.09);overflow:hidden;
  }
  .load-fill{
    display:block;height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,#E2916F,#C4603F);
    transition:width .4s cubic-bezier(.22,.61,.36,1);
  }
  .load-meta{
    display:flex;align-items:baseline;justify-content:space-between;
    margin-top:10px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);
  }
  .load-meta b{font-variant-numeric:tabular-nums;letter-spacing:.06em;color:#8C877C;font-weight:600;}

  /* 音效开关 */
  .snd{
    position:fixed;top:14px;right:14px;z-index:30;
    border:1px solid var(--line);background:rgba(255,255,255,.82);border-radius:8px;
    padding:4px 8px;font:inherit;font-size:10px;letter-spacing:.12em;
    color:var(--ink-3);cursor:pointer;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  }
  .snd.off{opacity:.55;text-decoration:line-through;}
  body.modal-open .snd{display:none;}   /* 弹层打开时让位给游戏自己的开关，避免盖住关闭按钮 */

  /* ---------- card ---------- */
  .card{
    width:min(520px,100%);
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:40px 40px 28px;
    text-align:center;
    box-shadow:0 1px 2px rgba(25,24,23,.04), 0 24px 60px -28px rgba(25,24,23,.28);
  }
  .card .mark{width:44px;height:44px;font-size:23px;margin:0 auto;}
  .card h1{
    margin:24px 0 14px;
    font-family:Georgia,"Songti SC","STSong","Times New Roman",serif;
    font-weight:600;
    font-size:25px;
    line-height:1.35;
    letter-spacing:-.005em;
    color:var(--ink);
  }
  .lede{
    margin:0 auto;
    max-width:396px;
    font-size:14.5px;
    line-height:1.75;
    color:var(--ink-2);
  }
  .ref{
    display:inline-flex;
    align-items:center;
    gap:7px;
    margin:20px 0 24px;
    padding:5px 12px;
    border:1px solid var(--line);
    border-radius:999px;
    background:var(--bg-soft);
    font-family:ui-monospace,SFMono-Regular,"SF Mono",Consolas,"Liberation Mono",monospace;
    font-size:11.5px;
    letter-spacing:.05em;
    color:var(--ink-3);
  }
  .ref b{color:#7E7A70;font-weight:600;}

  .actions{display:flex;flex-direction:column;align-items:center;gap:13px;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    height:44px;padding:0 24px;border:0;border-radius:10px;
    background:var(--btn);color:#fff;
    font-size:14.5px;font-weight:500;font-family:inherit;
    text-decoration:none;cursor:pointer;
    transition:background .18s ease, transform .18s ease, box-shadow .18s ease;
    box-shadow:0 1px 2px rgba(25,24,23,.18);
    white-space:nowrap;
  }
  .btn:hover{background:#000;transform:translateY(-1px);box-shadow:0 6px 18px -8px rgba(25,24,23,.5);}
  .btn:active{transform:translateY(0);}
  .sub-link{
    background:none;border:0;border-bottom:1px solid var(--line);
    font-family:inherit;font-size:13.5px;color:var(--ink-2);
    padding:0 0 1px;cursor:pointer;text-decoration:none;
    transition:color .18s ease, border-color .18s ease;
  }
  .sub-link:hover{color:var(--ink);border-color:var(--ink-3);}

  /* ---------- appeal ---------- */
  .appeal{
    display:none;
    margin:22px auto 0;
    text-align:left;
    max-width:396px;
  }
  .appeal.open{display:block;animation:rise .3s ease both;}
  @keyframes rise{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:none;}}
  .appeal-label{
    font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--ink-3);margin-bottom:8px;
  }
  .appeal-row{display:flex;gap:8px;}
  .appeal input{
    flex:1 1 auto;min-width:0;height:44px;
    border:1px solid var(--line);border-radius:10px;
    background:var(--bg-soft);padding:0 14px;
    font:inherit;font-size:14px;color:var(--ink);
    outline:none;
    transition:border-color .18s ease, box-shadow .18s ease, background .18s ease;
  }
  .appeal input::placeholder{color:#B3ADA2;}
  .appeal input:focus{
    border-color:#CDBFAF;background:#fff;
    box-shadow:0 0 0 3px rgba(217,119,87,.14);
  }
  .appeal .btn{height:44px;padding:0 18px;font-size:14px;}
  .appeal-note{margin:9px 0 0;font-size:12px;line-height:1.6;color:var(--ink-3);}
  .appeal-err{
    display:none;margin:9px 0 0;font-size:12.5px;line-height:1.6;color:var(--danger);
  }
  .appeal-err.show{display:block;}

  /* ---------- terms (全站自包含，无外链) ---------- */
  .terms{
    display:none;
    margin:20px auto 0;
    max-width:398px;
    text-align:left;
    background:var(--bg-soft);
    border:1px solid var(--line);
    border-radius:12px;
    padding:15px 17px 13px;
  }
  .terms.open{display:block;animation:rise .3s ease both;}
  .terms-head{
    font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--ink-3);margin-bottom:9px;
  }
  .terms-list{
    margin:0;padding-left:17px;
    font-size:12.5px;line-height:1.8;color:var(--ink-2);
  }
  .terms-list li{margin-bottom:2px;}
  .shake{animation:shake .38s cubic-bezier(.36,.07,.19,.97) both;}
  @keyframes shake{
    10%,90%{transform:translateX(-2px);}
    20%,80%{transform:translateX(4px);}
    30%,50%,70%{transform:translateX(-7px);}
    40%,60%{transform:translateX(7px);}
  }

  .foot{
    margin-top:26px;padding-top:20px;
    border-top:1px solid var(--line-2);
    font-size:12.5px;line-height:1.75;color:var(--ink-3);
  }
  .foot a{color:var(--ink-3);text-decoration:underline;text-underline-offset:2px;}
  .foot a:hover{color:var(--ink-2);}

  /* ---------- home : game lobby ---------- */
  .home{width:min(760px,100%);text-align:center;}
  .home .mark{width:52px;height:52px;font-size:27px;margin:0 auto;}
  .home h1{
    margin:24px 0 6px;
    font-family:Georgia,"Songti SC","STSong","Times New Roman",serif;
    font-weight:600;
    font-size:30px;
    line-height:1.3;
    letter-spacing:-.01em;
  }
  .home-sub{margin:0 0 28px;font-size:13.5px;color:var(--ink-3);letter-spacing:.02em;}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;text-align:left;}
  .tile{
    display:flex;flex-direction:column;gap:6px;
    padding:18px 18px 15px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    font-family:inherit;
    text-align:left;
    cursor:pointer;
    box-shadow:0 1px 2px rgba(25,24,23,.04);
    transition:transform .18s ease, box-shadow .2s ease, border-color .18s ease;
  }
  .tile:hover{transform:translateY(-2px);border-color:#DCD5C8;box-shadow:0 12px 28px -20px rgba(25,24,23,.5);}
  .tile:active{transform:translateY(0);}
  .tile .ico{width:42px;height:42px;margin-bottom:8px;color:var(--brand);}
  .tile .ico svg{display:block;width:100%;height:100%;}
  .tile .name{font-size:16px;font-weight:600;color:var(--ink);letter-spacing:.01em;}
  .tile .desc{font-size:12.5px;color:var(--ink-3);line-height:1.55;}
  .tile .go{
    margin-top:9px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--brand);display:flex;align-items:center;gap:6px;
  }

  .tile.feature{
    grid-column:span 2;
    flex-direction:row;align-items:center;gap:18px;
    padding:20px 22px;
    background:linear-gradient(140deg,#262320 0%,#1B1A18 62%);
    border-color:#2E2A24;
    box-shadow:0 2px 4px rgba(25,24,23,.14), 0 22px 44px -34px rgba(0,0,0,.6);
  }
  .tile.feature:hover{border-color:#4A423A;transform:translateY(-2px);}
  .tile.feature .ico{width:54px;height:54px;margin:0;flex:none;color:#E2916F;}
  .tile.feature .txt{display:flex;flex-direction:column;gap:5px;min-width:0;}
  .tile.feature .name{color:#F8F4EE;font-size:17px;}
  .tile.feature .desc{color:rgba(246,242,236,.58);}
  .tile.feature .go{color:#E2916F;margin-top:7px;}
  .home-foot{margin-top:26px;font-size:11.5px;letter-spacing:.06em;color:#B7B1A4;}

  /* ---------- game modal ---------- */
  .game-modal{
    position:fixed;inset:0;z-index:20;
    display:flex;align-items:center;justify-content:center;
    padding:20px;
    background:rgba(25,24,23,.55);
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    opacity:0;visibility:hidden;pointer-events:none;
    transition:opacity .25s ease;
  }
  .game-modal.open{opacity:1;visibility:visible;pointer-events:auto;}
  .game-shell{
    width:min(900px,100%);height:min(92vh,780px);height:min(92dvh,780px);
    display:flex;flex-direction:column;
    background:var(--card);border-radius:16px;overflow:hidden;
    box-shadow:0 30px 80px -30px rgba(0,0,0,.6);
    transform:translateY(10px) scale(.985);
    transition:transform .25s ease;
  }
  .game-modal.open .game-shell{transform:none;}
  .game-bar{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:10px 14px 10px 20px;
    border-bottom:1px solid var(--line-2);
    background:#fff;
  }
  .game-bar .t{font-size:13.5px;font-weight:600;color:var(--ink);letter-spacing:.02em;}
  .game-bar .tools{display:flex;align-items:center;gap:14px;}
  .game-bar .tools a{
    font-size:12px;color:var(--ink-3);text-decoration:none;
    border-bottom:1px solid var(--line);padding-bottom:1px;
  }
  .game-bar .tools a:hover{color:var(--ink-2);}
  #game-close{
    height:30px;padding:0 14px;border-radius:8px;border:1px solid var(--line);
    background:#fff;color:var(--ink-2);font:inherit;font-size:12.5px;cursor:pointer;
    transition:background .16s ease, border-color .16s ease;
  }
  #game-close:hover{background:var(--bg-soft);border-color:#D9D2C5;}
  #game-frame{flex:1 1 auto;width:100%;border:0;background:var(--bg);display:block;}

  /* ---------- toast ---------- */
  .toast{
    position:fixed;left:50%;bottom:32px;
    transform:translate(-50%,14px);
    background:#221F1C;color:#F6F2EC;
    font-size:13px;letter-spacing:.02em;
    padding:10px 18px;border-radius:999px;
    box-shadow:0 10px 30px -12px rgba(0,0,0,.55);
    opacity:0;pointer-events:none;
    transition:opacity .35s ease, transform .35s ease;
    z-index:9;white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translate(-50%,0);}

  .parody{
    position:absolute;left:0;right:0;bottom:16px;
    text-align:center;font-size:10.5px;letter-spacing:.04em;
    color:#BCB6A9;padding:0 16px;
  }

  @media (max-width:560px){
    .stage{padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom));}
    .card{padding:32px 20px 22px;border-radius:14px;}
    .card h1{font-size:21px;}
    .home h1{font-size:24px;margin:20px 0 6px;}
    .home .mark{width:46px;height:46px;font-size:24px;}
    .grid{grid-template-columns:1fr;gap:12px;}
    .tile.feature{grid-column:span 1;padding:16px 18px;gap:14px;}
    .tile.feature .ico{width:46px;height:46px;}
    .game-modal{padding:0;}
    .game-shell{height:100dvh;max-height:100dvh;border-radius:0;box-shadow:none;}
    .game-bar{padding:calc(8px + env(safe-area-inset-top)) 12px 8px 14px;}
    .game-bar .tools a{display:none;}
    #game-close{height:34px;padding:0 16px;}
    .appeal-row{flex-direction:column;}
    .appeal .btn{width:100%;height:44px;}
    .snd{top:calc(10px + env(safe-area-inset-top));right:10px;}
    .toast{bottom:calc(24px + env(safe-area-inset-bottom));}
  }
  /* 手机横屏：压缩首页，避免卡片被裁 */
  @media (max-height:520px) and (min-width:561px){
    .home h1{margin:14px 0 4px;font-size:24px;}
    .home .mark{width:40px;height:40px;font-size:20px;}
    .home-sub{margin-bottom:16px;}
    .grid{grid-template-columns:1fr 1fr 1fr;}
    .tile.feature{grid-column:span 3;padding:14px 18px;}
  }
</style>
</head>
<body>

<!-- ========== boot ========== -->
<div class="stage on" id="stage-boot">
  <div class="boot-inner">
    <div class="mark boot-mark">R</div>
    <div class="load">
      <div class="load-bar"><span class="load-fill" id="load-fill"></span></div>
      <div class="load-meta"><span>Loading</span><b id="load-pct">0%</b></div>
    </div>
  </div>
</div>

<button class="snd" id="snd" type="button" aria-label="音效开关">SFX</button>

<!-- ========== banned ========== -->
<div class="stage" id="stage-ban">
  <div class="card">
    <div class="mark">R</div>
    <div class="wordmark">RTSX</div>

    <h1 id="ban-title">你的账号已被停用</h1>
    <p class="lede" id="ban-lede"></p>

    <div class="ref"><span id="ref-label">参考号</span> <b id="ref-id">&mdash;</b></div>

    <div class="actions">
      <button class="btn" id="appeal-toggle" type="button">提交申诉</button>
      <button class="sub-link" id="terms-toggle" type="button">查看服务条款</button>
    </div>

    <div class="appeal" id="appeal">
      <div class="appeal-label" id="appeal-label">申诉校验码</div>
      <div class="appeal-row">
        <input id="code-input" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="XXXXXXXX">
        <button class="btn" id="code-submit" type="button">校验并提交</button>
      </div>
      <p class="appeal-note" id="appeal-note"></p>
      <p class="appeal-err" id="appeal-err"></p>
    </div>

    <div class="terms" id="terms">
      <div class="terms-head" id="terms-head">服务条款 · 摘要</div>
      <ol class="terms-list" id="terms-list"></ol>
    </div>

    <div class="foot">
      <span id="foot-main"></span><br>
      <span id="foot-sub"></span>
    </div>
  </div>
  <div class="parody" id="parody"></div>
</div>

<!-- ========== home ========== -->
<div class="stage" id="stage-home">
  <div class="home">
    <div class="mark">R</div>
    <div class="wordmark">RTSX</div>
    <h1 id="greeting">你好</h1>
    <p class="home-sub" id="home-sub">挑一个开始玩</p>

    <div class="grid" id="game-grid">
      <button class="tile feature" type="button" data-file="games/67/index.html" data-title="67 专辑"
              data-name-zh="67 专辑" data-name-en="67 Album"
              data-desc-zh="3D 小游戏合集 · 收集散落的 67" data-desc-en="3D mini-game album · collect the scattered 67s">
        <span class="ico" aria-hidden="true">
          <svg viewBox="0 0 42 42" fill="none">
            <path d="M21 4 36 12.5v17L21 38 6 29.5v-17z" stroke="currentColor" stroke-width="2"/>
            <path d="M6 12.5 21 21l15-8.5M21 21v17" stroke="currentColor" stroke-width="2" opacity=".55"/>
          </svg>
        </span>
        <span class="txt">
          <span class="name" data-name>67 专辑</span>
          <span class="desc" data-desc>3D 小游戏合集 · 收集散落的 67</span>
          <span class="go">Enter <span aria-hidden="true">→</span></span>
        </span>
      </button>

      <button class="tile feature" type="button" data-file="TextGame/下载.htm" data-title="67-3A大作"
              data-name-zh="67-3A大作" data-name-en="67 · 3A Blockbuster"
              data-desc-zh="第一人称 3D 大作 · 手机横屏即玩，电脑锁鼠标" data-desc-en="First-person 3D shooter · landscape on phone, mouse-lock on desktop">
        <span class="ico" aria-hidden="true">
          <svg viewBox="0 0 42 42" fill="none">
            <circle cx="21" cy="21" r="12.5" stroke="currentColor" stroke-width="2"/>
            <circle cx="21" cy="21" r="3.2" fill="currentColor" opacity=".9"/>
            <path d="M21 3.5v6.5M21 32v6.5M3.5 21h6.5M32 21h6.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="txt">
          <span class="name" data-name>67-3A大作</span>
          <span class="desc" data-desc>第一人称 3D 大作 · 手机横屏即玩，电脑锁鼠标</span>
          <span class="go">Enter <span aria-hidden="true">→</span></span>
        </span>
      </button>
      <button class="tile" type="button" data-file="games/2048.html" data-title="2048"
              data-name-zh="2048" data-name-en="2048"
              data-desc-zh="滑动合并数字，冲击 2048" data-desc-en="Slide and merge tiles to reach 2048">
        <span class="ico" aria-hidden="true">
          <svg viewBox="0 0 42 42" fill="none">
            <rect x="3" y="3" width="16" height="16" rx="4" stroke="currentColor" stroke-width="2"/>
            <rect x="23" y="10" width="16" height="16" rx="4" fill="currentColor" opacity=".85"/>
            <rect x="3" y="23" width="16" height="16" rx="4" fill="currentColor" opacity=".32"/>
            <rect x="23" y="30" width="16" height="16" rx="4" stroke="currentColor" stroke-width="2"/>
          </svg>
        </span>
        <span class="name" data-name>2048</span>
        <span class="desc" data-desc>滑动合并数字，冲击 2048</span>
        <span class="go">Play <span aria-hidden="true">→</span></span>
      </button>

      <button class="tile" type="button" data-file="games/snake.html" data-title="贪吃蛇"
              data-name-zh="贪吃蛇" data-name-en="Snake"
              data-desc-zh="越吃越长，别撞墙也别咬到自己" data-desc-en="Eat, grow, and avoid walls and your tail">
        <span class="ico" aria-hidden="true">
          <svg viewBox="0 0 42 42" fill="none">

(function () {

    { url: "https://api.country.is/", read: function (j) { return j && j.country; } },
    { url: "https://ipapi.co/json/",  read: function (j) { return j && j.country_code; } },

  ];

  var COPY = {

      appealPlaceholder: "XXXXXXXX",
      appealErr: "That verification code is invalid. The appeal was not accepted.",
      footMain: "If you believe this decision was made in error, submit one appeal above and our safety team will review it within 5 business days.",
      footSub: "For anything else, use the appeal channel above.",

      homeFoot: "All games run locally · no network, no external assets",

      parody: "Demo page — not affiliated with any real company or service"
    }
  };

  var el = {
    boot: document.getElementById("stage-boot"),
    ban: document.getElementById("stage-ban"),
    home: document.getElementById("stage-home"),
    banTitle: document.getElementById("ban-title"),
    banLede: document.getElementById("ban-lede"),

    refId: document.getElementById("ref-id"),

    appealSubmit: document.getElementById("code-submit"),

    homeSub: document.getElementById("home-sub"),

    modal: document.getElementById("game-modal"),
    gameTitle: document.getElementById("game-title"),

    gameClose: document.getElementById("game-close"),
    toast: document.getElementById("toast")
  };

  /* ================= 音效（WebAudio 合成，零外部文件） ================= */
  var SFX = (function () {
    var ctx = null, on = true, out = null;
    try { on = localStorage.getItem("rtsx.sound.v1") !== "off"; } catch (e) {}
    function ac() {
      if (!ctx) {
        var C = window.AudioContext || window.webkitAudioContext;
        if (!C) return null;
        try { ctx = new C(); } catch (e) { return null; }
      }
      if (ctx.state === "suspended") { try { ctx.resume(); } catch (e) {} }
      if (!out) {
        out = ctx.createDynamicsCompressor();      // 限制器：音量拉满也不炸耳朵
        out.threshold.value = -2;
        out.knee.value = 20;
        out.ratio.value = 12;
        out.attack.value = 0.004;
        out.release.value = 0.2;
        out.connect(ctx.destination);
      }
      return ctx;
    }
    function tone(f, dur, type, gain, delay, to) {
      if (!on) return;
      var c = ac(); if (!c) return;
      var t0 = c.currentTime + (delay || 0);
      var o = c.createOscillator(), g = c.createGain();
      o.type = type || "sine";
      o.frequency.setValueAtTime(f, t0);
      if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(Math.min(0.99, (gain || 0.05) * 14), t0 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(out || c.destination);
      o.start(t0); o.stop(t0 + dur + 0.03);
    }
    var api = {
      click: function () { tone(520, 0.055, "triangle", 0.045); },
      open:  function () { tone(420, 0.09, "sine", 0.045, 0, 620); },
      ok:    function () { tone(660, 0.1, "sine", 0.05); tone(880, 0.12, "sine", 0.05, 0.1); },
      bad:   function () { tone(210, 0.14, "square", 0.04, 0, 140); },
      isOn:  function () { return on; },
      set:   function (v) { on = v; try { localStorage.setItem("rtsx.sound.v1", v ? "on" : "off"); } catch (e) {} }
    };
    window.addEventListener("storage", function (e) {
      if (e.key === "rtsx.sound.v1") on = e.newValue !== "off";
    });
    return api;
  })();

  var sndBtn = document.getElementById("snd");
  function paintSnd() { if (sndBtn) sndBtn.classList.toggle("off", !SFX.isOn()); }
  paintSnd();
  if (sndBtn) sndBtn.addEventListener("click", function () {
    SFX.set(!SFX.isOn()); paintSnd(); if (SFX.isOn()) SFX.click();
  });
  window.addEventListener("storage", paintSnd);

  /* ================= 资源预载：给慢网络一个进度条 ================= */
  var ASSETS = [
    "games/67/index.html",
    "games/67/collect.html",
    "games/67/maze.html",
    "games/2048.html",
    "games/snake.html",
    "games/breakout.html",
    "games/memory.html",
    "games/minesweeper.html"
  ];

  var bootReady = false, ipReady = false, pendingEnter = null;
  var loadFill = document.getElementById("load-fill"), loadPct = document.getElementById("load-pct");

  function setProgress(v) {
    var pct = Math.round(Math.max(0, Math.min(1, v)) * 100);
    if (loadFill) loadFill.style.width = pct + "%";
    if (loadPct) loadPct.textContent = pct + "%";
  }

  function checkEnter() {
    if (!pendingEnter || !bootReady || !ipReady) return;
    var fn = pendingEnter;
    pendingEnter = null;
    fn();
  }
  function gate(fn) { pendingEnter = fn; checkEnter(); }

  /* 3A 大作有 1.4MB，不塞进大厅进度条，等大厅出来再在后台悄悄预热 */
  var WARM = ["TextGame/下载.htm"];
  function warmHeavy() {
    if (!window.fetch) return;
    var go = function () {
      WARM.forEach(function (u) {
        fetch(u, { credentials: "same-origin" }).catch(function () {});
      });
    };
    if (window.requestIdleCallback) requestIdleCallback(go, { timeout: 4000 });
    else setTimeout(go, 1500);
  }
  function preload() {
    var t0 = Date.now(), done = 0, total = ASSETS.length || 1, settled = false;

    function finish() {
      if (settled) return;
      settled = true;
      setProgress(1);
      bootReady = true;
      checkEnter();
      warmHeavy();
    }

    setProgress(0);
    var bump = function () {
      done++;
      setProgress(done / total);
      if (done >= total) {
        // 留一点时间让进度条走完，避免一闪而过
        var wait = Math.max(0, 700 - (Date.now() - t0));
        setTimeout(finish, wait);
      }
    };

    ASSETS.forEach(function (u) {
      if (!window.fetch) { bump(); return; }
      fetch(u, { credentials: "same-origin" })
        .then(function (r) { return r.text(); })
        .then(bump, bump);
    });

    // 网络卡住也不要一直停在进度条上
    setTimeout(finish, 8000);
  }

  /* ================= 永久状态存储 ================= */
  function readState() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw) return null;
      var o = JSON.parse(raw);
      return o && o.state ? o : null;
    } catch (e) { return null; }
  }
  function writeState(state, lang) {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({ state: state, lang: lang, at: Date.now() }));
    } catch (e) { /* 隐私模式等，静默降级 */ }
  }
  function clearState() {
    try { localStorage.removeItem(STORE_KEY); } catch (e) {}
  }

  /* ================= IP 归属地（只取国家代码） ================= */
  function probe(p) {
    var ctrl = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 5000);
    var opt = { cache: "no-store", credentials: "omit", headers: { "Accept": "application/json" } };
    if (ctrl) opt.signal = ctrl.signal;

    return fetch(p.url, opt).then(function (r) {
      if (!r.ok) throw new Error("http " + r.status);
      return r.json();
    }).then(function (j) {
      var code = p.read(j);
      if (!code || typeof code !== "string" || code.trim().length !== 2) throw new Error("no country");
      return code.trim().toUpperCase();
    }).then(function (code) {
      clearTimeout(timer);
      return code;
    }, function (e) {
      clearTimeout(timer);
      throw e;
    });
  }

  function anyCountry() {
    if (!window.fetch) return Promise.reject(new Error("no fetch"));
    if (!Promise.any) {
      return new Promise(function (resolve, reject) {
        var queue = PROVIDERS.slice(), lastErr = null;
        (function next() {
          if (!queue.length) return reject(lastErr || new Error("all failed"));
          probe(queue.shift()).then(resolve, function (e) { lastErr = e; next(); });
        })();
      });
    }
    return Promise.any(PROVIDERS.map(probe));
  }

  /* ================= 文案与语言 ================= */
  function pickLang(country) {
    if (country && CHINA_REGIONS.indexOf(country) !== -1) return "zh";
    if (country) return "en";
    var nav = (navigator.language || "").toLowerCase();
    return nav.indexOf("zh") === 0 ? "zh" : "en";
  }

  function applyCopy(lang) {
    var c = COPY[lang] || COPY.zh;
    document.documentElement.lang = c.lang;
    el.banTitle.textContent = c.banTitle;
    el.banLede.textContent = c.banLede;
    el.refLabel.textContent = c.refLabel;
    el.appealToggle.textContent = c.appealToggle;
    el.termsToggle.textContent = c.termsToggle;
    el.termsHead.textContent = c.termsHead;
    el.termsList.innerHTML = "";
    c.termsList.forEach(function (t) {
      var li = document.createElement("li");
      li.textContent = t;
      el.termsList.appendChild(li);
    });
    el.appealLabel.textContent = c.appealLabel;
    el.appealNote.textContent = c.appealNote;
    el.appealSubmit.textContent = c.appealSubmit;
    el.input.placeholder = c.appealPlaceholder;
    el.appealErr.textContent = c.appealErr;
    el.footMain.textContent = c.footMain;
    el.footSub.textContent = c.footSub;
    el.homeSub.textContent = c.homeSub;
    el.homeFoot.textContent = c.homeFoot;

    var tiles = el.grid.querySelectorAll(".tile");
    for (var i = 0; i < tiles.length; i++) {
      var t = tiles[i];
      t.querySelector("[data-name]").textContent = t.getAttribute(lang === "zh" ? "data-name-zh" : "data-name-en");
      t.querySelector("[data-desc]").textContent = t.getAttribute(lang === "zh" ? "data-desc-zh" : "data-desc-en");
    }
    el.parody.textContent = c.parody;

    var h = new Date().getHours();
    if (h < 5) el.greeting.textContent = c.greeting[0];
    else if (h < 12) el.greeting.textContent = c.greeting[1];
    else if (h < 18) el.greeting.textContent = c.greeting[2];
    else el.greeting.textContent = c.greeting[3];
  }

  function makeRef() {
    var hex = "0123456789ABCDEF", a = "", b = "";
    for (var i = 0; i < 4; i++) a += hex.charAt(Math.floor(Math.random() * 16));
    for (var k = 0; k < 4; k++) b += hex.charAt(Math.floor(Math.random() * 16));
    return a + "-" + b;
  }

  /* ================= 视图切换 ================= */
  function show(stage) {
    el.boot.classList.remove("on");
    setTimeout(function () { stage.classList.add("on"); }, 120);
  }

  var currentLang = "zh";

  function enterBan(lang, persist) {
    currentLang = lang;
    applyCopy(lang);
    el.refId.textContent = makeRef();
    if (persist) writeState("banned", lang);
    show(el.ban);
  }

  function enterHome(lang) {
    currentLang = lang;
    applyCopy(lang);
    show(el.home);
  }

  function toast(text) {
    el.toast.textContent = text;
    el.toast.classList.add("show");
    setTimeout(function () { el.toast.classList.remove("show"); }, 2400);
  }

  /* ================= 申诉：输入 {open:ban--ip} 解封 ================= */
  el.appealToggle.addEventListener("click", function () {
    SFX.click();
    var open = el.appeal.classList.toggle("open");
    if (open) setTimeout(function () { el.input.focus(); }, 60);
  });

  el.termsToggle.addEventListener("click", function () {
    SFX.click();
    el.terms.classList.toggle("open");
  });

  function tryUnlock() {
    var val = (el.input.value || "").trim();
    if (val === UNLOCK_CODE) {
      el.appealErr.classList.remove("show");
      writeState("unlocked", currentLang);   // 永久解除，重开页面也不再封
      SFX.ok();
      enterHome(currentLang);
      toast(COPY[currentLang].toast);
      return;
    }
    SFX.bad();
    el.appealErr.classList.add("show");
    el.appeal.classList.remove("shake");
    void el.appeal.offsetWidth;
    el.appeal.classList.add("shake");
    el.input.select();
  }

  el.appealSubmit.addEventListener("click", tryUnlock);
  el.input.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); tryUnlock(); }
  });

  /* ================= 游戏弹层 ================= */
  function openGame(file, title) {
    el.gameTitle.textContent = title || "RTSX";
    el.gameFrame.src = file;
    el.gameNewWin.href = file;
    el.modal.classList.add("open");
    el.modal.setAttribute("aria-hidden", "false");
    document.body.classList.add("modal-open");
    document.body.style.overflow = "hidden";
  }

  function closeGame() {
    SFX.click();
    el.modal.classList.remove("open");
    el.modal.setAttribute("aria-hidden", "true");
    document.body.classList.remove("modal-open");
    el.gameFrame.src = "about:blank";     // 卸载页面，顺带停掉游戏循环
    document.body.style.overflow = "";
  }

  el.grid.addEventListener("click", function (e) {
    var tile = e.target.closest ? e.target.closest(".tile") : null;
    if (!tile) return;
    SFX.open();
    var nameEl = tile.querySelector("[data-name]");
    openGame(tile.getAttribute("data-file"), nameEl ? nameEl.textContent : "");
  });

  el.gameClose.addEventListener("click", closeGame);
  el.gameFrame.addEventListener("load", function () {
    try { el.gameFrame.contentWindow.focus(); } catch (e) {}
  });
  el.modal.addEventListener("mousedown", function (e) {
    if (e.target === el.modal) closeGame();
  });
  window.addEventListener("message", function (e) {
    if (e && e.data === "rtsx-close") closeGame();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && el.modal.classList.contains("open")) closeGame();
  });

  /* ================= 启动 ================= */
  function run() {
    var qs = new URLSearchParams(location.search);
    var force = (qs.get("force") || "").toLowerCase();

    if (qs.get("reset") === "1") clearState();

    if (force === "ban")  {
      enterBan("zh", false);
      var panel = (qs.get("panel") || qs.get("appeal") === "1" ? (qs.get("panel") || "appeal") : "").toLowerCase();
      if (panel === "appeal") el.appeal.classList.add("open");   // 调试：展开申诉框
      if (panel === "terms")  el.terms.classList.add("open");    // 调试：展开条款
      return;
    }
    if (force === "home") {
      bootReady = true; ipReady = true;
      enterHome(qs.get("lang") === "zh" ? "zh" : "en");
      return;
    }

    var stored = readState();
    if (stored && stored.state === "banned") {       // 已永久封禁：直接出封禁页，不必等资源
      enterBan(stored.lang === "en" ? "en" : "zh", false);
      return;
    }

    preload();

    if (stored && stored.state === "unlocked") {
      var lang = stored.lang === "en" ? "en" : "zh";
      ipReady = true;
      gate(function () { enterHome(lang); });
      return;
    }

    var t0 = Date.now();
    var decided = false;
    var settle = function (country) {
      if (decided) return;
      decided = true;
      var wait = Math.max(0, 700 - (Date.now() - t0));
      setTimeout(function () {
        ipReady = true;
        gate(function () {
          if (country && CHINA_REGIONS.indexOf(country) !== -1) {
            enterBan("zh", true);         // 国内 IP：永久记录为封禁
          } else {
            enterHome(pickLang(country)); // 其它地区：正常首页，不写入状态
          }
        });
      }, wait);
    };

    var guard = setTimeout(function () { settle(null); }, 8000);

    anyCountry().then(function (code) {
      clearTimeout(guard);
      settle(code);
    }, function () {
      clearTimeout(guard);
      settle(null);
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", run);
  } else {
    run();
  }
})();
</script>
</body>
</html>
