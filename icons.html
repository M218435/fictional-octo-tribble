<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F4F1EA">
<title>图标库 · RTSX</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="stylesheet" href="assets/ui/site-ui.css">
<script>
(function(){
  try{
    var p = JSON.parse(localStorage.getItem("rtsx.ui.v1")||"{}");
    var t = p.theme || "auto";
    var dark = t === "dark" || (t === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.setAttribute("data-rtsx-theme", dark ? "dark" : "light");
    if (p.radius) document.documentElement.setAttribute("data-rtsx-radius", p.radius);
    if (p.fs) document.documentElement.setAttribute("data-rtsx-fs", p.fs);
    if (p.motion) document.documentElement.setAttribute("data-rtsx-motion", p.motion);
  }catch(e){}
})();
</script>
<style>
  .rpage .lede{ display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:8px; }
  .rpage .lede .tagline{
    font-family:Georgia,"Times New Roman",serif;font-size:11px;letter-spacing:.22em;
    text-transform:uppercase;color:var(--ui-dim-2);padding-bottom:5px;
  }
  .ihead{ display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:18px 0 12px; }
  .ihead .count{ font-size:11.5px;color:var(--ui-dim-2);letter-spacing:.04em; }
  .ihead .hint{ margin-left:auto;font-size:11px;color:var(--ui-dim-2); }
  .board{
    padding:14px;background:var(--ui-surface);
    border:1px solid var(--ui-line);border-radius:calc(var(--ui-r) + 2px);
    box-shadow:0 15px 34px -26px rgba(48,36,24,.4);
  }
  .board .igrid{ margin-top:2px; }
  .icell.on-dark{ background:linear-gradient(160deg,#2C2823,#211E19);border-color:#332E28; }
  .icell.on-dark img{ filter:none; }
  .icell.on-dark span{ color:#C9C2B6; }
  .icell.alt{ background:var(--ui-surface-2); }
  .icell.on-light{ background:var(--ui-surface); }
  .icell.on-light img{ filter:invert(1) opacity(.82); }
  .boardset{ display:flex;gap:8px;align-items:center;margin-left:auto; }
</style>
</head>
<body class="rpage">
<div class="wrap">
  <div class="pbar">
    <span class="mark">R</span>
    <div class="wm"><b>RTSX</b><span>Icon library</span></div>
    <a class="back" href="index.html"><img src="assets/icons/left.svg" alt="">返回大厅</a>
  </div>

  <div class="lede">
    <h1>图标库</h1>
    <span class="tagline">site icons · 58</span>
  </div>
  <p class="sub">这是站点自己用的那一套，共 58 个。全部为 10×10 网格的单色 SVG，原始文件是白色描边，所以给了「深底 / 浅底」两种预览，按实际放置的底色挑。点任意一个复制它的路径。完整图标包只在本地保留，不随站点发布。</p>

  <div class="ihead">
    <div class="ifilter" id="filters"></div>
    <span class="count" id="count"></span>
    <span class="boardset">
      <span class="seg" data-board="seg">
        <button type="button" data-board="dark" aria-pressed="true">深底</button>
        <button type="button" data-board="light" aria-pressed="false">浅底</button>
      </span>
      <button type="button" class="rbtn2" id="copy-base">复制目录</button>
    </span>
  </div>

  <div class="board"><div class="igrid" id="grid"></div></div>

  <div class="pfoot" style="margin-top:20px;font-size:11.5px;color:var(--ui-dim-2);line-height:1.8;">
    许可：图标包允许个人与商业使用、无需署名，禁止转售图标包本身。因此线上只发布站点自用的 58 个，原始包不入库、不出现在任何公开路径。
  </div>
</div>

<script src="assets/ui/site-ui.js" data-surface="light"></script>
<script>
(function(){
  "use strict";
  var PACK = "assets/icons/";
  var board = "dark";
  var cat = "";
  var q = "";
  var all = [], cats = [];
  var grid = document.getElementById("grid");
  var filters = document.getElementById("filters");
  var countEl = document.getElementById("count");

  function el(t,c,h){ var e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e; }

  function paint(){
    var list = all.filter(function(it){
      if (cat && it.c !== cat) return false;
      if (!q) return true;
      return (it.n + " " + it.f).toLowerCase().indexOf(q) !== -1;
    });
    countEl.textContent = list.length + " / " + all.length + " 个";
    grid.innerHTML = "";
    var frag = document.createDocumentFragment();
    list.forEach(function(it){
      var cell = el("button", "icell" + (board === "dark" ? " on-dark" : " on-light"));
      cell.type = "button";
      cell.title = it.n;
      cell.setAttribute("aria-label", it.n);
      cell.innerHTML = '<img loading="lazy" src="' + PACK + it.f + '" alt="" width="26" height="26"><span>' + it.n + "</span>";
      cell.addEventListener("click", function(){
        copy(PACK + it.f, it.n);
      });
      frag.appendChild(cell);
    });
    grid.appendChild(frag);
  }

  function copy(text, name){
    var done = function(){
      if (window.RTSXUI) RTSXUI.toast("已复制 " + name);
      else {
        var t = el("div", "ritoast on"); t.textContent = "已复制 " + name;
        document.body.appendChild(t); setTimeout(function(){ t.remove(); }, 1600);
      }
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function(){ fallback(); });
    } else fallback();
    function fallback(){
      var ta = el("textarea"); ta.value = text; ta.style.position="fixed"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); done(); } catch(e){}
      ta.remove();
    }
  }

  function buildFilters(){
    filters.innerHTML = "";
    var b0 = el("button","fbtn", "全部");
    b0.type = "button";
    b0.setAttribute("aria-pressed", cat === "" ? "true" : "false");
    b0.addEventListener("click", function(){ cat = ""; buildFilters(); paint(); });
    filters.appendChild(b0);
    cats.forEach(function(name){
      var b = el("button","fbtn", name);
      b.type = "button";
      b.setAttribute("aria-pressed", cat === name ? "true" : "false");
      b.addEventListener("click", function(){ cat = name; buildFilters(); paint(); });
      filters.appendChild(b);
    });
    var inp = el("input");
    inp.type = "search";
    inp.placeholder = "搜索名称，例如 设置 / 音量 / 菜单";
    inp.value = q;
    inp.addEventListener("input", function(){ q = inp.value.trim().toLowerCase(); paint(); });
    filters.appendChild(inp);
  }

  document.querySelectorAll("[data-board]").forEach(function(b){
    if (b.getAttribute("data-board") === "seg") return;
    b.addEventListener("click", function(){
      board = b.getAttribute("data-board");
      document.querySelectorAll("[data-board]").forEach(function(x){
        if (x.getAttribute("data-board") === "seg") return;
        x.setAttribute("aria-pressed", x === b ? "true" : "false");
      });
      paint();
    });
  });
  document.getElementById("copy-base").addEventListener("click", function(){
    copy("assets/icons/", "站点图标目录");
  });

  fetch("assets/icons/site-icons.json").then(function(r){ return r.json(); }).then(function(m){
    all = m.icons || []; cats = m.cats || [];
    buildFilters();
    paint();
  }).catch(function(){
    grid.innerHTML = '<div class="rempty" style="padding:30px;text-align:center;color:var(--ui-dim-2)">图标清单读取失败，请确认 assets/icons/site-icons.json 存在。</div>';
  });
})();
</script>
</body>
</html>
