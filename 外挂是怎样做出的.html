<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>外挂是怎样做出的？｜vibe知识</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2304060c'/%3E%3Cpath d='M16 6 26 16 16 26 6 16z' fill='none' stroke='%237fd6ff' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='2.4' fill='%23ff5a3c'/%3E%3C/svg%3E">
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #03040a;
    overflow: hidden;
    font-family: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #stage {
    position: fixed; inset: 0;
    display: grid; place-items: center;
    cursor: none;
    background: #03040a;
  }
  #film {
    display: block;
    width: min(100vw, calc(100vh * 16 / 9));
    height: auto;
    aspect-ratio: 16 / 9;
    background: #03040a;
  }
  #gate {
    position: fixed; inset: 0; z-index: 20;
    display: grid; place-items: center;
    background: radial-gradient(circle at 50% 45%, #080e1c 0%, #03040a 62%);
    cursor: default;
    transition: opacity .55s ease, visibility .55s;
  }
  #gate.out { opacity: 0; visibility: hidden; pointer-events: none; }
  .gate-inner { width: min(720px, 82vw); text-align: left; }
  .kicker {
    font: 500 12px/1 "Cascadia Mono", Consolas, monospace;
    letter-spacing: .34em;
    color: #4a93b8;
    text-transform: uppercase;
    margin-bottom: 26px;
  }
  .gate-title {
    font-size: clamp(28px, 4.4vw, 54px);
    font-weight: 700;
    letter-spacing: .02em;
    color: #e9eef7;
    margin: 0 0 10px;
  }
  .gate-en {
    font: 400 13px/1.5 "Cascadia Mono", Consolas, monospace;
    letter-spacing: .22em;
    color: #68788e;
    margin: 0 0 34px;
    text-transform: uppercase;
  }
  .gate-meta {
    display: flex; flex-wrap: wrap; gap: 10px 22px;
    font: 400 13px/1.6 "Cascadia Mono", Consolas, monospace;
    color: #68788e;
    margin-bottom: 34px;
    padding-top: 22px;
    border-top: 1px solid rgba(127, 214, 255, .16);
  }
  .gate-meta b { color: #9fb3c8; font-weight: 500; }
  #start {
    appearance: none; border: 1px solid rgba(127, 214, 255, .5);
    background: transparent; color: #e9eef7;
    font: 500 15px/1 "Microsoft YaHei UI", sans-serif;
    letter-spacing: .16em;
    padding: 16px 34px;
    cursor: pointer;
    transition: background .25s, border-color .25s, color .25s;
  }
  #start:hover { background: rgba(127, 214, 255, .1); border-color: #7fd6ff; }
  #start:focus-visible { outline: 2px solid #7fd6ff; outline-offset: 4px; }
  .gate-hint {
    margin-top: 20px;
    font: 400 12px/1.9 "Cascadia Mono", Consolas, monospace;
    color: #46566b;
    letter-spacing: .06em;
  }
  @media (max-width: 640px) {
    .gate-meta { font-size: 11px; }
    #start { padding: 14px 24px; width: 100%; }
  }
</style>
</head>
<body>
<div id="stage"><canvas id="film" width="1920" height="1080" aria-label="外挂是怎样做出的：反作弊机制科普短片"></canvas></div>

<div id="gate">
  <div class="gate-inner">
    <div class="kicker">vibe 知识 · 反作弊科普</div>
    <h1 class="gate-title">外挂是怎样做出的？</h1>
    <p class="gate-en">How a game cheat is made — and why it keeps dying</p>
    <div class="gate-meta">
      <span>时长 <b>02:06</b></span>
      <span>画幅 <b>16:9 / 1920×1080</b></span>
      <span>音轨 <b>BGM + 25 处音效</b></span>
      <span>镜头 <b>9</b></span>
    </div>
    <button id="start" type="button">开始播放</button>
    <div class="gate-hint">空格 播放/暂停　← → 快退/快进 2 秒　R 重播　H 隐藏界面　F 全屏　M 静音（BGM 与音效）<br>录屏建议：全屏后按 H 隐藏进度条，鼠标 2 秒不动会自动隐藏。把 bgm.mp3 放在本文件同目录，点开始即同步播放。</div>
  </div>
</div>

<script>
'use strict';

/* ============ 基础常量 ============ */
const W = 1920, H = 1080;
const TOTAL = 126.04;

const C = {
  ink:    '#03040a',
  deep:   '#080e1c',
  panel:  '#0a1120',
  cyan:   '#7fd6ff',
  cyan2:  '#4a93b8',
  hot:    '#ff5a3c',
  hot2:   '#a33a28',
  text:   '#e9eef7',
  mute:   '#68788e',
  faint:  'rgba(127,214,255,0.14)'
};

const F = {
  cn:   '"Microsoft YaHei","Microsoft YaHei UI","PingFang SC","Noto Sans SC",sans-serif',
  mono: '"Cascadia Mono",Consolas,"Courier New",monospace'
};

const cvs = document.getElementById('film');
const ctx = cvs.getContext('2d', { alpha: false });
const gate = document.getElementById('gate');

function fitCanvas() {
  const dpr = Math.min(2, Math.max(1, window.devicePixelRatio || 1));
  cvs.width = Math.round(W * dpr);
  cvs.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
fitCanvas();

/* ============ 工具 ============ */
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const eo = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const eio = t => { t = clamp(t, 0, 1); return t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; };
const back = t => { t = clamp(t, 0, 1); const s = 1.6; return 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2); };
const rnd = i => { const x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); };
const jitter = i => (rnd(i * 3.1) + rnd(i * 3.1 + 11) + rnd(i * 3.1 + 23)) - 1.5;
const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);

function T(str, x, y, o) {
  o = o || {};
  ctx.save();
  ctx.font = (o.weight || 400) + ' ' + (o.size || 24) + 'px ' + (o.font || F.cn);
  ctx.fillStyle = o.color || C.text;
  ctx.textAlign = o.align || 'left';
  ctx.textBaseline = o.base || 'alphabetic';
  ctx.globalAlpha = ctx.globalAlpha * (o.a === undefined ? 1 : o.a);
  if (o.ls) ctx.letterSpacing = o.ls + 'px';
  ctx.shadowColor = 'transparent';
  ctx.shadowBlur = 0;
  ctx.shadowOffsetY = 0;
  if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = o.glowBlur || 18; }
  if (o.rise) { ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 22; ctx.shadowOffsetY = 5; }
  ctx.fillText(str, x, y);
  ctx.restore();
}

function hair(x, y, w, a, color) {
  ctx.save();
  ctx.globalAlpha *= (a === undefined ? 1 : a);
  ctx.fillStyle = color || 'rgba(127,214,255,0.55)';
  ctx.fillRect(x, y, w, 1);
  ctx.restore();
}

function panel(x, y, w, h, o) {
  o = o || {};
  ctx.save();
  ctx.globalAlpha *= (o.a === undefined ? 1 : o.a);
  ctx.fillStyle = o.fill || 'rgba(9,15,28,0.55)';
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = o.stroke || 'rgba(127,214,255,0.16)';
  ctx.lineWidth = 1;
  ctx.strokeRect(x + .5, y + .5, w - 1, h - 1);
  // 角标
  const s = 14;
  ctx.strokeStyle = o.tick || 'rgba(127,214,255,0.42)';
  ctx.beginPath();
  ctx.moveTo(x, y + s); ctx.lineTo(x, y); ctx.lineTo(x + s, y);
  ctx.moveTo(x + w - s, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + s);
  ctx.moveTo(x, y + h - s); ctx.lineTo(x, y + h); ctx.lineTo(x + s, y + h);
  ctx.moveTo(x + w - s, y + h); ctx.lineTo(x + w, y + h); ctx.lineTo(x + w, y + h - s);
  ctx.stroke();
  ctx.restore();
}

function tag(str, x, y, color, a) {
  T(str, x, y, { size: 15, font: F.mono, color: color || C.cyan2, ls: 2, a: a === undefined ? 1 : a });
}

/* ============ 背景（贯穿全片） ============ */
function drawBG(t) {
  const g = ctx.createRadialGradient(W * .5, H * .44, 80, W * .5, H * .5, W * .78);
  g.addColorStop(0, '#0a1022');
  g.addColorStop(.52, '#060a14');
  g.addColorStop(1, '#020307');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // 缓慢漂移的网格
  ctx.save();
  ctx.strokeStyle = 'rgba(127,214,255,0.05)';
  ctx.lineWidth = 1;
  const step = 120, off = (t * 6) % step;
  for (let x = -step; x <= W + step; x += step) {
    ctx.beginPath(); ctx.moveTo(x + off, 0); ctx.lineTo(x + off, H); ctx.stroke();
  }
  for (let y = -step; y <= H + step; y += step) {
    ctx.beginPath(); ctx.moveTo(0, y + off * .6); ctx.lineTo(W, y + off * .6); ctx.stroke();
  }
  ctx.restore();

  // 浮尘
  ctx.save();
  for (let i = 0; i < 46; i++) {
    const sx = rnd(i * 7.3) * W;
    const sy0 = rnd(i * 5.1) * H;
    const sp = 0.6 + rnd(i * 9.7) * 1.6;
    const sy = (sy0 - t * sp * 8 + H * 2) % (H + 60) - 30;
    const a = 0.05 + rnd(i * 13.1) * 0.12;
    ctx.globalAlpha = a;
    ctx.fillStyle = i % 7 === 0 ? C.hot : C.cyan;
    ctx.fillRect(sx, sy, 2, 2);
  }
  ctx.restore();

  // 暗角
  const v = ctx.createRadialGradient(W * .5, H * .5, H * .42, W * .5, H * .5, H * .95);
  v.addColorStop(0, 'rgba(0,0,0,0)');
  v.addColorStop(1, 'rgba(0,0,0,0.72)');
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, W, H);
}

/* ============ 字幕 ============ */
const CUES = [
  { t0: 4.57,  t1: 8.0,  cn: '接下来两分钟，只看它为什么活不长。', en: 'The next two minutes: why it never survives.' },
  { t0: 8.32,  t1: 13.6, cn: '在你自己的电脑上，一个游戏只有三样东西。', en: 'On your own machine, a game is only three things.' },
  { t0: 14.11, t1: 19.4, cn: '内存里的数字，屏幕上的像素，网线上的封包。', en: 'Numbers in memory. Pixels on screen. Packets on the wire.' },
  { t0: 20.21, t1: 26.0, cn: '外挂不创造力量。它只是从这三处之一伸手进去。', en: 'A cheat creates nothing. It reaches into one of these three.' },
  { t0: 26.43, t1: 31.6, cn: '最老的一种：去读你机器里的内存。', en: 'The oldest kind: it reads the memory on your machine.' },
  { t0: 31.59, t1: 38.0, cn: '血量、金币、坐标，在程序里只是一个整数。', en: 'Health, gold, position \u2014 in code, just an integer.' },
  { t0: 37.98, t1: 43.4, cn: '改它，比玩它容易得多。', en: 'Rewriting it is far easier than playing it.' },
  { t0: 43.59, t1: 48.0, cn: '它不需要理解游戏，只需要找到那个数字。', en: 'It never has to understand the game. Only find the number.' },
  { t0: 48.32, t1: 54.2, cn: '第二种不改数据。它替你的手按鼠标。', en: 'The second kind edits nothing. It presses the mouse for you.' },
  { t0: 54.19, t1: 59.0, cn: '鼠标、键盘、屏幕颜色，都是可读写的输入输出。', en: 'Mouse, keyboard, screen colour: all readable, all writable.' },
  { t0: 58.94, t1: 64.0, cn: '人手的轨迹带弧度。脚本的轨迹是直线。', en: 'A hand arcs. A script draws a straight line.' },
  { t0: 64.4, t1: 70.2, cn: '第三种更远：不在你机器上，在你和服务器之间。', en: 'The third is further out: between you and the server.' },
  { t0: 70.21, t1: 75.8, cn: '改一个数，重放一次动作，把时间拨快一点。', en: 'Edit a value. Replay an action. Turn the clock up.' },
  { t0: 76.05, t1: 80.0, cn: '看起来很有效。直到你遇到一台不听话的服务器。', en: 'It works \u2014 until you meet a server that doesn\u2019t listen.' },
  { t0: 80.41, t1: 86.0, cn: '服务器从来不相信你的客户端。', en: 'The server never trusts your client.' },
  { t0: 85.99, t1: 92.0, cn: '伤害、掉落、命中，都由它自己算。客户端只负责画。', en: 'Damage, drops, hits: all computed there. The client only draws.' },
  { t0: 91.95, t1: 96.0, cn: '你屏幕上的 9999，在它那里从来没有发生过。', en: 'The 9999 on your screen never happened there.' },
  { t0: 96.47, t1: 102.2, cn: '所以真正的外挂生意，对手不是玩家，是检测。', en: 'So the real enemy of the cheat trade is not the player. It\u2019s detection.' },
  { t0: 102.14, t1: 107.6, cn: '机器最大的破绽，是它太准时。', en: 'A machine\u2019s biggest flaw: it is never late.' },
  { t0: 107.62, t1: 112.0, cn: '行为指纹、完整性校验、设备指纹、延迟封禁。', en: 'Behaviour, integrity, device fingerprints, delayed bans.' },
  { t0: 112.33, t1: 116.4, cn: '代价是账号、设备，以及《刑法》第二百八十五条。', en: 'The cost: your account, your device, and Article 285.' },
  { t0: 116.44, t1: 120.0, cn: '收益是一次胜利。账单是长期的。', en: 'The payoff is one win. The bill is long.' },
  { t0: 120.4, t1: 126.0, cn: '看懂了机制，也就看懂了它为什么活不长。', en: 'Understand the mechanism, and you understand why it dies young.' }
];

function drawSubs(t) {
  for (let i = 0; i < CUES.length; i++) {
    const c = CUES[i];
    if (t < c.t0 || t > c.t1) continue;
    const a = Math.min(1, (t - c.t0) / .35, (c.t1 - t) / .35);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.fillStyle = C.cyan;
    ctx.fillRect(96, 962, 2, 34);
    T(c.cn, 118, 992, { size: 37, weight: 600, color: C.text, a: 1 });
    T(c.en, 118, 1024, { size: 18, font: F.mono, color: 'rgba(159,179,200,0.66)', ls: 1.4 });
    ctx.restore();
  }
}

/* ============ 常驻界面 ============ */
let uiVisible = true;
let tc = '00:00';

function drawHUD(t) {
  if (!uiVisible) return;
  ctx.save();
  ctx.globalAlpha = .38;
  T('外挂是怎样做出的', 72, 68, { size: 17, weight: 500, color: '#9fb3c8', ls: 2 });
  ctx.globalAlpha = .22;
  T('HOW A CHEAT IS MADE', 72, 92, { size: 11, font: F.mono, color: '#9fb3c8', ls: 3.2 });
  ctx.restore();

  // 时间码
  const m = Math.floor(t / 60), s = Math.floor(t % 60);
  tc = (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  ctx.save();
  ctx.globalAlpha = .32;
  T(tc + ' / 02:06', W - 72, 68, { size: 15, font: F.mono, color: '#9fb3c8', align: 'right', ls: 1 });
  ctx.restore();

  // 进度
  ctx.save();
  ctx.globalAlpha = .9;
  ctx.fillStyle = 'rgba(127,214,255,0.10)';
  ctx.fillRect(0, H - 6, W, 1);
  ctx.fillStyle = 'rgba(127,214,255,0.62)';
  ctx.fillRect(0, H - 6, W * (t / TOTAL), 1);
  ctx.restore();
}

/* ============ 章节 ============ */
const CHAPTERS = [];
/* ---------- 01 · 钩子 ---------- */
CHAPTERS.push({
  t0: 0, t1: 8.59,
  draw(lt) {
    const vx = 300, vy = 186, vw = 1320, vh = 690;
    const cw = vw / 18, chh = vh / 9;

    // 游戏视口
    ctx.save();
    ctx.globalAlpha *= eo((lt - 0.27) / 1.0) * .95;
    ctx.strokeStyle = 'rgba(127,214,255,0.18)';
    ctx.lineWidth = 1;
    ctx.strokeRect(vx + .5, vy + .5, vw, vh);
    for (let gy = 0; gy < 9; gy++) {
      for (let gx = 0; gx < 18; gx++) {
        const v = rnd(gy * 31 + gx * 7);
        if (v < .66) continue;
        ctx.fillStyle = 'rgba(127,214,255,' + (.006 + v * .026) + ')';
        ctx.fillRect(vx + gx * cw + 3, vy + gy * chh + 3, cw - 6, chh - 6);
      }
    }
    // 准星
    const cx = vx + vw / 2, cy = vy + vh / 2;
    ctx.strokeStyle = 'rgba(127,214,255,0.30)';
    ctx.beginPath();
    ctx.moveTo(cx - 26, cy); ctx.lineTo(cx - 6, cy);
    ctx.moveTo(cx + 6, cy); ctx.lineTo(cx + 26, cy);
    ctx.moveTo(cx, cy - 26); ctx.lineTo(cx, cy - 6);
    ctx.moveTo(cx, cy + 6); ctx.lineTo(cx, cy + 26);
    ctx.stroke();
    ctx.restore();

    // 从准星长出的红色根须
    const gr = eo((lt - 2.63) / 2.6);
    if (gr > 0) {
      ctx.save();
      const n = 13;
      for (let i = 0; i < n; i++) {
        const ang = (i / n) * Math.PI * 2 + rnd(i) * .42;
        const len = (170 + rnd(i * 3.3) * 300) * gr;
        const bend = (rnd(i * 5.7) - .5) * 90;
        const x2 = cx + Math.cos(ang) * len;
        const y2 = cy + Math.sin(ang) * len * .62;
        ctx.strokeStyle = 'rgba(255,90,60,' + (.16 + .34 * gr) + ')';
        ctx.lineWidth = 1.1;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.quadraticCurveTo(cx + Math.cos(ang) * len * .55 + bend, cy + Math.sin(ang) * len * .34 - 8, x2, y2);
        ctx.stroke();
        ctx.fillStyle = 'rgba(255,90,60,' + (.30 * gr) + ')';
        ctx.fillRect(x2 - 1.5, y2 - 1.5, 3, 3);
      }
      ctx.globalAlpha *= gr * .9;
      ctx.fillStyle = 'rgba(255,90,60,0.9)';
      ctx.beginPath(); ctx.arc(cx, cy, 3.4, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    // 大字
    const a1 = eo((lt - 0.27) / .7);
    const a2 = eo((lt - 1.59) / .7);
    ctx.save();
    ctx.globalAlpha *= a1;
    T('外挂不在游戏外面。', W / 2, 500, { size: 88, weight: 700, color: C.text, align: 'center', rise: 1 });
    ctx.restore();
    ctx.save();
    ctx.globalAlpha *= a2;
    T('它长在数据里。', W / 2, 612, { size: 88, weight: 700, color: C.cyan, align: 'center', rise: 1 });
    ctx.restore();

    // 大字下的细分隔线
    const aw = eo((lt - 1.87) / .9);
    if (aw > 0) {
      ctx.save();
      ctx.globalAlpha *= aw * .8;
      ctx.fillStyle = 'rgba(127,214,255,0.55)';
      ctx.fillRect(W / 2 - 250 * aw, 654, 500 * aw, 1);
      ctx.restore();
    }
  }
});

/* ---------- 02 · 三样东西 ---------- */
CHAPTERS.push({
  t0: 8.59, t1: 26.62,
  draw(lt) {
    const ta = eo((lt - 0.27) / .8);
    ctx.save();
    ctx.globalAlpha *= ta;
    T('一个游戏，在你机器上', 110, 196, { size: 54, weight: 700, color: C.text });
    T('只有三样东西。', 110, 262, { size: 54, weight: 700, color: C.cyan });
    ctx.restore();

    const rows = [
      { y: 330, cn: '内存', en: 'MEMORY', tok: 'hp = 100', kind: 'grid' },
      { y: 500, cn: '画面', en: 'FRAMEBUFFER', tok: 'rgb(18,42,96)', kind: 'pixels' },
      { y: 670, cn: '网络', en: 'PACKETS', tok: 'pkt 0x2f / 24 B', kind: 'chev' }
    ];
    const x0 = 110, x1 = 1810;

    rows.forEach((r, i) => {
      const p = eo((lt - (3.4 + i * 2.5)) / .9);
      if (p <= 0) return;
      ctx.save();
      ctx.globalAlpha *= p;

      const yy = r.y + (1 - p) * 18;
      hair(x0, yy, x1 - x0, .5);
      hair(x0, yy + 132, x1 - x0, .18);

      // 左侧记号
      const mx = x0 + 34, my = yy + 66;
      ctx.strokeStyle = 'rgba(127,214,255,0.72)';
      ctx.fillStyle = 'rgba(127,214,255,0.5)';
      ctx.lineWidth = 1.2;
      if (r.kind === 'grid') {
        for (let a = 0; a < 4; a++) for (let b = 0; b < 4; b++) {
          const av = rnd(a * 9 + b * 3 + i);
          ctx.globalAlpha = ctx.globalAlpha * 1;
          ctx.fillStyle = 'rgba(127,214,255,' + (.18 + av * .5) + ')';
          ctx.fillRect(mx - 14 + a * 8, my - 14 + b * 8, 5, 5);
        }
      } else if (r.kind === 'pixels') {
        for (let a = 0; a < 3; a++) for (let b = 0; b < 3; b++) {

/* ============ 主渲染 ============ */
function render(t) {
  t = clamp(t, 0, TOTAL);
  ctx.globalAlpha = 1;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const dpr = cvs.width / W;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawBG(t);

  let ch = null;
  for (let i = 0; i < CHAPTERS.length; i++) {
    const c = CHAPTERS[i];
    if (t >= c.t0 && t < c.t1) { ch = c; break; }
  }
  if (!ch) ch = CHAPTERS[CHAPTERS.length - 1];

  const lt = t - ch.t0;
  const a = Math.min(1, (lt + .12) / .55, (ch.t1 - t) / .5);
  ctx.save();
  ctx.globalAlpha = a;
  ch.draw(lt, t);
  ctx.restore();

  drawSubs(t);
  drawHUD(t);
}

/* ============ 播放控制 ============ */
let tNow = 0, playing = false, lastNow = 0, ended = false;
const params = new URLSearchParams(location.search);

function loop(now) {
  if (playing) {
    if (!lastNow) lastNow = now;
    const dt = Math.min(.08, (now - lastNow) / 1000);
    lastNow = now;
    const tFrom = tNow;
    tNow += dt;
    /* 音画同步：以音频时钟为准，偏差超过 90ms 就校正，避免长片累积漂移 */
    if (bgmReady && bgmPending === null && !bgm.paused) {
      const at = bgm.currentTime;
      if (Math.abs(at - tNow) > .09) tNow = at;
    }
    if (tNow >= TOTAL) { tNow = TOTAL; playing = false; ended = true; bgmStop(); }
    sfxFire(tFrom, tNow);
    render(tNow);
  } else {
    lastNow = now;
  }
  requestAnimationFrame(loop);
}

/* ---------- 音效：全部 Web Audio 合成，不依赖外部文件 ---------- */
let actx = null, sfxBus = null, noiseBuf = null;

function sfxInit() {
  if (actx) return;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    actx = new AC();
    sfxBus = actx.createGain();
    sfxBus.gain.value = bgmMuted ? 0 : .24;
    sfxBus.connect(actx.destination);
  } catch (e) { actx = null; }
}
function sfxOn() { return !!(actx && !bgmMuted); }
function noiseBufGet() {
  if (noiseBuf || !actx) return noiseBuf;
  const n = Math.floor(actx.sampleRate * 1.2);
  noiseBuf = actx.createBuffer(1, n, actx.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  return noiseBuf;
}
function toneSfx(f, dur, amp, type) {
  if (!sfxOn()) return;
  const t = actx.currentTime;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type || 'triangle';
  o.frequency.value = f;
  g.gain.setValueAtTime(.0001, t);
  g.gain.exponentialRampToValueAtTime(amp, t + .006);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(sfxBus);
  o.start(t); o.stop(t + dur + .02);
}
function noiseSfx(dur, f0, f1, q, amp, type) {
  if (!sfxOn()) return;
  const buf = noiseBufGet();
  if (!buf) return;
  const t = actx.currentTime;
  const src = actx.createBufferSource(); src.buffer = buf;
  const flt = actx.createBiquadFilter();
  flt.type = type || 'bandpass';
  flt.Q.value = q || 1.1;
  flt.frequency.setValueAtTime(f0, t);
  flt.frequency.exponentialRampToValueAtTime(f1, t + dur * .8);
  const g = actx.createGain();
  g.gain.setValueAtTime(.0001, t);
  g.gain.exponentialRampToValueAtTime(amp, t + Math.min(.06, dur * .3));
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  src.connect(flt); flt.connect(g); g.connect(sfxBus);
  src.start(t); src.stop(t + dur + .02);
}
function sfxWhoosh() {
  noiseSfx(.34, 520, 2600, 1.1, .80);
  if (!sfxOn()) return;
  const t = actx.currentTime;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(120, t);
  o.frequency.exponentialRampToValueAtTime(46, t + .22);
  g.gain.setValueAtTime(.0001, t);
  g.gain.exponentialRampToValueAtTime(.55, t + .012);
  g.gain.exponentialRampToValueAtTime(.0001, t + .30);
  o.connect(g); g.connect(sfxBus); o.start(t); o.stop(t + .32);
}
function sfxClick()   { noiseSfx(.05, 1400, 1400, 1.6, .70, 'highpass'); toneSfx(2100, .045, .30); }
function sfxFast()    { noiseSfx(.035, 1900, 1900, 1.8, .45, 'highpass'); toneSfx(2600, .03, .18); }
function sfxSoft()    { toneSfx(980, .05, .26); }
function sfxDing()    { toneSfx(880, .5, .40); toneSfx(1320, .5, .18); }
function sfxDeny() {
  if (!sfxOn()) return;
  const t = actx.currentTime;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(300, t);
  o.frequency.exponentialRampToValueAtTime(80, t + .3);
  g.gain.setValueAtTime(.0001, t);
  g.gain.exponentialRampToValueAtTime(.5, t + .02);
  g.gain.exponentialRampToValueAtTime(.0001, t + .36);
  o.connect(g); g.connect(sfxBus); o.start(t); o.stop(t + .38);
  noiseSfx(.22, 800, 220, 1.4, .3, 'lowpass');
}
function sfxSwell() {
  if (!sfxOn()) return;
  const t = actx.currentTime;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(72, t);
  g.gain.setValueAtTime(.0001, t);
  g.gain.exponentialRampToValueAtTime(.45, t + .4);
  g.gain.exponentialRampToValueAtTime(.0001, t + 1.5);
  o.connect(g); g.connect(sfxBus); o.start(t); o.stop(t + 1.55);
}

function sfxPlay(k) {
  if (k === 'whoosh') sfxWhoosh();
  else if (k === 'click') sfxClick();
  else if (k === 'fast') sfxFast();
  else if (k === 'soft') sfxSoft();
  else if (k === 'ding') sfxDing();
  else if (k === 'deny') sfxDeny();
  else if (k === 'swell') sfxSwell();
}

/* ---------- 音轨：把 bgm.mp3 / bgm.wav 放在本文件同目录 ---------- */
const BGM_FILES = ['bgm.mp3', 'bgm.wav'];
let bgmFile = 0, bgmInit = false, bgmReady = false, bgmMuted = false, bgmPending = null;
const bgm = new Audio();
bgm.preload = 'auto';
bgm.volume = .62;
bgm.addEventListener('loadedmetadata', () => { bgmReady = true; bgmFlush(); });
bgm.addEventListener('canplay', () => { bgmReady = true; bgmFlush(); });
bgm.addEventListener('error', () => {
  if (bgmFile < BGM_FILES.length - 1) {
    bgmFile++;
    bgm.src = BGM_FILES[bgmFile];
    bgm.load();
  } else {
    bgmReady = false;
    bgmPending = null;
  }
});

function bgmFlush() {
  if (bgmPending === null || !bgmReady) return;
  bgmAt(bgmPending);
  bgmPending = null;
  bgm.play().catch(() => {});
}
function bgmAt(t) {
  if (!bgmReady) return;
  try { bgm.currentTime = Math.min(t, bgm.duration || TOTAL); } catch (e) {}
}
function bgmStart(t) {
  if (!bgmInit) { bgmInit = true; bgm.src = BGM_FILES[0]; bgm.load(); }
  if (!bgmReady) { bgmPending = t; return; }
  bgmAt(t);
  bgm.volume = bgmMuted ? 0 : .62;
  bgm.play().catch(() => {});
}
function bgmStop() { if (bgmReady) bgm.pause(); }
function bgmToggleMute() {
  bgmMuted = !bgmMuted;
  bgm.volume = bgmMuted ? 0 : .62;
  if (sfxBus) sfxBus.gain.value = bgmMuted ? 0 : .24;
  render(tNow);
}

function play() {
  playing = true; ended = false; lastNow = 0;
  sfxInit();
  if (actx && actx.state === 'suspended') actx.resume().catch(() => {});
  gate.classList.add('out');
  bgmStart(tNow);
}
function pause() { playing = false; bgmStop(); }
function toggle() { if (ended) { tNow = 0; play(); } else if (playing) { pause(); } else { play(); } }
function seek(dt) { tNow = clamp(tNow + dt, 0, TOTAL); ended = false; render(tNow); bgmAt(tNow); }
function restart() { tNow = 0; ended = false; play(); render(tNow); }

document.getElementById('start').addEventListener('click', () => { tNow = 0; play(); });

window.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); if (!gate.classList.contains('out')) { tNow = 0; play(); return; } toggle(); }
  else if (e.code === 'ArrowRight') { seek(2); }
  else if (e.code === 'ArrowLeft') { seek(-2); }
  else if (e.key === 'r' || e.key === 'R') { restart(); }
  else if (e.key === 'h' || e.key === 'H') { uiVisible = !uiVisible; render(tNow); }
  else if (e.key === 'm' || e.key === 'M') { bgmToggleMute(); }
  else if (e.key === 'f' || e.key === 'F') {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
  }
});

let idleTimer = 0;
window.addEventListener('mousemove', () => {
  document.getElementById('stage').style.cursor = 'default';
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { document.getElementById('stage').style.cursor = 'none'; }, 2000);
  if (!uiVisible) return;
  if (gate.classList.contains('out')) {
    uiVisible = true;
  }
});

window.addEventListener('resize', () => {
  fitCanvas();
  render(tNow);
});

// 初始
if (params.get('rec') === '1') uiVisible = false;
if (params.get('t')) {
  tNow = clamp(parseFloat(params.get('t')) || 0, 0, TOTAL);
  gate.classList.add('out');
  render(tNow);
}
if (params.get('auto') === '1') {
  tNow = 0;
  play();
}
requestAnimationFrame(loop);
</script>
</body>
</html>
