<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171513">
<title>我的世界 · RTSX</title>
<style>
  :root{
    --ink:#F6F1E8; --dim:rgba(246,241,232,.56); --dim2:rgba(246,241,232,.34);
    --line:#2F2A24; --clay:#E2916F; --grass:#6FA84B; --dirt:#8A5A3B;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    margin:0;min-height:100vh;
    background:
      radial-gradient(90% 60% at 50% 0%, #26221C 0%, rgba(38,34,28,0) 62%),
      #171513;
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:calc(18px + env(safe-area-inset-top)) 20px calc(34px + env(safe-area-inset-bottom));
    overflow-x:hidden;
  }
  .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .bar .right{display:flex;align-items:center;gap:12px;}
  .back{border:0;background:none;font:inherit;font-size:12px;color:var(--dim2);cursor:pointer;padding:4px 0;letter-spacing:.02em;}
  .back:hover{color:var(--dim);}
  .snd{
    border:1px solid var(--line);background:none;border-radius:8px;
    padding:3px 7px;font:inherit;font-size:10px;letter-spacing:.12em;
    color:var(--dim2);cursor:pointer;
  }
  .snd.off{opacity:.55;text-decoration:line-through;}
  .badge{font-family:Georgia,serif;font-size:11px;letter-spacing:.28em;color:var(--dim2);text-transform:uppercase;}

  .hero{display:flex;flex-direction:column;align-items:center;margin:22px 0 26px;}
  .scene{width:104px;height:104px;perspective:760px;margin-bottom:22px;}
  .cube{position:relative;width:104px;height:104px;transform-style:preserve-3d;animation:spin 18s linear infinite;}
  @keyframes spin{
    from{transform:rotateX(-18deg) rotateY(-28deg);}
    to{transform:rotateX(-18deg) rotateY(332deg);}
  }
  .face{position:absolute;width:104px;height:104px;border:1px solid rgba(0,0,0,.28);}
  .f1,.f2{background:
      linear-gradient(180deg,#74AE4F 0%,#74AE4F 21%,#8A5A3B 21%,#8A5A3B 100%);
    background-blend-mode:normal;}
  .f1{transform:translateZ(52px);}
  .f2{transform:rotateY(180deg) translateZ(52px);}
  .f3{transform:rotateY(90deg) translateZ(52px);}
  .f4{transform:rotateY(-90deg) translateZ(52px);}
  .f5{transform:rotateX(90deg) translateZ(52px);background:linear-gradient(150deg,#82BB59,#5E913E);}
  .f6{transform:rotateX(-90deg) translateZ(52px);background:#7A4E33;}

  h1{margin:0 0 10px;font-family:Georgia,"Songti SC","STSong",serif;font-size:34px;font-weight:600;letter-spacing:-.01em;}
  .sub{margin:0;max-width:520px;text-align:center;font-size:13.5px;line-height:1.78;color:var(--dim);}
  .hintchip{
    display:inline-flex;align-items:center;gap:7px;margin:16px 0 0;
    padding:6px 13px;border-radius:999px;border:1px solid rgba(226,145,111,.34);
    background:rgba(226,145,111,.08);font-size:11.5px;color:var(--clay);letter-spacing:.02em;
  }

  .hintchip.padbtn{border:0;cursor:pointer;font-family:inherit;margin-left:8px;}
  .hintchip.padbtn.off{color:#8C8378;border-color:rgba(140,131,120,.3);background:rgba(140,131,120,.07);}
  .list{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:820px;margin:26px auto 0;}
  .vrow{
    display:flex;align-items:center;gap:14px;
    padding:15px 16px;border:1px solid var(--line);border-radius:13px;
    background:linear-gradient(160deg,#232019 0%,#1C1A17 100%);
    cursor:pointer;text-align:left;width:100%;color:var(--ink);font:inherit;
    transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;
  }
  .vrow:hover{transform:translateY(-2px);border-color:#443B31;box-shadow:0 18px 40px -30px #000;}
  .vrow:active{transform:translateY(0);}
  .vrow .ico{width:38px;height:38px;flex:0 0 auto;border-radius:8px;position:relative;overflow:hidden;
    background:linear-gradient(180deg,#74AE4F 0%,#74AE4F 34%,#8A5A3B 34%,#8A5A3B 100%);
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.3);}
  .vrow .ico::after{content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(90deg,rgba(0,0,0,.14) 0 1px,transparent 1px 7px),
               repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0 1px,transparent 1px 7px);}
  .vrow .main{flex:1 1 auto;min-width:0;}
  .vrow .nm{font-family:Georgia,"Songti SC",serif;font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .vrow .nm .star{font-size:9.5px;letter-spacing:.18em;color:#1C1A17;background:var(--clay);border-radius:5px;padding:1px 6px;}
  .vrow .meta{margin-top:4px;font-size:11.5px;color:var(--dim2);display:flex;flex-wrap:wrap;gap:6px 10px;}
  .vrow .meta span{white-space:nowrap;}
  .vrow .go{flex:0 0 auto;font-size:11px;letter-spacing:.14em;color:var(--clay);}
  .vrow.recommend{border-color:rgba(226,145,111,.4);}
  .vrow .cached{color:#8CBF67;}
  .foot{margin:26px auto 0;max-width:560px;text-align:center;font-size:11.5px;line-height:1.9;color:var(--dim2);}

  @media (max-width:700px){
    .list{grid-template-columns:1fr;}
    h1{font-size:27px;}
    .scene{width:88px;height:88px;}
    .cube{width:88px;height:88px;}
    .face{width:88px;height:88px;}
    .f1{transform:translateZ(44px);} .f2{transform:rotateY(180deg) translateZ(44px);}
    .f3{transform:rotateY(90deg) translateZ(44px);} .f4{transform:rotateY(-90deg) translateZ(44px);}
    .f5{transform:rotateX(90deg) translateZ(44px);} .f6{transform:rotateX(-90deg) translateZ(44px);}
  }

  /* ---------- 装载层 ---------- */
  .load{
    position:fixed;inset:0;z-index:40;display:none;
    align-items:center;justify-content:center;
    background:rgba(12,11,10,.94);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    padding:26px;
  }
  .load.show{display:flex;}
  .load .box{width:100%;max-width:420px;text-align:center;}
  .load .ttl{font-family:Georgia,"Songti SC",serif;font-size:20px;font-weight:600;margin:0 0 8px;}
  .load .note{font-size:12px;color:var(--dim2);line-height:1.8;margin:0 0 20px;}
  .barwrap{height:10px;border-radius:999px;background:rgba(246,241,232,.1);overflow:hidden;border:1px solid rgba(246,241,232,.08);}
  .barfill{height:100%;width:0%;border-radius:999px;background:linear-gradient(90deg,#E2916F,#C4603F);transition:width .18s linear;}
  .pct{margin-top:12px;font-size:12.5px;color:var(--dim);font-variant-numeric:tabular-nums;}
  .pct b{color:var(--ink);font-size:15px;}
  .load .cancel{
    margin-top:22px;border:1px solid var(--line);background:none;color:var(--dim2);
    border-radius:9px;padding:9px 18px;font:inherit;font-size:12.5px;cursor:pointer;
  }
  .load .cancel:hover{color:var(--dim);border-color:#443B31;}
  .err{margin-top:14px;font-size:12px;color:#E2916F;line-height:1.7;}

  /* ---------- 运行层 ---------- */
  .play{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;background:#000;}
  .play.show{display:flex;}
  body.playing{overflow:hidden;}
  .play .pbar{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:calc(6px + env(safe-area-inset-top)) 12px 6px 14px;
    background:#100F0D;border-bottom:1px solid #232019;flex:0 0 auto;
  }
  .play .pbar .pn{font-size:12px;color:var(--dim);letter-spacing:.04em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .play .pbar .pt{display:flex;align-items:center;gap:8px;flex:0 0 auto;}
  .pbtn{
    border:1px solid #33302A;background:#1B1915;color:var(--dim);border-radius:8px;
    padding:6px 11px;font:inherit;font-size:11.5px;cursor:pointer;white-space:nowrap;
  }
  .pbtn:hover{color:var(--ink);border-color:#4A443B;}
  #gframe{flex:1 1 auto;width:100%;height:100%;border:0;background:#000;display:block;}

  .toast{
    position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translate(-50%,12px);
    background:#221F1C;color:#F6F2EC;font-size:12.5px;padding:9px 16px;border-radius:999px;
    opacity:0;pointer-events:none;transition:opacity .3s ease,transform .3s ease;z-index:80;white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translate(-50%,0);}
</style>
</head>
<body>
  <div class="bar">
    <button class="back" id="back" type="button">← 返回大厅</button>
    <div class="right">
      <button class="snd" id="snd" type="button">SFX</button>
      <span class="badge">WebMC</span>
    </div>
  </div>

  <section class="hero">
    <div class="scene"><div class="cube">
      <div class="face f1"></div><div class="face f2"></div><div class="face f3"></div>
      <div class="face f4"></div><div class="face f5"></div><div class="face f6"></div>
    </div></div>
    <h1>我的世界</h1>
    <p class="sub">浏览器里直接跑的 Minecraft，单文件、不装 Java、不用外网。手机上选 PE 版（自带摇杆），电脑上选 1.21.11（鼠标锁定视角）。手机点其他版本会自动加触屏手柄。</p>
    <span class="hintchip" id="devchip">正在识别设备…</span>
      <button class="hintchip padbtn" id="padbtn" type="button">触屏手柄：开</button>
  </section>

  <div class="list" id="list"></div>

  <p class="foot">
    第一次进要把整包下载下来（进度条走完才开始），下过一次会存在本机缓存里，第二次秒开。<br>
    单个版本 17–93 MB，建议 Wi-Fi。要是你把整个文件夹拷到本地双击打开（file://），浏览器不给读进度，会直接打开、不显示进度条。
    <button class="back" id="clear" type="button" style="margin-left:6px;text-decoration:underline;">清掉本地缓存</button>
  </p>

  <!-- 装载 -->
  <div class="load" id="load">
    <div class="box">
      <div class="ttl" id="load-ttl">正在装载</div>
      <p class="note" id="load-note">下载完就直接进世界，别关页面。</p>
      <div class="barwrap"><div class="barfill" id="barfill"></div></div>
      <div class="pct" id="pct"><b>0%</b> · 0.0 / 0.0 MB</div>
      <div class="err" id="err"></div>
      <button class="cancel" id="cancel" type="button">取消</button>
    </div>
  </div>

  <!-- 运行 -->
  <div class="play" id="play">
    <div class="pbar">
      <span class="pn" id="play-name">Minecraft</span>
      <span class="pt">
        <button class="pbtn" id="btn-full" type="button">全屏</button>
        <button class="pbtn" id="btn-close" type="button">关闭</button>
      </span>
    </div>
    <iframe id="gframe" title="Minecraft" allowfullscreen allow="fullscreen; pointer-lock; gamepad; autoplay; microphone"></iframe>
  </div>

  <div class="toast" id="toast"></div>

      var msg=(e && e.message) ? e.message : String(e);
      if(/Failed to fetch|NetworkError|Load failed|network|fetch/i.test(msg)){
        directLoad(v, "读不到进度，改为直接打开（"+msg+"）");
        return;
      }
      errEl.textContent="装载失败："+msg+"（文件："+v.file+" · 协议："+location.protocol+"）"+(/HTTP 404/.test(msg)?"。服务器上没有这个文件：没上传成功，或路径大小写不一样。":"");
      cancelEl.textContent="返回";
      barfill.style.width="0%";
    });
  }

  cancelEl.addEventListener("click", function(){
    SFX.click();
    if(ctrl) try{ ctrl.abort(); }catch(e){}
    hideLoad(); errEl.textContent=""; cancelEl.textContent="取消";
  });

  function closePlay(){
    SFX.click();
    playEl.classList.remove("show");
    document.body.classList.remove("playing");
    frame.src="about:blank";
    if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(function(){});
  }
  document.getElementById("btn-close").addEventListener("click", closePlay);
  document.getElementById("btn-full").addEventListener("click", function(){
    SFX.click();
    var box=playEl;
    if(document.fullscreenElement){ document.exitFullscreen && document.exitFullscreen(); return; }
    var req=box.requestFullscreen||box.webkitRequestFullscreen||box.msRequestFullscreen;
    if(req){
      var p=req.call(box, {navigationUI:"hide"});
      if(p && p.then) p.then(function(){
        try{ if(screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(function(){}); }catch(e){}
      }).catch(function(){ toast("这个浏览器不给全屏"); });
    } else toast("这个浏览器不支持全屏，直接转横屏也能玩");
  });

  var toastEl=document.getElementById("toast"), toastT=null;
  function toast(t){
    toastEl.textContent=t; toastEl.classList.add("show");
    clearTimeout(toastT); toastT=setTimeout(function(){ toastEl.classList.remove("show"); }, 2200);
  }

  document.getElementById("clear").addEventListener("click", function(){
    if(!("caches" in window)) return toast("这个浏览器不支持缓存管理");
    caches.delete(CACHE).then(function(){ toast("本地缓存已清掉"); render(); }).catch(function(){ toast("清理失败"); });
  });

  document.getElementById("back").addEventListener("click", function(){
    if(window.parent !== window) window.parent.postMessage("rtsx-close", "*");
    else location.href = "../../index.html";
  });

  window.addEventListener("beforeunload", function(){ if(blobUrl) URL.revokeObjectURL(blobUrl); });

  render();
})();
</script>
</body>
</html>
