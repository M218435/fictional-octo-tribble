<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" href="../icon.png">
<link rel="apple-touch-icon" href="../icon.png">

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>打砖块 · RTSX</title>
<style>
  :root{
    --bg:#F4F1EA; --ink:#191817; --ink-2:#5F5B53; --ink-3:#938E85;
    --line:#E4E0D7; --btn:#2A2724; --board:#EDE7DC;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;min-height:100dvh;
    padding:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom));
    overflow:auto;
    touch-action:manipulation;
  }
  .app{width:min(480px,96vw,calc(78dvh - 72px));display:flex;flex-direction:column;gap:10px;}
  .top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .lead{display:flex;align-items:center;gap:10px;}
  .back{border:0;background:none;font:inherit;font-size:12px;color:var(--ink-3);cursor:pointer;padding:4px 0;}
  .back:hover{color:var(--ink-2);}
  .snd{
    border:1px solid var(--line);background:#fff;border-radius:8px;
    padding:3px 7px;font:inherit;font-size:10px;letter-spacing:.12em;
    color:var(--ink-3);cursor:pointer;
  }
  .snd.off{opacity:.5;text-decoration:line-through;}
  @media (max-height:560px){
    body{padding:8px;}
    .app{gap:6px;}
    .hint{display:none;}
  }
  .scores{display:flex;gap:8px;}
  .scorebox{min-width:66px;padding:5px 10px;border-radius:10px;background:#fff;border:1px solid var(--line);text-align:center;}
  .scorebox label{display:block;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);}
  .scorebox b{display:block;font-size:16px;font-weight:600;line-height:1.3;font-variant-numeric:tabular-nums;}
  canvas{width:100%;aspect-ratio:480/600;border-radius:14px;display:block;background:var(--board);touch-action:none;cursor:none;}
  .hint{margin:0;font-size:11.5px;color:var(--ink-3);text-align:center;}
  /* 手机：居中的摇杆，左右推动控制挡板 */
  .stick{
    display:none;position:relative;width:132px;height:132px;margin:2px auto 0;
    border-radius:50%;touch-action:none;
    background:radial-gradient(circle at 50% 42%,#fff 0%,#f3efe7 68%,#e8e3d9 100%);
    border:1px solid var(--line);
    box-shadow:0 14px 30px -22px rgba(25,24,23,.55),inset 0 1px 0 #fff;
  }
  .stick::after{
    content:"";position:absolute;left:50%;top:50%;width:86px;height:86px;margin:-43px 0 0 -43px;
    border-radius:50%;border:1px dashed rgba(147,142,133,.28);pointer-events:none;
  }
  .stick .knob{
    position:absolute;left:50%;top:50%;width:56px;height:56px;border-radius:50%;
    background:linear-gradient(180deg,#e2875f,#cf7046);
    box-shadow:0 10px 20px -8px rgba(160,88,52,.75),inset 0 1px 0 rgba(255,255,255,.45);
    transform:translate(-50%,-50%);pointer-events:none;
  }
  @media (pointer:coarse),(max-width:640px){
    .stick{display:block;}
    .hint{display:none;}
  }
  .overlay{
    position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(244,241,234,.9);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);padding:24px;z-index:5;
  }
  .overlay.show{display:flex;animation:fade .25s ease both;}
  @keyframes fade{from{opacity:0;}to{opacity:1;}}
  .panel{
    width:100%;max-width:310px;background:#fff;border:1px solid var(--line);border-radius:14px;
    padding:26px 22px 22px;text-align:center;box-shadow:0 20px 50px -24px rgba(25,24,23,.35);
  }
  .panel h2{margin:0 0 8px;font-size:19px;font-weight:600;font-family:Georgia,"Songti SC",serif;}
  .panel p{margin:0 0 18px;font-size:13px;color:var(--ink-2);line-height:1.6;}
  .btn{height:40px;padding:0 22px;border:0;border-radius:10px;background:var(--btn);color:#fff;font:inherit;font-size:13.5px;font-weight:500;cursor:pointer;}
  .btn:hover{background:#000;}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="lead">
      <button class="back" id="back" type="button">← 返回</button>
      <button class="snd" id="snd" type="button">SFX</button>
    </div>
    <div class="scores">
      <div class="scorebox"><label>分数</label><b id="score">0</b></div>
      <div class="scorebox"><label>生命</label><b id="lives">3</b></div>
    </div>
  </div>
  <canvas id="cv" width="480" height="600"></canvas>
  <p class="hint">移动鼠标或手指控制挡板 · 空格 / 点击发球</p>
  <div class="stick" id="stick"><div class="knob" id="knob"></div></div>
</div>

<div class="overlay" id="overlay">
  <div class="panel">
    <h2 id="ov-title">打砖块</h2>
    <p id="ov-text">左右移动挡板接住小球，把 40 块砖全部打掉。</p>
    <button class="btn" id="ov-btn" type="button">开始</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ---------- 音效：WebAudio 合成，零外部文件 ---------- */
  var SFX = (function(){
    var ctx = null, on = true, out = null;
    try { on = localStorage.getItem("rtsx.sound.v1") !== "off"; } catch(e) {}
    function ac(){
      if (!ctx) {
        var C = window.AudioContext || window.webkitAudioContext;
        if (!C) return null;
        try { ctx = new C(); } catch(e) { return null; }
      }
      if (ctx.state === "suspended") { try { ctx.resume(); } catch(e) {} }
      if (!out) {
        out = ctx.createDynamicsCompressor();      // 限制器：音量拉满也不炸耳朵
        out.threshold.value = -2;
        out.knee.value = 20;
        out.ratio.value = 12;
        out.attack.value = 0.004;
        out.release.value = 0.2;
        out.connect(ctx.destination);
      }
      return ctx;
    }
    function tone(f, dur, type, gain, delay, to){
      if (!on) return;
      var c = ac(); if (!c) return;
      var t0 = c.currentTime + (delay || 0);
      var o = c.createOscillator(), g = c.createGain();
      o.type = type || "sine";
      o.frequency.setValueAtTime(f, t0);
      if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(Math.min(0.99, (gain || 0.05) * 14), t0 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(out || c.destination);
      o.start(t0); o.stop(t0 + dur + 0.03);
    }
    var api = {
      click: function(){ tone(520, 0.055, "triangle", 0.045); },
      hit:   function(){ tone(420, 0.06, "square", 0.03, 0, 320); },
      pop:   function(n){ var f = 560 + Math.min(12, (n || 0)) * 45; tone(f, 0.09, "sine", 0.045, 0, f + 200); },
      lose:  function(){ tone(260, 0.26, "sawtooth", 0.04, 0, 90); },
      win:   function(){ tone(660, 0.1, "sine", 0.05); tone(880, 0.12, "sine", 0.05, 0.1); tone(1240, 0.16, "sine", 0.045, 0.2); },
      isOn:  function(){ return on; },
      set:   function(v){ on = v; try { localStorage.setItem("rtsx.sound.v1", v ? "on" : "off"); } catch(e) {} }
    };
    window.addEventListener("storage", function(e){ if (e.key === "rtsx.sound.v1") on = e.newValue !== "off"; });
    return api;
  })();

  var sndBtn = document.getElementById("snd");
  function paintSnd(){ if (sndBtn) sndBtn.classList.toggle("off", !SFX.isOn()); }
  paintSnd();
  if (sndBtn) sndBtn.addEventListener("click", function(){
    SFX.set(!SFX.isOn()); paintSnd(); if (SFX.isOn()) SFX.click();
  });
  window.addEventListener("storage", paintSnd);

  var W = 480, H = 600;
  var cv = document.getElementById("cv"), ctx = cv.getContext("2d");
  var scoreEl = document.getElementById("score"), livesEl = document.getElementById("lives");
  var overlay = document.getElementById("overlay");

  var paddle = {w: 88, h: 13, x: (W - 88) / 2, y: H - 46, vx: 0};
  var ball = {r: 7, x: 0, y: 0, dx: 0, dy: 0, live: false, speed: 5.2};
  var bricks = [], score = 0, lives = 3, state = "ready", keys = {}, raf = 0, joyX = 0;

  var COLS = 8, ROWS = 5, PAD = 8, SIDE = 16, TOP = 66;

  function buildBricks(){
    bricks = [];
    var bw = (W - SIDE * 2 - PAD * (COLS - 1)) / COLS;
    var bh = 20;
    for (var r = 0; r < ROWS; r++) {
      for (var c = 0; c < COLS; c++) {
        bricks.push({
          x: SIDE + c * (bw + PAD),
          y: TOP + r * (bh + PAD),
          w: bw, h: bh,
          row: r, alive: true
        });
      }
    }
  }

  function resetBall(){
    ball.live = false;
    ball.x = paddle.x + paddle.w / 2;
    ball.y = paddle.y - ball.r - 1;
    ball.dx = 0; ball.dy = 0;
  }

  function reset(){
    buildBricks();
    score = 0; lives = 3; state = "ready";
    paddle.x = (W - paddle.w) / 2;
    scoreEl.textContent = "0";
    livesEl.textContent = "3";
    resetBall();
    draw();
  }

  function launch(){
    if (state === "ready") { state = "run"; hideOverlay(); }
    if (state !== "run" || ball.live) return;
    ball.live = true;
    SFX.click();
    var angle = (-55 + Math.random() * 110) * Math.PI / 180;  // 向上散开
    ball.dx = Math.sin(angle) * ball.speed;
    ball.dy = -Math.abs(Math.cos(angle) * ball.speed);
  }

  function roundRect(x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  var ROW_COLORS = ["#C4603F", "#D07A55", "#DC9873", "#E5B394", "#EDCBB6"];

  function draw(){
    ctx.fillStyle = "#EDE7DC";
    ctx.fillRect(0, 0, W, H);

    for (var i = 0; i < bricks.length; i++) {
      var b = bricks[i];
      if (!b.alive) continue;
      ctx.fillStyle = ROW_COLORS[b.row];
      roundRect(b.x, b.y, b.w, b.h, 5);
      ctx.fill();
    }

    ctx.fillStyle = "#2A2724";
    roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 6);
    ctx.fill();

    if (ball.live || state === "ready") {
      ctx.fillStyle = "#D97757";
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function update(){
    if (state !== "run") return;

    if (keys.left) paddle.x -= 7;
    if (keys.right) paddle.x += 7;
    if (joyX) paddle.x += joyX * 11;      // 摇杆是模拟量：推到底最快，轻推就慢慢挪
    paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));

    if (!ball.live) {
      ball.x = paddle.x + paddle.w / 2;
      ball.y = paddle.y - ball.r - 1;
      return;
    }

    ball.x += ball.dx;
    ball.y += ball.dy;

    if (ball.x - ball.r < 0) { ball.x = ball.r; ball.dx = Math.abs(ball.dx); }
    if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.dx = -Math.abs(ball.dx); }
    if (ball.y - ball.r < 0) { ball.y = ball.r; ball.dy = Math.abs(ball.dy); }

    // 挡板
    if (ball.dy > 0 && ball.y + ball.r >= paddle.y && ball.y - ball.r <= paddle.y + paddle.h &&
        ball.x >= paddle.x - ball.r && ball.x <= paddle.x + paddle.w + ball.r) {
      var hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2); // -1 .. 1
      var ang = hit * 1.0;                                            // -1 .. 1 rad
      var sp = Math.min(8.5, ball.speed + (score / 400));
      ball.dx = Math.sin(ang) * sp;
      ball.dy = -Math.abs(Math.cos(ang) * sp);
      ball.y = paddle.y - ball.r - 1;
      SFX.hit();
    }

    // 砖块
    for (var i = 0; i < bricks.length; i++) {
      var b = bricks[i];
      if (!b.alive) continue;
      if (ball.x + ball.r > b.x && ball.x - ball.r < b.x + b.w &&
          ball.y + ball.r > b.y && ball.y - ball.r < b.y + b.h) {
        b.alive = false;
        score += 10;
        scoreEl.textContent = score;
        SFX.pop(score / 10);
        ctx.fillStyle = "#EDE7DC";
        roundRect(b.x, b.y, b.w, b.h, 5);
        ctx.fill();
        // 用相对位置判断反弹方向
        var cx = b.x + b.w / 2, cy = b.y + b.h / 2;
        if (Math.abs((ball.x - cx) / b.w) > Math.abs((ball.y - cy) / b.h)) ball.dx = -ball.dx;
        else ball.dy = -ball.dy;
        break;
      }
    }

    if (bricks.every(function(x){ return !x.alive; })) {
      state = "won";
      SFX.win();
      showOverlay("全部清空", "分数 " + score + "，砖墙已经一块不剩。", "再来一局");
      return;
    }

    // 掉出底部
    if (ball.y - ball.r > H) {
      lives--;
      livesEl.textContent = lives;
      if (lives <= 0) {
        state = "over";
        SFX.lose();
        showOverlay("球掉光了", "本局分数 " + score + "。", "再来一局");
      } else {
        SFX.lose();
        resetBall();
      }
    }
  }

  function loop(){
    update();
    draw();
    raf = requestAnimationFrame(loop);
  }

  function showOverlay(title, text, label){
    document.getElementById("ov-title").textContent = title;
    document.getElementById("ov-text").textContent = text;
    document.getElementById("ov-btn").textContent = label;
    overlay.classList.add("show");
  }
  function hideOverlay(){ overlay.classList.remove("show"); }

  /* 指针控制 */
  function movePaddle(clientX){
    var rect = cv.getBoundingClientRect();
    var x = (clientX - rect.left) / rect.width * W;
    paddle.x = Math.max(0, Math.min(W - paddle.w, x - paddle.w / 2));
    if (!ball.live && state === "run") { ball.x = paddle.x + paddle.w / 2; }
  }
  cv.addEventListener("mousemove", function(e){ movePaddle(e.clientX); });
  cv.addEventListener("mousedown", function(e){ e.preventDefault(); launch(); });
  cv.addEventListener("touchstart", function(e){
    e.preventDefault();
    movePaddle(e.touches[0].clientX);
    launch();
  }, { passive: false });
  cv.addEventListener("touchmove", function(e){
    e.preventDefault();
    movePaddle(e.touches[0].clientX);
  }, { passive: false });

  document.addEventListener("keydown", function(e){
    if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") { keys.left = true; e.preventDefault(); }
    if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") { keys.right = true; e.preventDefault(); }
    if (e.key === " " || e.key === "Enter") { e.preventDefault(); launch(); }
  });
  document.addEventListener("keyup", function(e){
    if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keys.left = false;
    if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") keys.right = false;
  });

  /* 触屏摇杆：居中在画布下方，左右推动挡板；往上一推也能发球 */
  function mountStick(handler){
    var base = document.getElementById("stick"), knob = document.getElementById("knob");
    if (!base || !knob) return;
    var R = 40, pid = null;
    function place(cx, cy){
      var r = base.getBoundingClientRect();
      var x = cx - (r.left + r.width / 2), y = cy - (r.top + r.height / 2);
      var len = Math.sqrt(x * x + y * y);
      if (len > R) { x = x * R / len; y = y * R / len; }
      knob.style.transform = "translate(calc(-50% + " + x.toFixed(1) + "px),calc(-50% + " + y.toFixed(1) + "px))";
      handler(x / R, y / R);
    }
    function down(e){
      if (pid !== null) return;
      pid = e.pointerId;
      R = Math.max(26, base.clientWidth / 2 - 30);
      try { base.setPointerCapture(pid); } catch (err) {}
      place(e.clientX, e.clientY);
      e.preventDefault();
    }
    function move(e){ if (pid === null || e.pointerId !== pid) return; place(e.clientX, e.clientY); e.preventDefault(); }
    function up(e){
      if (pid === null || e.pointerId !== pid) return;
      pid = null;
      knob.style.transform = "translate(-50%,-50%)";
      handler(0, 0);
    }
    base.addEventListener("pointerdown", down);
    base.addEventListener("pointermove", move);
    base.addEventListener("pointerup", up);
    base.addEventListener("pointercancel", up);
    base.addEventListener("lostpointercapture", up);
  }
  mountStick(function(dx, dy){
    joyX = Math.abs(dx) > 0.16 ? dx : 0;
    if (dy < -0.55) launch();
  });

  document.getElementById("ov-btn").addEventListener("click", function(){
    reset();
    launch();
  });
  document.getElementById("back").addEventListener("click", function(){
    if (window.parent !== window) window.parent.postMessage("rtsx-close", "*");
    else location.href = "../index.html";
  });

  reset();
  showOverlay("打砖块", "左右移动挡板接住小球，把 40 块砖全部打掉。", "开始");
  loop();
})();
</script>
</body>
</html>
