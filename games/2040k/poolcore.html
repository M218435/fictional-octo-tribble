<!DOCTYPE html>
<html lang="zh-CN">
<head>

<meta charset="utf-8">
<link rel="icon" type="image/png" href="../../icon.png">
<link rel="apple-touch-icon" href="../../icon.png">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>池核 · 2040K 画质</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;background:#0A0D0E;color:#EAF2F2;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    user-select:none;}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;background:#0A0D0E;}
  .top{position:fixed;left:0;right:0;top:0;padding:calc(9px + env(safe-area-inset-top)) 10px 0;
    display:flex;align-items:flex-start;gap:8px;pointer-events:none;z-index:5;}
  .back{pointer-events:auto;color:rgba(234,242,242,.55);font-size:12px;text-decoration:none;
    border:1px solid rgba(160,200,210,.22);border-radius:8px;padding:5px 9px;background:rgba(10,16,18,.62);
    backdrop-filter:blur(4px);}
  .top .right{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none;}
  #mini{width:104px;height:104px;border-radius:10px;border:1px solid rgba(160,200,210,.22);
    background:rgba(8,14,16,.55);backdrop-filter:blur(4px);}
  .stat{display:flex;gap:6px;align-items:center;font-size:11px;color:rgba(234,242,242,.62);
    background:rgba(8,14,16,.5);border:1px solid rgba(160,200,210,.16);border-radius:8px;padding:4px 8px;}
  .stat b{color:#8FE3E6;font-weight:600;}
  #netchip{cursor:pointer;} #snd{cursor:pointer;}
  #goal{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translateX(-50%);
    font-size:12px;letter-spacing:.04em;color:rgba(234,242,242,.66);pointer-events:none;z-index:6;
    text-shadow:0 1px 3px rgba(0,0,0,.6);}
  #cross{position:fixed;left:50%;top:50%;width:5px;height:5px;margin:-2.5px 0 0 -2.5px;border-radius:50%;
    background:rgba(230,245,246,.55);box-shadow:0 0 6px rgba(140,220,230,.5);pointer-events:none;z-index:6;}
  #toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);
    background:rgba(8,14,16,.86);border:1px solid rgba(160,200,210,.24);border-radius:10px;padding:8px 14px;
    font-size:12.5px;color:#A9E6EA;opacity:0;transition:opacity .2s;pointer-events:none;z-index:8;white-space:nowrap;}
  #toast.on{opacity:1;}
  #stick{position:fixed;left:16px;bottom:calc(18px + env(safe-area-inset-bottom));width:112px;height:112px;
    border-radius:50%;border:1px solid rgba(160,200,210,.24);background:rgba(10,16,18,.42);
    z-index:6;touch-action:none;display:none;}
  #stick.on{display:block;}
  #stick i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;
    background:rgba(170,225,230,.28);border:1px solid rgba(200,240,245,.4);}
  #sprint{position:fixed;right:16px;bottom:calc(26px + env(safe-area-inset-bottom));width:76px;height:76px;
    border-radius:50%;border:1px solid rgba(160,200,210,.3);background:rgba(10,16,18,.5);color:#D9F1F3;
    font-size:12px;z-index:6;display:none;align-items:center;justify-content:center;touch-action:none;}
  #sprint.on{display:flex;}
  #sprint:active{background:rgba(140,220,230,.3);}
  .overlay{position:fixed;inset:0;z-index:12;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(120% 80% at 50% 8%,rgba(24,44,52,.72),rgba(6,10,12,.96));}
  .overlay .box{width:min(88vw,360px);padding:24px 22px;border:1px solid rgba(170,215,225,.24);
    border-radius:16px;background:linear-gradient(165deg,rgba(28,44,50,.92),rgba(12,18,20,.96));
    box-shadow:0 30px 80px -40px #000;text-align:center;}
  .overlay h1{margin:0;font-family:Georgia,"Songti SC",serif;font-weight:600;font-size:30px;letter-spacing:.04em;
    color:#EAF7F8;}
  .overlay .en{margin:2px 0 0;font-size:10.5px;letter-spacing:.42em;color:rgba(170,215,225,.5);text-transform:uppercase;}
  .overlay .sub{margin:14px 0 18px;font-size:12.5px;line-height:1.9;color:rgba(234,242,242,.6);}
  .overlay .engline{height:2px;margin:14px 0 8px;border-radius:2px;background:rgba(170,215,225,.16);overflow:hidden;transition:opacity .45s ease}
.overlay .engline i{display:block;height:100%;width:2%;background:#8FE3E6;transition:width .18s linear}
.overlay .engmsg{font-size:11px;letter-spacing:.06em;color:rgba(170,215,225,.55);min-height:13px}
.overlay .hint{margin:14px 0 0;font-size:11px;line-height:1.8;color:rgba(234,242,242,.36);}
  .row{display:flex;gap:8px;}
  .overlay button{flex:1;padding:12px 0;border:1px solid rgba(170,215,225,.3);border-radius:11px;
    background:rgba(160,220,228,.1);color:#DCF3F5;font:600 14px system-ui;}
  .overlay button.primary{background:#8FE3E6;color:#08282C;border-color:transparent;}
  .overlay button:disabled{opacity:.35;}
  #win .box{width:min(88vw,340px);}
  #win .big{font-family:Georgia,serif;font-size:44px;color:#A9E6EA;}
  #win .lab{font-size:11px;letter-spacing:.24em;color:rgba(234,242,242,.4);text-transform:uppercase;}
  .hidden{display:none !important;}
  #fail{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:11;
    background:#070B0C;color:#CBE7EA;font-size:13px;text-align:center;padding:24px;line-height:1.9;}
  #fail.on{display:flex;}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="top">
  <a class="back" href="index.html">← 2040K</a>
  <div class="right">
    <canvas id="mini" width="208" height="208"></canvas>
    <div class="stat"><span id="keys">拉杆 <b>0/10</b></span></div>
    <div class="stat"><span id="netchip">单机</span></div>
    <div class="stat"><span id="snd">音效 开</span></div>
  </div>
</div>
<div id="goal">沿着走廊找拉杆</div>
<div id="cross"></div>
<div id="toast"></div>
<div id="stick"><i></i></div>
<div id="sprint">冲刺</div>

<div class="overlay" id="intro">
  <div class="box">
    <h1>池核</h1>
    <p class="en">P0OLC0RE · 2040K</p>
    <div class="sub">白色的池水、无尽的瓷砖、走廊尽头的光。<br>在这张没有尽头的迷宫图上，找到 10 个火警拉杆。<br>全部拉下之后，你会拿到一把锤子。</div>
    <div class="row">
      <button id="qHigh" class="primary" type="button" disabled>高画质</button>
      <button id="qLow" type="button" disabled>流畅</button>
      <button id="qNet" type="button" disabled>联机（公共池）</button>
    </div>
    <div class="engline" id="engLine"><i id="engBar"></i></div>
    <div class="engmsg" id="engMsg">正在载入引擎 0%</div>
    <div class="hint">电脑：WASD 走 · 鼠标环顾 · Shift 冲刺 · 左键砸墙 / 拉杆<br>手机：左摇杆走 · 右侧拖动转视角 · 点一下屏幕 = 拉杆或砸</div>
  </div>
</div>

<div class="overlay hidden" id="win">
  <div class="box">
    <div class="lab">你出来了</div>
    <div class="big" id="winTime">02:31</div>
    <div class="sub" id="winSub">瓷砖还在渗水。</div>
    <div class="row" style="margin-top:16px;">
      <button id="again" class="primary" type="button">再来一池</button>
    </div>
  </div>
</div>

<div id="fail">这台设备没有可用的 WebGL2，画面无法显示。<br>换一台设备或换个浏览器再试。</div>

<script src="../../assets/sfx/sfx.js"></script>
<script>
(function(){
  var msg=document.getElementById("engMsg"), bar=document.getElementById("engBar"), line=document.getElementById("engLine");
  var btns=[document.getElementById("qHigh"),document.getElementById("qLow"),document.getElementById("qNet")];
  btns.forEach(function(b){ if(b) b.disabled=true; });
  function pct(p){
    if(bar) bar.style.width=Math.max(2,Math.min(100,p==null?8:p))+"%";
    if(msg) msg.textContent=p==null?"正在载入引擎…":"正在载入引擎 "+p+"%";
  }
  pct(0);
  function done(){
    btns.forEach(function(b){ if(b) b.disabled=false; });
    if(msg) msg.textContent="";
    if(line){ line.style.opacity="0"; setTimeout(function(){ line.style.display="none"; },260); }
    if(msg) msg.style.minHeight="0";
  }
  function inject(blobUrl){
    if(msg) msg.textContent="正在初始化画面…";
    if(bar) bar.style.width="100%";
    requestAnimationFrame(function(){ requestAnimationFrame(function(){
      var s=document.createElement("script");
      if(blobUrl){
        s.src=blobUrl;
        s.onload=function(){ try{URL.revokeObjectURL(blobUrl);}catch(e){} done(); };
        s.onerror=done;
      }
      document.body.appendChild(s);
    }); });
  }
  function plain(){
    var s=document.createElement("script");
    s.src="poolcore.engine.js";
    s.onload=done; s.onerror=done;
    document.body.appendChild(s);
  }
  if(!window.fetch){ plain(); return; }
  fetch("poolcore.engine.js",{credentials:"same-origin",cache:"force-cache"}).then(function(r){
    if(!r.ok) throw 0;
    var len=parseInt(r.headers.get("content-length")||"0",10)||0;
    if(!r.body||!r.body.getReader) return r.text();
    var got=0, chunks=[], rd=r.body.getReader();
    return (function pump(){ return rd.read().then(function(x){
      if(x.done) return new Blob(chunks,{type:"text/javascript"});
      chunks.push(x.value); got+=x.value.byteLength;
      pct(len?Math.round(Math.min(99,got/len*100)):null);
      return pump();
    }); })();
  }).then(function(v){
    if(typeof v==="string"){ inject(null); } else { inject(URL.createObjectURL(v)); }
  }).catch(plain);
})();
</script>

</body>
</html>
