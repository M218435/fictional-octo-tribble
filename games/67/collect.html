<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" href="../../icon.png">
<link rel="apple-touch-icon" href="../../icon.png">

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>收集 67 · RTSX</title>
<style>
  :root{
    --ink:#191817; --dim:#6B6257; --clay:#D97757; --line:#E4E0D7;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;overflow:hidden;}
  body{
    background:#F4F1EA;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    user-select:none;
  }
  #cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;}

  .hud{
    position:absolute;top:calc(14px + env(safe-area-inset-top));left:16px;right:16px;
    display:flex;align-items:center;justify-content:space-between;
    pointer-events:none;
  }
  .pill{
    display:flex;align-items:baseline;gap:6px;
    padding:7px 13px;border-radius:999px;
    background:rgba(255,255,255,.82);
    border:1px solid rgba(228,224,215,.9);
    box-shadow:0 4px 14px -8px rgba(25,24,23,.35);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    font-size:11px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase;
  }
  .pill b{font-size:16px;font-weight:600;color:var(--ink);letter-spacing:0;font-variant-numeric:tabular-nums;}
  .pill .of{opacity:.55;}

  .ctl{
    position:absolute;left:16px;bottom:calc(16px + env(safe-area-inset-bottom));
    display:flex;align-items:center;gap:8px;z-index:6;
  }
  .back{
    border:1px solid rgba(228,224,215,.9);background:rgba(255,255,255,.82);
    border-radius:9px;padding:7px 12px;font:inherit;font-size:11.5px;
    color:var(--dim);cursor:pointer;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  }
  .back:hover{color:var(--ink);}
  .snd{
    border:1px solid rgba(228,224,215,.9);background:rgba(255,255,255,.82);
    border-radius:9px;padding:7px 9px;font:inherit;font-size:10px;letter-spacing:.12em;
    color:var(--dim);cursor:pointer;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  }
  .snd.off{opacity:.55;text-decoration:line-through;}

  .tip{
    position:absolute;right:16px;bottom:18px;
    font-size:11px;letter-spacing:.04em;color:rgba(80,72,62,.55);
  }

  /* 手机：屏幕正下方居中的摇杆 */
  .stick{
    position:absolute;left:50%;bottom:calc(74px + env(safe-area-inset-bottom));
    width:136px;height:136px;margin-left:-68px;border-radius:50%;
    display:none;touch-action:none;z-index:2;
    background:radial-gradient(circle at 50% 42%,rgba(255,255,255,.92) 0%,rgba(244,241,234,.9) 70%,rgba(233,228,218,.92) 100%);
    border:1px solid rgba(228,224,215,.95);
    box-shadow:0 16px 34px -26px rgba(25,24,23,.7),inset 0 1px 0 rgba(255,255,255,.9);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  }
  .stick::after{
    content:"";position:absolute;left:50%;top:50%;width:88px;height:88px;margin:-44px 0 0 -44px;
    border-radius:50%;border:1px dashed rgba(107,98,87,.26);pointer-events:none;
  }
  .stick .knob{
    position:absolute;left:50%;top:50%;width:56px;height:56px;border-radius:50%;
    background:linear-gradient(180deg,#e2875f,#cd6f45);
    box-shadow:0 10px 18px -8px rgba(160,88,52,.8),inset 0 1px 0 rgba(255,255,255,.45);
    transform:translate(-50%,-50%);pointer-events:none;
  }
  @media (pointer:coarse), (max-width:640px){
    .stick{display:block;}
    .tip{display:none;}
  }

  .overlay{
    position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(244,241,234,.88);
    backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
    padding:24px;z-index:5;
  }
  .overlay.show{display:flex;animation:fade .28s ease both;}
  @keyframes fade{from{opacity:0;}to{opacity:1;}}
  .panel{
    width:100%;max-width:330px;background:#fff;border:1px solid var(--line);border-radius:16px;
    padding:28px 24px 24px;text-align:center;
    box-shadow:0 24px 60px -30px rgba(25,24,23,.45);
  }
  .panel .tag{
    font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--clay);margin-bottom:10px;
  }
  .panel h2{
    margin:0 0 10px;font-family:Georgia,"Songti SC",serif;
    font-size:23px;font-weight:600;letter-spacing:-.01em;
  }
  .panel p{margin:0 0 20px;font-size:13px;line-height:1.75;color:#5F5B53;}
  .btn{
    height:42px;padding:0 26px;border:0;border-radius:10px;background:#2A2724;color:#fff;
    font:inherit;font-size:14px;font-weight:500;cursor:pointer;
    transition:transform .15s ease, background .15s ease;
  }
  .btn:hover{background:#000;transform:translateY(-1px);}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div class="hud">
  <div class="pill"><span>已收集</span><b id="count">0</b><span class="of">/ 67</span></div>
  <div class="pill"><span id="clockLabel">用时</span><b id="clock">0:00</b></div>
</div>

<div class="ctl">
  <button class="back" id="back" type="button">← 专辑</button>
  <button class="snd" id="snd" type="button">SFX</button>
</div>
<div class="tip">WASD / 方向键移动</div>

<div class="stick" id="stick"><div class="knob" id="knob"></div></div>

<div class="overlay show" id="overlay">
  <div class="panel">
    <div class="tag" id="ovTag">自由模式</div>
    <h2 id="ovTitle">收集 67</h2>
    <p id="ovText">场地里散着 67 个方块，走近就会自动收走。集齐时计时停下。</p>
    <button class="btn" id="ovBtn" type="button">开始</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ---------- 音效：WebAudio 合成，零外部文件 ---------- */
  var SFX = (function(){
    var ctx = null, on = true, out = null;
    try { on = localStorage.getItem("rtsx.sound.v1") !== "off"; } catch(e) {}
    function ac(){
      if (!ctx) {
        var C = window.AudioContext || window.webkitAudioContext;
        if (!C) return null;
        try { ctx = new C(); } catch(e) { return null; }
      }
      if (ctx.state === "suspended") { try { ctx.resume(); } catch(e) {} }
      if (!out) {
        out = ctx.createDynamicsCompressor();      // 限制器：音量拉满也不炸耳朵
        out.threshold.value = -2;
        out.knee.value = 20;
        out.ratio.value = 12;
        out.attack.value = 0.004;
        out.release.value = 0.2;
        out.connect(ctx.destination);
      }
      return ctx;
    }
    function tone(f, dur, type, gain, delay, to){
      if (!on) return;
      var c = ac(); if (!c) return;
      var t0 = c.currentTime + (delay || 0);
      var o = c.createOscillator(), g = c.createGain();
      o.type = type || "sine";
      o.frequency.setValueAtTime(f, t0);
      if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(Math.min(0.99, (gain || 0.05) * 14), t0 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(out || c.destination);
      o.start(t0); o.stop(t0 + dur + 0.03);
    }
    var api = {
      click: function(){ tone(520, 0.055, "triangle", 0.045); },
      pick:  function(n){ var f = 700 + Math.min(20, (n || 0) % 20) * 40; tone(f, 0.09, "sine", 0.05, 0, f + 260); },
      lose:  function(){ tone(260, 0.26, "sawtooth", 0.04, 0, 90); },
      win:   function(){ tone(660, 0.1, "sine", 0.05); tone(880, 0.12, "sine", 0.05, 0.1); tone(1240, 0.16, "sine", 0.045, 0.2); tone(1560, 0.2, "sine", 0.04, 0.3); },
      isOn:  function(){ return on; },
      set:   function(v){ on = v; try { localStorage.setItem("rtsx.sound.v1", v ? "on" : "off"); } catch(e) {} }
    };
    window.addEventListener("storage", function(e){ if (e.key === "rtsx.sound.v1") on = e.newValue !== "off"; });
    return api;
  })();

  var sndBtn = document.getElementById("snd");
  function paintSnd(){ if (sndBtn) sndBtn.classList.toggle("off", !SFX.isOn()); }
  paintSnd();
  if (sndBtn) sndBtn.addEventListener("click", function(){
    SFX.set(!SFX.isOn()); paintSnd(); if (SFX.isOn()) SFX.click();
  });
  window.addEventListener("storage", paintSnd);

  var TOTAL = 67, BOUND = 13.5, SPEED = 4.9;
  var MODE = (new URLSearchParams(location.search).get("mode") || "free") === "timed" ? "timed" : "free";
  var TIME_LIMIT = 90;
  var BEST_KEY = "rtsx.67.timed.best";

  var cv = document.getElementById("cv"), ctx = cv.getContext("2d");
  var countEl = document.getElementById("count");
  var clockEl = document.getElementById("clock");
  var clockLabel = document.getElementById("clockLabel");
  var overlay = document.getElementById("overlay");

  var W = 800, H = 600, cx = 400, cy = 300, focal = 700, DPR = 1;

  /* ---------- 相机与投影（机位相对玩家固定，基向量可预先算好） ---------- */
  var camOff = { y: 9.2, z: 11.5 };
  var cam = { x: 0, y: camOff.y, z: camOff.z };

  function norm3(x, y, z){ var l = Math.sqrt(x*x + y*y + z*z) || 1; return {x: x/l, y: y/l, z: z/l}; }
  var F = norm3(0, -camOff.y, -camOff.z);
  var R = {x: 1, y: 0, z: 0};
  var U = { x: 0, y: -F.z, z: F.y };          // cross(R, F)

  function project(px, py, pz){
    var dx = px - cam.x, dy = py - cam.y, dz = pz - cam.z;
    var sx = dx;
    var sy = dy * U.y + dz * U.z;
    var sz = dy * F.y + dz * F.z;
    if (sz < 0.9) return null;
    var k = focal / sz;
    return { x: cx + sx * k, y: cy - sy * k, s: sz };
  }

  /* ---------- 状态 ---------- */
  var player = {x: 0, z: 0};
  var keys = {up:false, down:false, left:false, right:false};
  var items = [], collected = 0, state = "menu";
  var startedAt = 0, elapsed = 0, last = 0, time = 0;
  var best = 0;
  try { best = parseInt(localStorage.getItem(BEST_KEY) || "0", 10) || 0; } catch (e) { best = 0; }

  function resize(){
    var box = cv.getBoundingClientRect();
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = Math.max(300, box.width);
    H = Math.max(300, box.height);
    cv.width = Math.floor(W * DPR);
    cv.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    cx = W / 2;
    cy = H * 0.52;
    focal = Math.max(520, Math.min(H * 1.15, W * 0.95));
  }

  function build(){
    items = [];
    var cells = 9, cell = (BOUND * 2) / cells;
    for (var i = 0; i < TOTAL; i++) {
      var gx = i % cells, gz = Math.floor(i / cells);
      var rnd = Math.random;
      var x = -BOUND + gx * cell + cell * (0.18 + rnd() * 0.64);
      var z = -BOUND + (gz % cells) * cell + cell * (0.18 + rnd() * 0.64);
      if (Math.abs(x) < 2.4 && Math.abs(z) < 2.4) { x += 3.2; z += 2.6; }
      x = Math.max(-BOUND, Math.min(BOUND, x));
      z = Math.max(-BOUND, Math.min(BOUND, z));
      items.push({ x: x, z: z, alive: true, scl: 1, phase: rnd() * 6.28, spin: rnd() * 6.28 });
    }
    collected = 0;
    countEl.textContent = "0";
  }

  function reset(){
    player.x = 0; player.z = 0;
    cam.x = 0; cam.z = camOff.z;
    build();
    elapsed = 0; state = "menu";
    clockEl.textContent = MODE === "timed" ? fmt(TIME_LIMIT) : fmt(0);
    clockLabel.textContent = MODE === "timed" ? "剩余" : "用时";
  }

  function start(){
    reset();
    state = "run";
    startedAt = performance.now();
    SFX.click();
    overlay.classList.remove("show");
  }

  function fmt(sec){
    sec = Math.max(0, Math.floor(sec));
    return Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0");
  }

  /* ---------- 场景绘制 ---------- */
  var LIGHT = norm3(-0.35, 0.85, 0.42);

  function color(k, r, g, b, a){
    return "rgba(" + Math.round(r * k) + "," + Math.round(g * k) + "," + Math.round(b * k) + "," + (a === undefined ? 1 : a) + ")";
  }

  function pushCube(list, ox, oy, oz, size, rot, rgb, alpha){
    var s = size / 2, c = Math.cos(rot), sn = Math.sin(rot);
    var base = [[-s,-s,-s],[s,-s,-s],[s,-s,s],[-s,-s,s],[-s,s,-s],[s,s,-s],[s,s,s],[-s,s,s]];
    var v = new Array(8), i;
    for (i = 0; i < 8; i++) {
      var bx = base[i][0] * c + base[i][2] * sn;
      var bz = -base[i][0] * sn + base[i][2] * c;
      v[i] = { x: ox + bx, y: oy + base[i][1], z: oz + bz };
    }
    var faces = [
      { i: [0,1,2,3], n: [0,-1,0] },
      { i: [4,7,6,5], n: [0,1,0] },
      { i: [3,2,6,7], n: [0,0,1] },
      { i: [1,0,4,5], n: [0,0,-1] },
      { i: [2,1,5,6], n: [1,0,0] },
      { i: [0,3,7,4], n: [-1,0,0] }
    ];
    for (i = 0; i < faces.length; i++) {
      var f = faces[i];
      var nx = f.n[0] * c + f.n[2] * sn;
      var nz = -f.n[0] * sn + f.n[2] * c;
      var ny = f.n[1];

      // 面中心
      var fx = 0, fy = 0, fz = 0, j;
      for (j = 0; j < 4; j++) { var pv = v[f.i[j]]; fx += pv.x; fy += pv.y; fz += pv.z; }
      fx /= 4; fy /= 4; fz /= 4;

      // 背面剔除
      if (nx * (cam.x - fx) + ny * (cam.y - fy) + nz * (cam.z - fz) <= 0) continue;

      var pts = [], depth = 0, ok = true;
      for (j = 0; j < 4; j++) {
        var p2 = v[f.i[j]];
        var pr = project(p2.x, p2.y, p2.z);
        if (!pr) { ok = false; break; }
        pts.push(pr.x, pr.y);
        depth += pr.s;
      }
      if (!ok) continue;
      depth /= 4;

      var lum = 0.58 + 0.42 * Math.max(0, nx * LIGHT.x + ny * LIGHT.y + nz * LIGHT.z);
      list.push({ pts: pts, d: depth, c: color(lum, rgb[0], rgb[1], rgb[2], alpha) });
    }
  }

  function drawGround(){
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#FCF8F1");
    g.addColorStop(0.55, "#F2EBDE");
    g.addColorStop(1, "#E9E1D2");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    var RANGE = 46, STEP = 2;
    ctx.lineWidth = 1;
    for (var i = -RANGE; i <= RANGE; i += STEP) {
      strokeSeg(project(i, 0, -RANGE), project(i, 0, RANGE));
      strokeSeg(project(-RANGE, 0, i), project(RANGE, 0, i));
    }
  }

  function strokeSeg(a, b){
    if (!a || !b) return;
    var s = Math.min(a.s, b.s);
    // 远处网格线在竖屏里会挤成一片，超过一定深度就淡掉
    var fade = Math.max(0, Math.min(1, (34 - s) / 14));
    if (fade <= 0.01) return;
    var alpha = Math.max(0.05, Math.min(0.46, 5.4 / s)) * fade;
    ctx.strokeStyle = "rgba(126,104,84," + alpha + ")";
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
  }

  function drawShadow(x, z, size){
    var p = project(x, 0, z);
    if (!p) return;
    var rx = (size * 0.9) * (focal / p.s), ry = rx * (U.z > 0 ? Math.abs(F.z) : 0.58);
    ry = rx * 0.28;
    ctx.fillStyle = "rgba(110,92,74,.18)";
    ctx.beginPath();
    ctx.ellipse(p.x, p.y, Math.max(2, rx), Math.max(1, ry), 0, 0, 6.2832);
    ctx.fill();
  }

  function draw(){
    drawGround();

    var t = time * 1.0;
    var faces = [];

    // 影子
    drawShadow(player.x, player.z, 1.0);
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      if (!it.alive && it.scl <= 0) continue;
      drawShadow(it.x, it.z, 0.72 * it.scl);
    }

    // 方块本体 + 悬浮标签，统一按深度排序
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    for (i = 0; i < items.length; i++) {
      var it2 = items[i];
      if (!it2.alive && it2.scl <= 0) continue;
      var y = 0.5 + Math.sin(t * 1.6 + it2.phase) * 0.13;
      pushCube(faces, it2.x, y, it2.z, 0.72 * it2.scl, it2.spin + t * 0.9, [217,119,87], it2.alive ? 1 : 0.45);
      if (it2.alive) {
        var lp = project(it2.x, 1.62 + Math.sin(t * 1.6 + it2.phase) * 0.13, it2.z);
        if (lp) {
          faces.push({ txt: "67", tx: lp.x, ty: lp.y, fs: Math.max(8, Math.min(44, 0.4 * focal / lp.s)), d: lp.s });
        }
      }
    }
    pushCube(faces, player.x, 0.5, player.z, 1.0, 0.35, [42,39,36], 1);

    faces.sort(function(a, b){ return b.d - a.d; });
    for (i = 0; i < faces.length; i++) {
      var f = faces[i];
      if (f.txt) {
        ctx.font = "600 " + f.fs.toFixed(1) + "px Georgia, 'Songti SC', serif";
        ctx.fillStyle = "rgba(45,38,32,.7)";
        ctx.fillText(f.txt, f.tx, f.ty);
        continue;
      }
      var pts = f.pts;
      ctx.beginPath();
      ctx.moveTo(pts[0], pts[1]);
      ctx.lineTo(pts[2], pts[3]);
      ctx.lineTo(pts[4], pts[5]);
      ctx.lineTo(pts[6], pts[7]);
      ctx.closePath();
      ctx.fillStyle = f.c;
      ctx.fill();
      ctx.strokeStyle = "rgba(60,40,30,.08)";
      ctx.lineWidth = 1;
      ctx.stroke();
    }

  }

  /* ---------- 更新 ---------- */
  function update(dt){
    // 相机跟随
    var tx = player.x, tz = player.z + camOff.z;
    var k = 1 - Math.pow(0.0025, dt);
    cam.x += (tx - cam.x) * k;
    cam.z += (tz - cam.z) * k;

    if (state !== "run") return;

    var mx = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    var mz = (keys.down ? 1 : 0) - (keys.up ? 1 : 0);
    if (mx && mz) { mx *= 0.7071; mz *= 0.7071; }

    player.x += mx * SPEED * dt;
    player.z += mz * SPEED * dt;
    player.x = Math.max(-BOUND, Math.min(BOUND, player.x));
    player.z = Math.max(-BOUND, Math.min(BOUND, player.z));

    // 收集
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      if (!it.alive) {
        if (it.scl > 0) it.scl = Math.max(0, it.scl - dt * 6);
        continue;
      }
      var dx = it.x - player.x, dz = it.z - player.z;
      if (dx * dx + dz * dz < 1.35) {
        it.alive = false;
        collected++;
        SFX.pick(collected);
        countEl.textContent = collected;
        if (MODE === "free" && collected >= TOTAL) return winFree();
      }
    }

    elapsed = (performance.now() - startedAt) / 1000;
    if (MODE === "timed") {
      var left = TIME_LIMIT - elapsed;
      clockEl.textContent = fmt(left);
      if (left <= 0) return endTimed();
    } else {
      clockEl.textContent = fmt(elapsed);
    }
  }

  function winFree(){
    state = "end";
    SFX.win();
    showPanel("自由模式", "集齐 67", "67 个方块全部收走了，用时 " + fmt(elapsed) + "。", "再来一局");
  }

  function endTimed(){
    state = "end";
    SFX.lose();
    if (collected > best) { best = collected; try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) {} }
    showPanel("限时模式", "时间到", "这一轮收走 " + collected + " 个，本机最好成绩 " + best + " 个。", "再来一局");
  }

  function showPanel(tag, title, text, btn){
    document.getElementById("ovTag").textContent = tag;
    document.getElementById("ovTitle").textContent = title;
    document.getElementById("ovText").textContent = text;
    document.getElementById("ovBtn").textContent = btn;
    overlay.classList.add("show");
  }

  /* ---------- 主循环 ---------- */
  function frame(now){
    if (!last) last = now;
    var dt = Math.min(0.06, (now - last) / 1000);
    last = now;
    time += dt;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  /* ---------- 输入 ---------- */
  var KEYS = {
    ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right",
    w: "up", s: "down", a: "left", d: "right",
    W: "up", S: "down", A: "left", D: "right"
  };
  document.addEventListener("keydown", function(e){
    var k = KEYS[e.key];
    if (k) { keys[k] = true; e.preventDefault(); }
  });
  document.addEventListener("keyup", function(e){
    var k = KEYS[e.key];
    if (k) { keys[k] = false; e.preventDefault(); }
  });
  window.addEventListener("blur", function(){
    keys.up = keys.down = keys.left = keys.right = false;
  });

  /* 触屏摇杆：屏幕上正下方居中，向哪推就往哪走（可斜向） */
  function mountStick(handler){
    var base = document.getElementById("stick"), knob = document.getElementById("knob");
    if (!base || !knob) return;
    var R = 40, pid = null;
    function place(cx, cy){
      var r = base.getBoundingClientRect();
      var x = cx - (r.left + r.width / 2), y = cy - (r.top + r.height / 2);
      var len = Math.sqrt(x * x + y * y);
      if (len > R) { x = x * R / len; y = y * R / len; }
      knob.style.transform = "translate(calc(-50% + " + x.toFixed(1) + "px),calc(-50% + " + y.toFixed(1) + "px))";
      handler(x / R, y / R);
    }
    function down(e){
      if (pid !== null) return;
      pid = e.pointerId;
      R = Math.max(26, base.clientWidth / 2 - 30);
      try { base.setPointerCapture(pid); } catch (err) {}
      place(e.clientX, e.clientY);
      e.preventDefault(); e.stopPropagation();
    }
    function move(e){ if (pid === null || e.pointerId !== pid) return; place(e.clientX, e.clientY); e.preventDefault(); }
    function up(e){
      if (pid === null || e.pointerId !== pid) return;
      pid = null;
      knob.style.transform = "translate(-50%,-50%)";
      handler(0, 0);
    }
    base.addEventListener("pointerdown", down);
    base.addEventListener("pointermove", move);
    base.addEventListener("pointerup", up);
    base.addEventListener("pointercancel", up);
    base.addEventListener("lostpointercapture", up);
  }
  mountStick(function(dx, dy){
    var z = 0.28;
    keys.left = dx < -z;  keys.right = dx > z;
    keys.up = dy < -z;    keys.down = dy > z;
  });

  document.getElementById("ovBtn").addEventListener("click", start);
  document.getElementById("back").addEventListener("click", function(){
    location.href = "index.html";
  });

  window.addEventListener("resize", resize);
  if (window.ResizeObserver) new ResizeObserver(resize).observe(cv);

  resize();
  reset();
  document.getElementById("ovTag").textContent = MODE === "timed" ? "限时模式" : "自由模式";
  document.getElementById("ovTitle").textContent = MODE === "timed" ? "67 限时" : "收集 67";
  document.getElementById("ovText").textContent = MODE === "timed"
    ? "90 秒，能捡多少算多少。本机最好成绩 " + best + " 个。"
    : "场地里散着 67 个方块，走近就会自动收走。集齐时计时停下。";
  requestAnimationFrame(frame);
})();
</script>
