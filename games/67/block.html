function drawMobs(){
  if (!mobs.length) return;
  var pn = 0, un = 0, sn = 0, inx = 0, vb = 0, i;
  for (i = 0; i < mobs.length; i++){
    var m = mobs[i], kd = mobKind(m.kind), s = kd.size;
    var bob = Math.sin(m.bob) * 0.05;
    var fx = Math.sin(m.yaw), fz = Math.cos(m.yaw);
    var b0 = { pn:pn, un:un, sn:sn, inx:inx, vb:vb };
    pushBox(mobBuf, b0, m.x - s * 0.5, m.y + 0.03 + bob, m.z - s * 0.5, s, s * 1.16, s, 1.0);
    pn = b0.pn; un = b0.un; sn = b0.sn; inx = b0.inx; vb = b0.vb;
    for (var e = 0; e < 2; e++){
      var side = e === 0 ? -1 : 1;
      var ex = m.x + fx * s * 0.5 + fz * side * s * 0.2;
      var ez = m.z + fz * s * 0.5 - fx * side * s * 0.2;
      var b1 = { pn:pn, un:un, sn:sn, inx:inx, vb:vb };
      pushBox(mobBuf, b1, ex - 0.075, m.y + s * 0.78 + bob, ez - 0.075, 0.15, 0.13, 0.15, 1.0);
      pn = b1.pn; un = b1.un; sn = b1.sn; inx = b1.inx; vb = b1.vb;
    }
  }
  gl.bindBuffer(gl.ARRAY_BUFFER, mobBuf.pos); gl.bufferData(gl.ARRAY_BUFFER, mobBuf.apos.subarray(0, pn), gl.DYNAMIC_DRAW);
  gl.bindBuffer(gl.ARRAY_BUFFER, mobBuf.uv); gl.bufferData(gl.ARRAY_BUFFER, mobBuf.auv.subarray(0, un), gl.DYNAMIC_DRAW);
  gl.bindBuffer(gl.ARRAY_BUFFER, mobBuf.sh); gl.bufferData(gl.ARRAY_BUFFER, mobBuf.ash.subarray(0, sn), gl.DYNAMIC_DRAW);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, mobBuf.idx);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, useU32 ? mobBuf.aidx.subarray(0, inx) : new Uint16Array(mobBuf.aidx.subarray(0, inx)), gl.DYNAMIC_DRAW);

  gl.useProgram(P_W);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.uniform1i(L.uTex, 0);
  gl.uniformMatrix4fv(L.uVP, false, mVP);
  gl.uniform1f(L.uAlpha, 1.0);
  gl.uniform3fv(L.uFogCol, FOG_COL);
  gl.uniform1f(L.uFogA, FOG_A); gl.uniform1f(L.uFogB, FOG_B);
  gl.uniform3f(L.uEye, px, py + EYE, pz);
  gl.bindBuffer(gl.ARRAY_BUFFER, mobBuf.pos); gl.enableVertexAttribArray(L.aPos); gl.vertexAttribPointer(L.aPos, 3, gl.FLOAT, false, 0, 0);
  gl.bindBuffer(gl.ARRAY_BUFFER, mobBuf.uv); gl.enableVertexAttribArray(L.aUV); gl.vertexAttribPointer(L.aUV, 2, gl.FLOAT, false, 0, 0);
  gl.bindBuffer(gl.ARRAY_BUFFER, mobBuf.sh); gl.enableVertexAttribArray(L.aShade); gl.vertexAttribPointer(L.aShade, 1, gl.FLOAT, false, 0, 0);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, mobBuf.idx);
  var stride = (useU32 ? 4 : 2) * 36;
  for (i = 0; i < mobs.length; i++){
    var mm = mobs[i], mk = mobKind(mm.kind);
    var rgb = hex2rgb(mk.color), f = mm.flash;
    gl.uniform3f(L.uTint, rgb[0] + f * 0.85, rgb[1] + f * 0.85, rgb[2] + f * 0.85);
    gl.drawElements(gl.TRIANGLES, 36, useU32 ? gl.UNSIGNED_INT : gl.UNSIGNED_SHORT, stride * (i * 3));
    var er = hex2rgb(mk.eyes);
    gl.uniform3f(L.uTint, er[0] * 2.2, er[1] * 2.0, er[2] * 1.6);
    gl.drawElements(gl.TRIANGLES, 72, useU32 ? gl.UNSIGNED_INT : gl.UNSIGNED_SHORT, stride * (i * 3 + 1));
  }
  gl.uniform3f(L.uTint, 1, 1, 1);
}

/* ============================== 掉落物 ============================== */
var MAXDROP = 26, DROPS = [];
var drBuf = {
  pos: gl.createBuffer(), uv: gl.createBuffer(), sh: gl.createBuffer(), idx: gl.createBuffer(),
  apos: new Float32Array(MAXDROP * 6 * 4 * 3), auv: new Float32Array(MAXDROP * 6 * 4 * 2),
  ash: new Float32Array(MAXDROP * 6 * 4), aidx: new Uint32Array(MAXDROP * 6 * 6)
};
function spawnDrop(x, y, z, mat, n){
  if (DROPS.length >= MAXDROP) DROPS.shift();
  DROPS.push({
    x:x, y:y, z:z, mat:mat, n:n || 1,
    vx:(Math.random() - 0.5) * 1.5, vy:1.2 + Math.random() * 1.1, vz:(Math.random() - 0.5) * 1.5,
    bob:Math.random() * 6, life:55
  });
}
function stepDrops(dt){
  for (var i = DROPS.length - 1; i >= 0; i--){
    var d = DROPS[i];
    d.life -= dt; d.bob += dt * 4.2;
    if (d.life <= 0){ DROPS.splice(i, 1); continue; }
    d.vy -= 9 * dt;
    var ny = d.y + d.vy * dt;
    if (d.vy < 0 && getB(Math.floor(d.x), Math.floor(ny - 0.12), Math.floor(d.z))){
      d.vy = 0; ny = Math.floor(ny - 0.12) + 1.12; d.vx *= 0.7; d.vz *= 0.7;
    }
    d.y = ny; d.x += d.vx * dt; d.z += d.vz * dt;
    if (Math.hypot(d.x - px, d.z - pz) < 1.5 && Math.abs(d.y - py) < 2.4){
      addMat(d.mat, d.n);
      toast("捡到 " + d.mat + "×" + d.n);
      SFX.play("click", { volume: .5 });
      DROPS.splice(i, 1);
    }
  }
}
function drawDrops(){
  if (!DROPS.length) return;
  var pn = 0, un = 0, sn = 0, inx = 0, vb = 0, i;
  for (i = 0; i < DROPS.length; i++){
    var d = DROPS[i], bob = Math.sin(d.bob) * 0.07;
    var b0 = { pn:pn, un:un, sn:sn, inx:inx, vb:vb };
    pushBox(drBuf, b0, d.x - 0.11, d.y - 0.11 + bob, d.z - 0.11, 0.22, 0.22, 0.22, 1.0);
    pn = b0.pn; un = b0.un; sn = b0.sn; inx = b0.inx; vb = b0.vb;
  }
  gl.bindBuffer(gl.ARRAY_BUFFER, drBuf.pos); gl.bufferData(gl.ARRAY_BUFFER, drBuf.apos.subarray(0, pn), gl.DYNAMIC_DRAW);
  gl.bindBuffer(gl.ARRAY_BUFFER, drBuf.uv); gl.bufferData(gl.ARRAY_BUFFER, drBuf.auv.subarray(0, un), gl.DYNAMIC_DRAW);
  gl.bindBuffer(gl.ARRAY_BUFFER, drBuf.sh); gl.bufferData(gl.ARRAY_BUFFER, drBuf.ash.subarray(0, sn), gl.DYNAMIC_DRAW);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, drBuf.idx);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, useU32 ? drBuf.aidx.subarray(0, inx) : new Uint16Array(drBuf.aidx.subarray(0, inx)), gl.DYNAMIC_DRAW);
  gl.useProgram(P_W);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.uniform1i(L.uTex, 0);
  gl.uniformMatrix4fv(L.uVP, false, mVP);
  gl.uniform1f(L.uAlpha, 1.0);
  gl.uniform3fv(L.uFogCol, FOG_COL);
  gl.uniform1f(L.uFogA, FOG_A); gl.uniform1f(L.uFogB, FOG_B);
  gl.uniform3f(L.uEye, px, py + EYE, pz);
  gl.bindBuffer(gl.ARRAY_BUFFER, drBuf.pos); gl.enableVertexAttribArray(L.aPos); gl.vertexAttribPointer(L.aPos, 3, gl.FLOAT, false, 0, 0);
  gl.bindBuffer(gl.ARRAY_BUFFER, drBuf.uv); gl.enableVertexAttribArray(L.aUV); gl.vertexAttribPointer(L.aUV, 2, gl.FLOAT, false, 0, 0);
  gl.bindBuffer(gl.ARRAY_BUFFER, drBuf.sh); gl.enableVertexAttribArray(L.aShade); gl.vertexAttribPointer(L.aShade, 1, gl.FLOAT, false, 0, 0);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, drBuf.idx);
  var stride = (useU32 ? 4 : 2) * 36;
  for (i = 0; i < DROPS.length; i++){
    var blk = matBlock(DROPS[i].mat);
    var col = blk ? (TILE_COL[BD[blk].tiles[0]] || "#CCC") : "#C86A5C";
    var rgb2 = hex2rgb(col);
    gl.uniform3f(L.uTint, Math.min(1.2, rgb2[0] * 1.15), Math.min(1.2, rgb2[1] * 1.15), Math.min(1.2, rgb2[2] * 1.15));
    gl.drawElements(gl.TRIANGLES, 36, useU32 ? gl.UNSIGNED_INT : gl.UNSIGNED_SHORT, stride * i);
  }
  gl.uniform3f(L.uTint, 1, 1, 1);
}

/* ============================== 任务 ============================== */
var QUEST_KINDS = [
  { t:"mine",  base:16, short:"挖矿", txt:function(n){ return "挖掉 " + n + " 块方块"; }, rw:{ "石":3 } },
  { t:"place", base:12, short:"搭建", txt:function(n){ return "放下 " + n + " 块方块"; }, rw:{ "木":3 } },
  { t:"kill",  base:2,  short:"清夜", txt:function(n){ return "打散 " + n + " 只幽影"; }, rw:{ "铁":1 } },
  { t:"iron",  base:4,  short:"攒铁", txt:function(n){ return "累计攒到 " + n + " 块铁"; }, rw:{ "金":1 } },
  { t:"night", base:1,  short:"守夜", txt:function(n){ return "活过 " + n + " 个夜晚"; }, rw:{ "黑曜":1 } },
  { t:"craft", base:1,  short:"合成", txt:function(n){ return "合成 " + n + " 件 67 工具"; }, rw:{ "玻璃":2 } }
];
var quests = [], questDone = 0, questLog = [];
function questKind(t){
  for (var i = 0; i < QUEST_KINDS.length; i++) if (QUEST_KINDS[i].t === t) return QUEST_KINDS[i];
  return QUEST_KINDS[0];
}
function rollQuest(){
  var kinds = QUEST_KINDS.slice();
  for (var i = 0; i < quests.length; i++){
    for (var j = kinds.length - 1; j >= 0; j--) if (kinds[j].t === quests[i].t) kinds.splice(j, 1);
  }
  if (!kinds.length) kinds = QUEST_KINDS.slice();
  var k = kinds[Math.floor(Math.random() * kinds.length)];
  var need = Math.max(1, Math.round(k.base * (1 + questDone * 0.3)));
  return { t:k.t, need:need, cur:0, rw:k.rw, txt:k.txt(need) };
}
function initQuests(){
  quests = [];
  for (var i = 0; i < 3; i++) quests.push(rollQuest());
  paintQuests();
}
function questProgress(type, amount){
  var changed = false;
  for (var i = 0; i < quests.length; i++){
    var q = quests[i];
    if (q.t !== type) continue;
    q.cur += (amount || 1); changed = true;
    if (q.cur >= q.need){ completeQuest(i); changed = true; }
  }
  if (changed) paintQuests();
}
function completeQuest(i){
  var q = quests[i]; if (!q) return;
  var rw = Object.keys(q.rw)[0];
  addMat(rw, q.rw[rw]);
  questDone++;
  toast("任务完成：" + q.txt + " → " + rw + "×" + q.rw[rw]);
  questLog.push(q.txt);
  SFX.play("success", { volume: .7 });
  if (questDone >= 3) unlockAch("quester");
  quests[i] = rollQuest();
  paintQuests(); saveSoon();
}
function paintQuests(){
  var box = el("quests"); if (!box) return;
  var html = "";
  for (var i = 0; i < quests.length; i++){
    var q = quests[i], k = questKind(q.t);
    var pct = Math.min(100, Math.round(q.cur / q.need * 100));
    html += '<div class="q"><b>' + k.short + "</b><span>" + q.txt + "</span>"
      + '<i class="qp"><u style="width:' + pct + '%"></u></i></div>';
  }
  box.innerHTML = html;
}

function enterGame(){

  lastT = 0;
  SFX.play("score", { volume:.5 });
  if (!IS_TOUCH) lockPointer();
}

function loop(t){
  requestAnimationFrame(loop);
  if (!running) return;
  if (!lastT) lastT = t;
  var dt = Math.min(0.05, (t - lastT) / 1000);
  lastT = t;

  if (!overlayOpen()){
    if (!freeCam){
      tick(dt);
      updateMining(dt);
      netTick(dt, t);
    }
  } else {
    genT += dt;
  }

  if (dirty) rebuild();
  render();
  paintTags();
}

/* ============================== 事件绑定 ============================== */
/* 统一入口：pointerdown 立即响应，click 作为兜底（避免部分浏览器吞掉点击） */
function tap(node, fn){
  if (!node) return;
  var stamp = 0;
  node.addEventListener("pointerdown", function(e){
    if (e.pointerType === "mouse" && e.button !== 0) return;
    e.preventDefault(); e.stopPropagation();
    stamp = Date.now();
    fn(e, node);
  }, { passive:false });
  node.addEventListener("click", function(e){
    if (Date.now() - stamp < 600) return;
    fn(e, node);
  });
}
