<script>
(function(){
"use strict";

/* ================= 基础 ================= */
var TILE=24, W=760, H=230;
var world=new Uint8Array(W*H), wall=new Uint8Array(W*H);
var surfaceY=new Int16Array(W);
var torchLights=[];

var T={AIR:0,GRASS:1,DIRT:2,STONE:3,WOOD:4,LEAF:5,COPPER:6,IRON:7,GOLD:8,PLANK:9,TORCH:10,BENCH:11,FURNACE:12,ANVIL:13,SAND:14,SNOW:15,ICE:16,GEM:17,CHEST:18,CACTUS:19};
var SOLID={};
[1,2,3,4,6,7,8,9,11,12,13,14,15,16,17,18,19].forEach(function(k){SOLID[k]=1;});
var HARD={1:.5,2:.55,3:1.2,4:.7,5:.25,6:1.45,7:1.8,8:2.0,9:.8,10:.15,11:1.0,12:1.5,13:1.8,14:.45,15:.4,16:.9,17:2.3,18:1.0,19:.5};
var YIELD={1:"dirt",2:"dirt",3:"stone",4:"wood",5:"wood",6:"copper",7:"iron",8:"gold",9:"plank",10:"torch",11:"bench",12:"furnace",13:"anvil",14:"sand",15:"snow",16:"ice",17:"gem",18:"chest",19:"wood"};
var PLACE={dirt:T.DIRT,stone:T.STONE,wood:T.WOOD,plank:T.PLANK,sand:T.SAND,snow:T.SNOW,ice:T.ICE,torch:T.TORCH,bench:T.BENCH,furnace:T.FURNACE,anvil:T.ANVIL};

var ITEMS={
  dirt:{n:"泥土",c:"#8B5A2B"}, stone:{n:"石头",c:"#77736B"}, wood:{n:"木头",c:"#7A4E2A"},
  plank:{n:"木板",c:"#B4844E"}, sand:{n:"沙子",c:"#E0C984"}, snow:{n:"雪",c:"#EDF1F6"},
  ice:{n:"冰",c:"#9FD7EA"}, copper:{n:"铜矿",c:"#C9743E"}, iron:{n:"铁矿",c:"#A8A29C"},
  gold:{n:"金矿",c:"#D9B23A"}, gem:{n:"宝石",c:"#7FD1C6"}, gel:{n:"凝胶",c:"#5FB2E8"},
  barC:{n:"铜锭",c:"#D98B4B"}, barI:{n:"铁锭",c:"#C3BEB8"}, barG:{n:"金锭",c:"#E8C64B"},
  torch:{n:"火把",c:"#FFC46B"}, bench:{n:"工作台",c:"#9C6B3F"}, furnace:{n:"熔炉",c:"#8A7E76"},
  anvil:{n:"铁砧",c:"#6E7076"}, pickW:{n:"木镐",c:"#9A6B36"}, pickC:{n:"铜镐",c:"#C97A44"},
  pickI:{n:"铁镐",c:"#BFB9B2"}, pickG:{n:"金镐",c:"#E8C64B"},
  swordW:{n:"木剑",c:"#A9763D"}, swordC:{n:"铜剑",c:"#D0884C"}, swordI:{n:"铁剑",c:"#CFCAC3"},
  swordG:{n:"金剑",c:"#F1D45C"}, crown:{n:"史莱姆王冠",c:"#6FCBE8"}, crystal:{n:"生命水晶",c:"#FF8AA8"}
};
var PICKPOWER={pickW:.62,pickC:1.0,pickI:1.5,pickG:2.0};
var SWORDDMG={swordW:13,swordC:21,swordI:31,swordG:44};

var canvas=document.getElementById("c");
var g=canvas.getContext("2d");
var view={w:1,h:1,dpr:1};
function resize(){
  var dpr=Math.min(2,window.devicePixelRatio||1);
  view.dpr=dpr;
  var w=window.innerWidth||360, h=window.innerHeight||640;
  canvas.width=Math.floor(w*dpr); canvas.height=Math.floor(h*dpr);
  canvas.style.width=w+"px"; canvas.style.height=h+"px";
  g.setTransform(dpr,0,0,dpr,0,0);
  view.w=w; view.h=h;
}
window.addEventListener("resize",resize);
resize();

function idx(x,y){return y*W+x;}
function get(x,y){
  if(y>=H) return T.STONE;
  if(x<0||x>=W) return T.STONE;
  if(y<0) return T.AIR;
  return world[y*W+x];
}
function put(x,y,v){
  if(x<0||x>=W||y<0||y>=H) return;
  world[y*W+x]=v;
  if(v===T.TORCH) torchLights.push([x,y]);
}
function solid(x,y){return SOLID[get(x,y)]?1:0;}
function wallAt(x,y){ if(x<0||x>=W||y<0||y>=H) return 0; return wall[y*W+x]; }

/* ================= 世界生成 ================= */
var BIOME_FOREST=0, BIOME_SNOW=1, BIOME_DESERT=2;
function biomeAt(x){
  var r=x/W;
  if(r<0.17) return BIOME_SNOW;
  if(r>0.66&&r<0.88) return BIOME_DESERT;
  return BIOME_FOREST;
}
function genWorld(){
  var x,y,i;
  world.fill(0); wall.fill(0); torchLights=[];
  var s1=Math.random()*6.28, s2=Math.random()*6.28;
  for(x=0;x<W;x++){
    var h=Math.sin(x*0.019+s1)*9 + Math.sin(x*0.0062+s2)*17 + Math.sin(x*0.093+s1*1.7)*2.4;
    var sy=Math.floor(H*0.30+h);
    if(sy<20) sy=20; if(sy>H*0.55) sy=Math.floor(H*0.55);
    surfaceY[x]=sy;
    var b=biomeAt(x);
    for(y=sy;y<sy+5;y++){
      if(b===BIOME_DESERT) world[idx(x,y)]=T.SAND;
      else if(b===BIOME_SNOW&&y<sy+2) world[idx(x,y)]=T.SNOW;
      else world[idx(x,y)]=y===sy?T.GRASS:T.DIRT;
    }
    for(y=sy+5;y<H;y++){
      world[idx(x,y)]=(y<H-1&&Math.random()<0.06)?T.AIR:T.STONE;
    }
    for(y=sy+1;y<Math.min(H,sy+9);y++) wall[idx(x,y)]=1;
    for(y=sy+9;y<H;y++) wall[idx(x,y)]=2;
  }
  /* 洞穴：随机游走 */
  for(i=0;i<430;i++){
    var cx=Math.floor(Math.random()*W);
    var cy=Math.floor(surfaceY[cx]+4+Math.random()*(H-surfaceY[cx]-10));
    var ang=Math.random()*6.28, life=28+Math.floor(Math.random()*46);
    for(var k=0;k<life;k++){
      var rr=1+(Math.random()<0.4?1:0);
      for(var dy=-rr;dy<=rr;dy++) for(var dx=-rr;dx<=rr;dx++){
        if(dx*dx+dy*dy<=rr*rr+1){
          var tx=cx+dx, ty=cy+dy;
          if(ty>surfaceY[Math.max(0,Math.min(W-1,tx))+3]) put(tx,ty,T.AIR);
        }
      }
      ang+=(Math.random()-0.5)*0.9;
      cx+=Math.round(Math.cos(ang)*1.3); cy+=Math.round(Math.sin(ang)*1.1)+0.2;
      if(cx<1||cx>W-2||cy>H-3) break;
    }
  }
  /* 矿脉 */
  function vein(type,count,dmin,dmax,size){
    for(var i2=0;i2<count;i2++){
      var vx=Math.floor(Math.random()*W);
      var top=surfaceY[vx]+dmin;
      var vy=Math.floor(top+Math.random()*(Math.max(1,dmax-dmin)));
      if(vy>=H-2) continue;
      for(var s=0;s<size;s++){
        var ox=vx+Math.floor(Math.random()*3-1), oy=vy+Math.floor(Math.random()*3-1);
        if(get(ox,oy)===T.STONE) put(ox,oy,type);
        vx=ox; vy=oy;
      }
    }
  }
  vein(T.COPPER,220,3,40,7);
  vein(T.IRON,150,12,75,6);
  vein(T.GOLD,85,30,120,5);
  vein(T.GEM,55,45,150,3);
  /* 宝箱 */
  var placed=0;
  for(i=0;i<400&&placed<16;i++){
    var bx=Math.floor(Math.random()*W);
    var by=Math.floor(surfaceY[bx]+8+Math.random()*(H-surfaceY[bx]-14));
    if(get(bx,by)===T.AIR&&get(bx,by+1)!==T.AIR&&get(bx,by-1)===T.AIR){
      put(bx,by,T.CHEST); placed++;
    }
  }
  /* 树：森林才有，出生点附近留空 */
  for(x=8;x<W-8;x++){
    if(biomeAt(x)!==BIOME_FOREST) continue;
    if(get(x,surfaceY[x])!==T.GRASS) continue;
    if(Math.abs(x-Math.floor(W*0.5))<9) continue;
    if(Math.random()>0.14) continue;
    var th=5+Math.floor(Math.random()*5);
    for(y=1;y<=th;y++) put(x,surfaceY[x]-y,T.WOOD);
    var topY=surfaceY[x]-th;
    for(var ly=-2;ly<=1;ly++) for(var lx=-2;lx<=2;lx++){
      if(Math.abs(lx)===2&&Math.abs(ly)===1) continue;
      var lyy=topY+ly;
      if(get(x+lx,lyy)===T.AIR||get(x+lx,lyy)===T.LEAF) put(x+lx,lyy,T.LEAF);
    }
  }
  /* 沙漠仙人掌 */
  for(x=6;x<W-6;x++){
    if(biomeAt(x)!==BIOME_DESERT) continue;
    if(get(x,surfaceY[x])!==T.SAND) continue;
    if(Math.random()>0.12) continue;
    var ch=2+Math.floor(Math.random()*3);
    for(y=1;y<=ch;y++) put(x,surfaceY[x]-y,T.CACTUS);
  }
}

/* ================= 状态 ================= */
var PW=0.62, PH=1.75;
var playerName="67 探险者";
var SPEED=4.4, JUMPV=-7.9, GRAV=15.5, MAXY=14;
var px=0.5, py=0, vx=0, vy=0, onGround=false, facing=1, walkT=0, stepT=0;
var hp=100, maxHp=100, dead=0, invul=0, time=0.32, dayLen=160;
var inv={pickW:1,swordW:1,torch:14,dirt:0,wood:0,gel:0};
var SLOTS=["pickW","swordW","torch","plank","dirt","stone","bench","furnace"];
var sel=0, placing=false;
var spawn={x:0,y:0};
var mobs=[], parts=[], nums=[], boss=null, bossKills=0, shake=0;
var dig=null, hold=null, hitDone=false, swingT=0, toastT=0;

var RECIPES=[
  {o:"plank",n:2,c:{wood:1},s:""},
  {o:"torch",n:4,c:{wood:1,gel:1},s:""},
  {o:"bench",n:1,c:{wood:10},s:""},
  {o:"pickW",n:1,c:{wood:12},s:""},
  {o:"swordW",n:1,c:{wood:8},s:""},
  {o:"furnace",n:1,c:{stone:20,wood:4},s:"bench"},
  {o:"barC",n:1,c:{copper:3},s:"furnace"},
  {o:"barI",n:1,c:{iron:3},s:"furnace"},
  {o:"barG",n:1,c:{gold:3},s:"furnace"},
  {o:"anvil",n:1,c:{barI:5,wood:3},s:"bench"},
  {o:"pickC",n:1,c:{barC:10,wood:3},s:"anvil"},
  {o:"swordC",n:1,c:{barC:8},s:"anvil"},
  {o:"pickI",n:1,c:{barI:12,wood:4},s:"anvil"},
  {o:"swordI",n:1,c:{barI:10},s:"anvil"},
  {o:"swordG",n:1,c:{barG:10,gem:2},s:"anvil"},
  {o:"pickG",n:1,c:{barG:12,gem:3},s:"anvil"}
];
var STATIONNAME={bench:"工作台",furnace:"熔炉",anvil:"铁砧"};

/* ================= 背包 ================= */
function gain(id,n){
  if(!n) n=1;
  inv[id]=(inv[id]||0)+n;
  if(id==="crystal"){
    maxHp+=20; hp=Math.min(maxHp,hp+20);
    toast("生命水晶 · 上限 +20");
    if(SLOTS.indexOf("crystal")<0) SLOTS[SLOTS.length-1]="crystal";
  }
  paintBar();
}
function has(cost){
  for(var k in cost) if((inv[k]||0)<cost[k]) return false;
  return true;
}
function spend(cost){
  for(var k in cost) inv[k]=(inv[k]||0)-cost[k];
}
function stations(){
  var found={};
  var cx=Math.floor(px), cy=Math.floor(py);
  for(var y=cy-6;y<=cy+7;y++) for(var x=cx-8;x<=cx+8;x++){
    var t=get(x,y);
    if(t===T.BENCH) found.bench=1;
    else if(t===T.FURNACE) found.furnace=1;
    else if(t===T.ANVIL) found.anvil=1;
  }
  return found;
}
function craft(r){
  if(!has(r.c)) { toast("材料不够"); return false; }
  if(r.s&&!stations()[r.s]){ toast("需要靠近"+STATIONNAME[r.s]); return false; }
  spend(r.c); gain(r.o,r.n);
  if(SLOTS.indexOf(r.o)<0&&PLACE[r.o]&&SLOTS[3]==="plank") SLOTS[3]=r.o;
  toast("合成 "+ITEMS[r.o].n+" ×"+r.n);
  paintBar();
  return true;
}

/* ================= 碰撞 ================= */
function rowSolid(sx,row){
  var lx=Math.floor(sx-PW+0.06), rx=Math.floor(sx+PW-0.06);
  for(var x=lx;x<=rx;x++) if(solid(x,row)) return true;
  return false;
}
function bodySolid(sx,sy){
  var t=Math.floor(sy+0.05), b=Math.floor(sy+PH-0.05);
  for(var y=t;y<=b;y++) if(rowSolid(sx,y)) return true;
  return false;
}
function collideMove(nx,ny){
  var prevY=py, r;
  if(!bodySolid(nx,py)){ px=nx; }
  else if(onGround&&!bodySolid(nx,py-1)){ py-=1; px=nx; }
  else { vx=0; }
  if(!bodySolid(px,ny)){ py=ny; onGround=false; }
  else if(ny>prevY){
    r=Math.floor(ny+PH);
    if(rowSolid(px,r)) py=r-PH-0.002;
    vy=0; onGround=true;
  } else {
    r=Math.floor(ny);
    if(rowSolid(px,r)) py=r+1;
    vy=0;
  }
  if(!onGround) onGround=rowSolid(px,Math.floor(py+PH+0.02));
}

/* ================= 挖 / 放 / 打 ================= */
function pickPower(){
  var it=SLOTS[sel];
  return PICKPOWER[it]||0.4;
}
function swordDmg(){
  var it=SLOTS[sel];
  return SWORDDMG[it]||0;
}
function mineAt(tx,ty,dt){
  var t=get(tx,ty);
  if(t===T.AIR||t===T.LEAF&&false) return;
  var d=Math.abs(tx-px)+Math.abs(ty-(py+PH/2));
  if(d>5.6) return;
  if(!dig||dig.tx!==tx||dig.ty!==ty){ dig={tx:tx,ty:ty,p:0}; }
  var hard=HARD[t]||1;
  dig.p+=dt*pickPower()/hard;
  if(dig.p>=1){
    var y=YIELD[t];
    put(tx,ty,T.AIR);
    burst(tx+0.5,ty+0.5,tileColor(t),7);
    if(t===T.CHEST){
      var loot=["gel","gel","torch","barC","barI","gem","crystal"];
      var n=2+Math.floor(Math.random()*2);
      for(var i=0;i<n;i++) gain(loot[Math.floor(Math.random()*loot.length)]);
      toast("打开宝箱");
    } else if(y) gain(y);
    paintBar();
    dig=null;
    shake=Math.max(shake,2);
  }
}
function placeAt(tx,ty){
  var it=SLOTS[sel], t=PLACE[it];
  if(!t){ toast("这个不能放"); return; }
  if(!(inv[it]>0)){ toast("没有 "+ITEMS[it].n); return; }
  if(get(tx,ty)!==T.AIR){ return; }
  if(tx>=Math.floor(px-PW)&&tx<=Math.floor(px+PW)&&ty>=Math.floor(py)&&ty<=Math.floor(py+PH)){ toast("这里放不下"); return; }
  var near=false;
  if(solid(tx-1,ty)||solid(tx+1,ty)||solid(tx,ty-1)||solid(tx,ty+1)||solid(tx-1,ty-1)||solid(tx+1,ty+1)) near=true;
  if(!near){ toast("要贴着已有的方块"); return; }
  put(tx,ty,t); inv[it]--; paintBar();
  burst(tx+0.5,ty+0.5,tileColor(t),5);
}
function attack(){
  if(swingT>0) return;
  var dmg=swordDmg();
  if(!dmg){ toast("手里不是武器"); return; }
  swingT=0.3; hitDone=false;
}
function hitFront(){
  var dmg=swordDmg();
  var cx=px+facing*1.15, cy=py+PH*0.5;
  var all=mobs.slice(); if(boss) all.push(boss);
  for(var i=0;i<all.length;i++){
    var m=all[i];
    var dx=(m.x+ (m.w||1)/2)-cx, dy=(m.y+(m.h||1)/2)-cy;
    if(Math.abs(dx)<1.5&&Math.abs(dy)<1.5){
      m.hp-=dmg;
      nums.push({x:m.x+m.w/2,y:m.y,t:0.7,v:dmg,c:"#FFD9A0"});
      m.vx=facing*3.2;
      burst(m.x+m.w/2,m.y+m.h/2,"#E2678B",5);
      if(m.hp<=0) killMob(m);
    }
  }
}

/* ================= 怪物 ================= */
var MTYPE={
  slime:{w:.9,h:.8,hp:26,dmg:9,drop:"gel",color:"#5FB2E8",speed:1.5},
  zombie:{w:.62,h:1.7,hp:44,dmg:14,drop:"gel",color:"#5A7A54",speed:1.6},
  bat:{w:.8,h:.55,hp:18,dmg:7,drop:"gel",color:"#6B5A78",speed:2.6},
  skeleton:{w:.6,h:1.7,hp:62,dmg:18,drop:"gem",color:"#D8D3C4",speed:1.2},
  king:{w:2.6,h:2.0,hp:340,dmg:22,drop:"crown",color:"#63C3E0",speed:1.6}
};
function spawnMob(type,x,y){
  var cfg=MTYPE[type];
  var m={type:type,x:x,y:y,w:cfg.w,h:cfg.h,vx:0,vy:0,hp:cfg.hp,max:cfg.hp,
    dmg:cfg.dmg,onGround:false,cool:0,t:0,dir:Math.random()<0.5?-1:1};
  if(type==="king"){
    m.hp=cfg.hp; m.max=cfg.hp; boss=m;
  } else {
    mobs.push(m);
  }
  return m;
}
function killMob(m){
  if(m===boss){
    boss=null;
    gain("crown"); gain("barG",3); gain("gel",5);
    toast("史莱姆王倒下了 · 掉落王冠");
    shake=8;
  } else {
    var i=mobs.indexOf(m); if(i>=0) mobs.splice(i,1);
    var cfg=MTYPE[m.type];
    if(Math.random()<0.6) gain(cfg.drop);
    if(m.type==="slime"){ bossKills++; }
  }
  burst(m.x+m.w/2,m.y+m.h/2,cfgColor(m),10);
  shake=Math.max(shake,4);
}
function cfgColor(m){ var c=MTYPE[m.type]; return c?c.color:"#E2678B"; }
function nearSolid(m){
  var lx=Math.floor(m.x), rx=Math.floor(m.x+m.w);
  var t=Math.floor(m.y+m.h-0.05);
  return solid(lx,t)||solid(rx,t);
}
function maybeStep(m){
  if(!m.onGround) return;
  var ahead=m.x+(m.dir>0?m.w+0.3:-0.3);
  var foot=Math.floor(m.y+m.h);
  if(solid(Math.floor(ahead),foot)&&!solid(Math.floor(ahead),foot-1)&&!solid(Math.floor(m.x+m.w/2),foot-2)){
    m.y-=1;
  }
}
function updateMob(m,dt){
  m.t+=dt;
  var cfg=MTYPE[m.type];
  var cx=px, cy=py+PH/2;
  var mx=m.x+m.w/2, my=m.y+m.h/2;
  var dx=cx-mx, dy=cy-my;
  var dist=Math.sqrt(dx*dx+dy*dy)||1;
  if(m.type==="bat"){
    m.x+=(dx/dist)*cfg.speed*dt;
    m.y+=(dy/dist)*cfg.speed*dt+Math.sin(m.t*6)*dt*1.6;
    if(solid(Math.floor(m.x+0.5),Math.floor(m.y+0.5))){ m.y-=dt*2; }
  } else {
    m.dir=dx>0?1:-1;
    var speed=cfg.speed;
    if(m.type==="king") speed=cfg.speed*(dist>6?1.3:1);
    if(dist<16||m.type==="king"){
      m.x+=m.dir*speed*dt;
      if(m.onGround&&(nearSolid(m)||Math.random()<0.05)&&dist>1){
        m.vy=-7.2;
      }
    }
    m.vy+=GRAV*dt;
    if(m.vy>MAXY) m.vy=MAXY;
    var ny=m.y+m.vy*dt;
    if(m.vy>0){
      var rr=Math.floor(ny+m.h);
      var blocked=false;
      for(var x=Math.floor(m.x);x<=Math.floor(m.x+m.w);x++) if(solid(x,rr)) blocked=true;
      if(blocked){ m.y=rr-m.h-0.002; m.vy=0; m.onGround=true; } else { m.y=ny; m.onGround=false; }
    } else {
      var rt=Math.floor(ny);
      var hb=false;
      for(var x2=Math.floor(m.x);x2<=Math.floor(m.x+m.w);x2++) if(solid(x2,rt)) hb=true;
      if(hb){ m.y=rt+1; m.vy=0; } else { m.y=ny; m.onGround=false; }
    }
    maybeStep(m);
    if(m.type==="king"&&m.onGround&&m.cool<=0){
      m.cool=4.5;
      spawnMob("slime",m.x-1.5,m.y);
      spawnMob("slime",m.x+m.w+0.4,m.y);
    }
  }
  if(m.cool>0) m.cool-=dt;
  /* 接触伤害 */
  if(Math.abs(mx-px)<m.w/2+PW+0.1&&Math.abs(my-(py+PH/2))<(m.h+PH)/2&&invul<=0){
    hp-=m.dmg; invul=1.1; shake=5;
    nums.push({x:px,y:py,t:0.8,v:-m.dmg,c:"#F08080"});
    burst(px,py+PH/2,"#F08080",6);
    if(hp<=0&&dead<=0){ dead=1.8; hp=0; toast("倒下了"); }
  }
}
function mobsUpdate(dt){
  for(var i=mobs.length-1;i>=0;i--){
    var m=mobs[i];
    if(m.x<-30||m.x>W+30) { mobs.splice(i,1); continue; }
    updateMob(m,dt);
  }
  if(boss) updateMob(boss,dt);
  if(bossKills>=3&&!boss&&isNight()){
    spawnMob("king",px+6,py-2);
    toast("史莱姆王出现了");
    bossKills=0;
  }
}

/* ================= 粒子 / 飘字 ================= */
function burst(x,y,color,n){
  for(var i=0;i<n;i++){
    parts.push({x:x,y:y,vx:(Math.random()-0.5)*4,vy:-Math.random()*4-0.5,
      life:0.5+Math.random()*0.4,c:color,s:2+Math.random()*3});
  }
}

/* ================= 存档 ================= */
var KEY="rtsx.terraria.v2";
function rle(arr,maxRun){
  var parts=[], last=arr[0], n=1, i;
  for(i=1;i<arr.length;i++){
    if(arr[i]===last&&n<maxRun){ n++; }
    else { parts.push(last+":"+n); last=arr[i]; n=1; }
  }
  parts.push(last+":"+n);
  return parts.join(",");
}
function unrle(str,arr){
  var ps=str.split(","), p=0, i, j;
  arr.fill(0);
  for(i=0;i<ps.length;i++){
    var kv=ps[i].split(":"), v=+kv[0], n=+kv[1];
    for(j=0;j<n&&p<arr.length;j++) arr[p++]=v;
  }
}
function save(){
  try{
    localStorage.setItem(KEY,JSON.stringify({
      w:rle(world,60000), wl:rle(wall,60000),
      inv:inv,px:px,py:py,hp:hp,maxHp:maxHp,time:time,spawn:spawn,
      slots:SLOTS,sel:sel,bossKills:bossKills
    }));
  }catch(e){}
}
function load(){
  try{
    var s=localStorage.getItem(KEY);
    if(!s) return false;
    var d=JSON.parse(s);
    if(!d||!d.w) return false;
    unrle(d.w,world); unrle(d.wl,wall);
    for(var x=0;x<W;x++){
      var sy=H-1;
      for(var y=0;y<H;y++){ if(world[y*W+x]!==0){ sy=y; break; } }
      surfaceY[x]=sy;
    }
    torchLights=[];
    for(var k=0;k<world.length;k++) if(world[k]===T.TORCH) torchLights.push([k%W,Math.floor(k/W)]);
    inv=d.inv||inv;
    px=d.px; py=d.py; hp=d.hp; maxHp=d.maxHp||100; time=d.time||0.32;
    spawn=d.spawn||spawn;
    if(d.slots&&d.slots.length) SLOTS=d.slots;
    sel=d.sel||0; bossKills=d.bossKills||0;
    return true;
  }catch(e){ return false; }
}

/* ================= 颜色工具 ================= */
function rgb(a){ return "rgb("+Math.floor(a[0])+","+Math.floor(a[1])+","+Math.floor(a[2])+")"; }
function rgba(a,al){ return "rgba("+Math.floor(a[0])+","+Math.floor(a[1])+","+Math.floor(a[2])+","+al+")"; }
function mix(a,b,t){
  t=Math.max(0,Math.min(1,t));
  return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
}
function hex2rgb(h){
  var v=parseInt(h.slice(1),16);
  return [(v>>16)&255,(v>>8)&255,v&255];
}
function shade(hex,f){
  var c=hex2rgb(hex);
  return rgb([Math.min(255,c[0]*f),Math.min(255,c[1]*f),Math.min(255,c[2]*f)]);
}
var TC={1:"#6B4A2E",2:"#6B4A2E",3:"#5E5C57",4:"#6A4526",5:"#4E7A3A",6:"#B4713D",7:"#8E8880",
  8:"#C9A03A",9:"#A9763F",10:"#FFC46B",11:"#8A5F38",12:"#7A6E68",13:"#5E6066",14:"#D8C079",
  15:"#E8EEF4",16:"#9BD3E6",17:"#63C9BE",18:"#8A6A44",19:"#4A8A52"};
function tileColor(t){ return TC[t]||"#555"; }

/* ================= 相机 / 光 ================= */
var cam={x:0,y:0};
function dayness(){ return Math.max(0,Math.min(1,-Math.cos(time*Math.PI*2)*1.75-0.05)); }
function isNight(){ return time>0.78||time<0.22; }

function drawSky(){
  var d=dayness();
  var top=mix([12,16,30],[122,168,212],d);
  var bot=mix([24,28,40],[206,220,226],d);
  var grd=g.createLinearGradient(0,0,0,view.h);
  grd.addColorStop(0,rgb(top)); grd.addColorStop(0.62,rgb(bot));
  grd.addColorStop(1,rgb(mix(bot,[60,52,44],0.25)));
  g.fillStyle=grd; g.fillRect(0,0,view.w,view.h);
  /* 星星 */
  if(d<0.55){
    g.fillStyle="rgba(255,255,255,"+((0.55-d)*1.4)+")";
    for(var i=0;i<70;i++){
      var sx=(i*137.5)%view.w, sy=((i*89.3)%Math.floor(view.h*0.7));
      g.fillRect(sx,sy,1.4,1.4);
    }
  }
  /* 太阳 / 月亮 */
  var arc=(time+0.25)%1;
  var ax=view.w*arc, ay=view.h*0.62-Math.sin(arc*Math.PI)*view.h*0.5;
  if(d>0.05){ g.fillStyle="rgba(255,226,170,0.95)"; g.beginPath(); g.arc(ax,ay,20,0,6.3); g.fill(); }
  var nk=(time+0.75)%1;
  var mx=view.w*nk, my=view.h*0.62-Math.sin(nk*Math.PI)*view.h*0.5;
  if(d<0.5){ g.fillStyle="rgba(226,232,240,"+((0.5-d)*1.6)+")"; g.beginPath(); g.arc(mx,my,14,0,6.3); g.fill(); }
  /* 云 */
  if(d>0.2){
    g.fillStyle="rgba(255,255,255,"+(0.16*d)+")";
    var off=-(cam.x*TILE*0.2)%view.w;
    for(var c=0;c<7;c++){
      var cxx=((c*view.w/4+off)%(view.w+200))-100;
      var cyy=60+((c*47)%90);
      g.beginPath();
      g.ellipse(cxx,cyy,52,15,0,0,6.3); g.fill();
      g.beginPath();
      g.ellipse(cxx+30,cyy+6,36,12,0,0,6.3); g.fill();
    }
  }
}

function hills(par,base,amp,col){
  g.fillStyle=col;
  g.beginPath();
  g.moveTo(0,view.h);
  for(var x=0;x<=view.w;x+=14){
    var wx=(x+cam.x*TILE*par)*0.018;
    var y=base-Math.sin(wx)*amp-Math.sin(wx*0.47+1.2)*amp*0.55;
    g.lineTo(x,y);
  }
  g.lineTo(view.w,view.h); g.closePath(); g.fill();
}
function drawWorld(){
  var cx0=Math.floor(cam.x)-1, cy0=Math.floor(cam.y)-1;
  var cols=Math.ceil(view.w/TILE)+2, rows=Math.ceil(view.h/TILE)+2;
  var cx1=cx0+cols, cy1=cy0+rows;
  var amb=0.16+0.84*dayness();
  var lights=[];
  for(var li=0;li<torchLights.length;li++){
    var tx=torchLights[li][0], ty=torchLights[li][1];
    if(tx>cx0-9&&tx<cx1+9&&ty>cy0-9&&ty<cy1+9) lights.push([tx,ty]);
  }
  for(var y=cy0;y<cy1;y++) for(var x=cx0;x<cx1;x++){
    var sx=(x-cam.x)*TILE, sy=(y-cam.y)*TILE;
    /* 背景墙 */
    var wl=wallAt(x,y);
    if(wl){
      g.fillStyle=wl===1?"#3B2A1F":"#33312F";
      g.fillRect(sx,sy,TILE,TILE);
      g.fillStyle="rgba(0,0,0,.18)";
      g.fillRect(sx,sy,TILE,1);
      g.fillRect(sx,sy,1,TILE);
    }
    var t=get(x,y);
    if(t===T.AIR) continue;
    /* 光照 */
    var depth=y-surfaceY[x];
    if(depth<0) depth=0;
    var lv=amb*Math.max(0.07,1-depth*0.016);
    for(var k=0;k<lights.length;k++){
      var ldx=x-lights[k][0], ldy=y-lights[k][1];
      var ld=Math.sqrt(ldx*ldx+ldy*ldy);
      if(ld<7.5) lv+=(1-ld/7.5)*(1-ld/7.5)*0.95;
    }
    if(lv>1.35) lv=1.35;
    var f=Math.max(0.16,lv);
    var base=tileColor(t);
    /* 草皮：泥土底色 + 顶部绿 */
    if(t===T.GRASS){
      g.fillStyle=shade("#6B4A2E",f);
      g.fillRect(sx,sy,TILE,TILE);
      var green=solid(x,y-1)?shade("#5B8A3E",f*0.9):shade("#76A94C",f);
      g.fillStyle=green;
      g.fillRect(sx,sy,TILE,6);
    } else if(t===T.TORCH){
      g.fillStyle="rgba(0,0,0,0)"; 
      g.fillStyle=shade("#6A4526",f); g.fillRect(sx+TILE*0.42,sy+TILE*0.35,TILE*0.16,TILE*0.6);
      g.fillStyle="rgba(255,190,90,"+(0.55*f)+")";
      g.beginPath(); g.arc(sx+TILE*0.5,sy+TILE*0.3,TILE*0.26,0,6.3); g.fill();
      g.fillStyle="rgba(255,232,170,"+(0.9*f)+")";
      g.fillRect(sx+TILE*0.42,sy+TILE*0.2,TILE*0.16,TILE*0.14);
    } else if(t===T.CHEST){
      g.fillStyle=shade("#7A5634",f); g.fillRect(sx+2,sy+7,TILE-4,TILE-9);
      g.fillStyle=shade("#9A6E42",f); g.fillRect(sx+2,sy+7,TILE-4,5);
      g.fillStyle=shade("#E8C64B",f); g.fillRect(sx+TILE*0.45,sy+TILE*0.55,4,4);
    } else if(t===T.BENCH){
      g.fillStyle=shade("#8A5F38",f); g.fillRect(sx+1,sy+6,TILE-2,4);
      g.fillRect(sx+3,sy+10,4,TILE-12); g.fillRect(sx+TILE-7,sy+10,4,TILE-12);
    } else if(t===T.FURNACE){
      g.fillStyle=shade("#6E6360",f); g.fillRect(sx+2,sy+4,TILE-4,TILE-6);
      g.fillStyle="rgba(255,140,60,"+(0.25+0.5*Math.random()*0)+")";
      g.fillStyle=shade("#3A2A22",f); g.fillRect(sx+6,sy+10,TILE-12,TILE-14);
      g.fillStyle="rgba(255,150,70,"+(0.35*f)+")"; g.fillRect(sx+7,sy+13,TILE-14,4);
    } else if(t===T.ANVIL){
      g.fillStyle=shade("#5E6066",f); g.fillRect(sx+3,sy+5,TILE-6,6);
      g.fillRect(sx+TILE*0.3,sy+11,TILE*0.4,5); g.fillRect(sx+TILE*0.42,sy+16,5,TILE-18);
    } else if(t===T.LEAF){
      g.fillStyle=shade(base,f*0.92); 
      g.beginPath(); g.arc(sx+TILE/2,sy+TILE/2,TILE*0.46,0,6.3); g.fill();
    } else if(t===T.COPPER||t===T.IRON||t===T.GOLD){
      g.fillStyle=shade("#5E5C57",f); g.fillRect(sx,sy,TILE,TILE);
      g.fillStyle=shade(base,f);
      var seed=(x*7+y*13)%4;
      g.fillRect(sx+3+seed*3,sy+5,6,5);
      g.fillRect(sx+8,sy+13+ (seed%3)*2,7,5);
    } else if(t===T.GEM){
      g.fillStyle=shade("#5E5C57",f); g.fillRect(sx,sy,TILE,TILE);
      g.fillStyle=shade(base,f*1.1);
      g.beginPath(); g.moveTo(sx+TILE/2,sy+4); g.lineTo(sx+TILE-5,sy+TILE/2); g.lineTo(sx+TILE/2,sy+TILE-4); g.lineTo(sx+5,sy+TILE/2); g.closePath(); g.fill();
    } else if(t===T.CACTUS){
      g.fillStyle=shade(base,f); g.fillRect(sx+TILE*0.34,sy,TILE*0.32,TILE);
      g.fillRect(sx+TILE*0.34,sy+TILE*0.3,TILE*0.3,5);
    } else if(t===T.SNOW||t===T.ICE){
      g.fillStyle=shade(base,f); g.fillRect(sx,sy,TILE,TILE);
      g.fillStyle="rgba(255,255,255,"+(0.35*f)+")"; g.fillRect(sx,sy,TILE,2);
    } else {
      var tex=(x*13+y*7)%5;
      g.fillStyle=shade(base,f*(0.86+tex*0.045)); g.fillRect(sx,sy,TILE,TILE);
      g.fillStyle="rgba(0,0,0,.16)";
      g.fillRect(sx,sy+TILE-1,TILE,1); g.fillRect(sx+TILE-1,sy,1,TILE);
      g.fillStyle="rgba(255,255,255,.06)";
      if((x+y)%3===0) g.fillRect(sx+2,sy+2,TILE-4,2);
    }
  }
  /* 挖掘裂痕 */
  if(dig&&dig.p>0.03){
    var dsx=(dig.tx-cam.x)*TILE, dsy=(dig.ty-cam.y)*TILE;
    g.strokeStyle="rgba(0,0,0,.55)"; g.lineWidth=1.6;
    for(var c2=0;c2<5;c2++){
      var a=c2/5*6.3, r2=dig.p*TILE*0.5;
      g.beginPath();
      g.moveTo(dsx+TILE/2,dsy+TILE/2);
      g.lineTo(dsx+TILE/2+Math.cos(a)*r2,dsy+TILE/2+Math.sin(a)*r2);
      g.stroke();
    }
  }
}

/* ================= 角色 ================= */
function drawPlayer(){
  var sx=(px-cam.x)*TILE, sy=(py-cam.y)*TILE;
  var w=PW*TILE, h=PH*TILE;
  var t=walkT;
  var leg=Math.sin(t*9)*(onGround?3:1);
  g.save();
  g.translate(sx+w/2,sy);
  /* 腿 */
  g.fillStyle="#2E4A6B";
  g.fillRect(-w*0.42,h*0.62,w*0.36,h*0.38+leg*0.4);
  g.fillRect(w*0.06,h*0.62,w*0.36,h*0.38-leg*0.4);
  /* 身体 */
  g.fillStyle="#4C7FBF";
  g.fillRect(-w*0.5,h*0.3,w,h*0.36);
  g.fillStyle="#5B93D6";
  g.fillRect(-w*0.5,h*0.3,w,h*0.12);
  /* 头 */
  g.fillStyle="#E8B98C";
  g.fillRect(-w*0.42,h*0.02,w*0.84,h*0.3);
  g.fillStyle="#5A3A24";
  g.fillRect(-w*0.42,h*0.02,w*0.84,h*0.1);
  g.fillStyle="#241A14";
  var eyeDir=facing>0?1:-1;
  g.fillRect(-w*0.2+eyeDir*2,h*0.16,3,3);
  g.fillRect(w*0.1+eyeDir*2,h*0.16,3,3);
  /* 手臂 + 手持物 */
  var ang=0;
  if(swingT>0) ang=(1-swingT/0.3)*1.9*facing-(0.3*facing);
  g.save();
  g.translate(facing>0?w*0.34:-w*0.34,h*0.42);
  g.rotate(ang*0.7);
  g.fillStyle="#E8B98C";
  g.fillRect(0,0,w*0.26,h*0.3);
  /* 手里的东西 */
  var it=SLOTS[sel];
  if(it&&ITEMS[it]){
    if(PICKPOWER[it]){
      g.fillStyle="#8A5F38"; g.fillRect(w*0.08,-h*0.26,w*0.09,h*0.34);
      g.fillStyle="#C9C4BC"; g.fillRect(-w*0.06,-h*0.3,w*0.36,6);
    } else if(SWORDDMG[it]){
      g.fillRect(w*0.04,-h*0.34,w*0.1,h*0.4);
      g.fillStyle=ITEMS[it].c; g.fillRect(-w*0.02,-h*0.4,w*0.28,7);
    } else if(it==="torch"){
      g.fillStyle="#8A5F38"; g.fillRect(w*0.06,-h*0.3,w*0.1,h*0.34);
      g.fillStyle="rgba(255,196,107,.95)"; g.fillRect(w*0.04,-h*0.38,w*0.16,6);
    }
  }
  g.restore();
  g.restore();
  /* 名字标签 */
  g.fillStyle="rgba(246,241,232,.55)"; g.font="10px system-ui"; g.textAlign="center";
  g.fillText(playerName,sx+w/2,sy-6);
  g.textAlign="left";
}

function drawMob(m){
  var sx=(m.x-cam.x)*TILE, sy=(m.y-cam.y)*TILE;
  var w=m.w*TILE, h=m.h*TILE;
  var col=cfgColor(m);
  if(m.type==="bat"){
    g.fillStyle=col;
    g.beginPath(); g.ellipse(sx+w/2,sy+h/2,w*0.28,h*0.5,0,0,6.3); g.fill();
    var flap=Math.sin(m.t*14)*0.5+0.5;
    g.fillStyle="rgba(107,90,120,.85)";
    g.beginPath(); g.ellipse(sx+w*0.1,sy+h/2-h*flap, w*0.5,h*0.3,0,0,6.3); g.fill();
    g.beginPath(); g.ellipse(sx+w*0.9,sy+h/2-h*flap, w*0.5,h*0.3,0,0,6.3); g.fill();
    g.fillStyle="#FF6B6B"; g.fillRect(sx+w*0.38,sy+h*0.4,3,3); g.fillRect(sx+w*0.56,sy+h*0.4,3,3);
    return;
  }
  /* 人形（僵尸/骷髅/向导） */
  if(m.type==="zombie"||m.type==="skeleton"){
    g.fillStyle=col;
    g.fillRect(sx+w*0.2,sy+h*0.35,w*0.6,h*0.42);
    g.fillRect(sx+w*0.18,sy+h*0.75,w*0.26,h*0.25);
    g.fillRect(sx+w*0.56,sy+h*0.75,w*0.26,h*0.25);
    g.fillStyle=m.type==="zombie"?"#7FA06F":"#F0EDE4";
    g.fillRect(sx+w*0.14,sy,h*0.0+w*0.72,h*0.34);
    g.fillStyle="#231A16";
    g.fillRect(sx+w*0.28,sy+h*0.12,3,3);
    g.fillRect(sx+w*0.52,sy+h*0.12,3,3);
    g.fillStyle=col;
    g.fillRect(sx+w*0.02,sy+h*0.38,w*0.2,h*0.3);
    g.fillRect(sx+w*0.78,sy+h*0.38,w*0.2,h*0.3);
    return;
  }
  /* 史莱姆 / 王 */
  var squ=Math.abs(Math.sin(m.t*3.2))*0.12;
  g.fillStyle=col;
  g.beginPath();
  g.ellipse(sx+w/2,sy+h*(0.62-squ*0.2),w*0.52,h*(0.42+squ*0.2),0,0,6.3);
  g.fill();
  g.fillStyle="rgba(255,255,255,.22)";
  g.beginPath(); g.ellipse(sx+w*0.38,sy+h*0.34,w*0.18,h*0.1,0,0,6.3); g.fill();
  g.fillStyle="#221A2A";
  g.fillRect(sx+w*0.34,sy+h*0.5,3,4);
  g.fillRect(sx+w*0.56,sy+h*0.5,3,4);
  if(m.type==="king"){
    g.fillStyle="rgba(255,215,90,.95)";
    g.fillRect(sx+w*0.3,sy+h*0.02,w*0.4,h*0.12);
    g.fillRect(sx+w*0.3,sy,6,h*0.16); g.fillRect(sx+w*0.46,sy-h*0.02,6,h*0.16); g.fillRect(sx+w*0.62,sy,6,h*0.16);
  }
}

/* ================= HUD ================= */
var heartsEl=document.getElementById("hearts");
var clockEl=document.getElementById("clock");
var barEl=document.getElementById("bar");
var toastEl=document.getElementById("toast");
var hintEl=document.getElementById("hint");
var bossEl=document.getElementById("boss");
var bossFg=document.getElementById("bossFg");

function paintHearts(){
  var n=Math.max(5,Math.ceil(maxHp/20));
  var html="";
  for(var i=0;i<n;i++){
    var v=hp-(i*20);
    var cls=v>=20?"":(v>0?"half":"off");
    html+='<div class="h '+(cls||"")+'"></div>';
  }
  heartsEl.innerHTML=html;
}
function paintBar(){
  var html="";
  for(var i=0;i<SLOTS.length;i++){
    var id=SLOTS[i];
    var it=ITEMS[id];
    var cnt=inv[id]||0;
    var show=(PICKPOWER[id]||SWORDDMG[id])?1:(cnt>0?1:0.35);
    html+='<div class="slot'+(i===sel?" sel":"")+'" data-i="'+i+'" style="opacity:'+show+'">'+
      '<div class="ic" style="background:'+(it?it.c:"#444")+'"></div>'+
      (cnt>1?'<span class="n">'+cnt+'</span>':'')+
    '</div>';
  }
  barEl.innerHTML=html;
  Array.prototype.forEach.call(barEl.querySelectorAll(".slot"),function(el){
    el.addEventListener("pointerdown",function(e){
      e.preventDefault();
      sel=+el.getAttribute("data-i");
      placing=false; paintBar(); paintPlaceBtn();
    });
  });
}
function toast(msg){
  toastEl.textContent=msg;
  toastEl.classList.add("on");
  toastT=1.8;
}
function hint(msg,ms){
  hintEl.textContent=msg;
  hintEl.classList.add("on");
  clearTimeout(hintEl._t);
  hintEl._t=setTimeout(function(){ hintEl.classList.remove("on"); },ms||4200);
}
function paintPlaceBtn(){
  var b=document.getElementById("btnPlace");
  b.classList.toggle("on",placing);
  b.textContent=placing?"放中":"放";
}

/* ================= 面板 ================= */
var panel=document.getElementById("panel");
var panelTitle=document.getElementById("panelTitle");
var panelBody=document.getElementById("panelBody");
var panelMode="";
function openPanel(mode){
  panelMode=mode;
  panel.classList.add("on");
  if(mode==="bag"){ panelTitle.textContent="背包 · 点物品换进快捷栏"; renderBag(); }
  else { panelTitle.textContent="合成"; renderCraft(); }
}
function closePanel(){ panel.classList.remove("on"); panelMode=""; }
document.getElementById("panelClose").addEventListener("click",closePanel);

function renderBag(){
  var html='<div class="grid">';
  var any=false;
  for(var id in inv){
    if(!ITEMS[id]||!inv[id]) continue;
    any=true;
    html+='<div class="cell" data-id="'+id+'"><div class="ic" style="background:'+ITEMS[id].c+'"></div>'+
      '<div class="nm">'+ITEMS[id].n+'</div><div class="ct">×'+inv[id]+'</div></div>';
  }
  if(!any) html+='<div class="cell empty"><div class="nm">还没挖到东西</div></div>';
  html+='</div>';
  panelBody.innerHTML=html;
  Array.prototype.forEach.call(panelBody.querySelectorAll(".cell[data-id]"),function(el){
    el.addEventListener("pointerdown",function(e){
      e.preventDefault();
      SLOTS[sel]=el.getAttribute("data-id");
      paintBar(); toast("快捷栏 "+ITEMS[SLOTS[sel]].n); closePanel();
    });

}
function renderCraft(){
  var st=stations();
  var html="";
  for(var i=0;i<RECIPES.length;i++){
    var r=RECIPES[i];
    var ok=has(r.c)&&(!r.s||st[r.s]);
    var cost=[];
    for(var k in r.c) cost.push(ITEMS[k].n+"×"+r.c[k]+"("+(inv[k]||0)+")");
    html+='<div class="rec"><div class="ic" style="background:'+ITEMS[r.o].c+'"></div>'+
      '<div class="info"><div class="nm">'+ITEMS[r.o].n+' ×'+r.n+(r.s?' · '+STATIONNAME[r.s]:'')+'</div>'+
      '<div class="cs">'+cost.join("  ")+'</div></div>'+
      '<button data-i="'+i+'" '+(ok?'':'disabled')+'>'+(r.s&&!st[r.s]?'缺站':'做')+'</button></div>';
  }
  panelBody.innerHTML=html;
  Array.prototype.forEach.call(panelBody.querySelectorAll("button[data-i]"),function(el){
    el.addEventListener("pointerdown",function(e){
      e.preventDefault();
      craft(RECIPES[+el.getAttribute("data-i")]);
      renderCraft();
    });
  });
}

/* ================= 输入 ================= */
var keys={l:0,r:0,j:0};
function bindHold(id,fn){
  var el=document.getElementById(id);
  el.addEventListener("pointerdown",function(e){ e.preventDefault(); fn(1); });
  el.addEventListener("pointerup",function(e){ e.preventDefault(); fn(0); });
  el.addEventListener("pointercancel",function(e){ e.preventDefault(); fn(0); });
  el.addEventListener("pointerleave",function(e){ e.preventDefault(); fn(0); });
}
bindHold("btnL",function(v){ keys.l=v; });
bindHold("btnR",function(v){ keys.r=v; });
bindHold("btnJ",function(v){ keys.j=v; });
document.getElementById("btnPlace").addEventListener("pointerdown",function(e){
  e.preventDefault(); placing=!placing; paintPlaceBtn();
  toast(placing?"放置模式":"挖掘模式");
});
document.getElementById("btnCraft").addEventListener("pointerdown",function(e){
  e.preventDefault(); openPanel("craft");
});
document.getElementById("btnBag").addEventListener("pointerdown",function(e){
  e.preventDefault(); openPanel("bag");
});
window.addEventListener("keydown",function(e){
  var k=e.key;
  if(k==="d"||k==="ArrowRight") keys.r=1;
  else if(k==="a"||k==="ArrowLeft") keys.l=1;
  else if(k==="w"||k===" "||k==="ArrowUp") keys.j=1;
  else if(k==="e"||k==="E"){ openPanel("bag"); }
  else if(k==="c"||k==="C"){ openPanel("craft"); }
  else if(k==="f"||k==="F"){ placing=!placing; paintPlaceBtn(); }
  else if(k>="1"&&k<="8"){ sel=+k-1; paintBar(); }
  if(k===" "||k==="ArrowUp"||k==="ArrowDown") e.preventDefault();
});
window.addEventListener("keyup",function(e){
  var k=e.key;
  if(k==="d"||k==="ArrowRight") keys.r=0;
  else if(k==="a"||k==="ArrowLeft") keys.l=0;
  else if(k==="w"||k===" "||k==="ArrowUp") keys.j=0;
});

function tileFromEvent(e){
  var wx=cam.x+e.clientX/TILE, wy=cam.y+e.clientY/TILE;
  return [Math.floor(wx),Math.floor(wy)];
}
canvas.addEventListener("pointerdown",function(e){
  e.preventDefault();
  if(panelMode){ closePanel(); return; }
  var tp=tileFromEvent(e);
  if(SWORDDMG[SLOTS[sel]]&&!placing){ attack(); return; }
  if(placing){ placeAt(tp[0],tp[1]); return; }
  hold=[tp[0],tp[1]]; dig={tx:tp[0],ty:tp[1],p:0};
});
canvas.addEventListener("pointermove",function(e){
  if(!hold) return;
  var tp=tileFromEvent(e);
  hold=[tp[0],tp[1]];
});
function endHold(){ hold=null; dig=null; }
canvas.addEventListener("pointerup",endHold);
canvas.addEventListener("pointercancel",endHold);
canvas.addEventListener("pointerleave",endHold);
canvas.addEventListener("contextmenu",function(e){ e.preventDefault(); });

/* ================= 帧 ================= */
var frameN=0, spawnT=0, lastT=0, acc=0;
function step(dt){
  time=(time+dt/dayLen)%1;
  if(dead>0){
    dead-=dt;
    if(dead<=0){ hp=maxHp; px=spawn.x; py=spawn.y; invul=1.5; }
  } else {
    /* 移动 */
    var dir=(keys.r?1:0)-(keys.l?1:0);
    if(dir){ facing=dir; vx=dir*SPEED; walkT+=dt; }
    else { vx=0; walkT+=dt*0.4; }
    if(keys.j&&onGround){ vy=JUMPV; onGround=false; }
    vy+=GRAV*dt;
    if(vy>MAXY) vy=MAXY;
    collideMove(px+vx*dt,py+vy*dt);
    if(invul>0) invul-=dt;
    /* 挖掘 */
    if(hold) mineAt(hold[0],hold[1],dt);
    /* 挥砍 */
    if(swingT>0){
      swingT-=dt;
      if(swingT<=0.16&&!hitDone){ hitDone=true; hitFront(); }
    }
    if(invul>0) invul-=dt;
    /* 掉出世界 */
    if(py>H-3){ hp-=20; if(hp<=0){ dead=1.8; hp=0; } else { px=spawn.x; py=spawn.y; invul=1.2; } }
  }
  if(shake>0) shake=Math.max(0,shake-dt*14);

  /* 刷怪 */
  spawnT-=dt;
  if(spawnT<=0){
    spawnT=1.6;
    var depth=Math.floor(py)-surfaceY[Math.max(0,Math.min(W-1,Math.floor(px)))];
    if(mobs.length<7){
      if(depth>16&&Math.random()<0.75){
        var bx=px+(Math.random()<0.5?-1:1)*(8+Math.random()*10);
        spawnMob(Math.random()<0.5?"bat":"skeleton",bx,py+(Math.random()*6-3));
      } else if(depth<10&&isNight()){
        var side=Math.random()<0.5?-1:1;
        var sx2=px+side*(12+Math.random()*10);
        var sy2=surfaceY[Math.max(0,Math.min(W-1,Math.floor(sx2)))]-2;
        spawnMob(Math.random()<0.62?"slime":"zombie",sx2,sy2);
      }
    }
    /* 白天把远处怪清掉 */
    if(!isNight()&&depth<10){
      for(var mi=mobs.length-1;mi>=0;mi--){
        if(Math.abs(mobs[mi].x-px)>26&&mobs[mi].type!=="bat") mobs.splice(mi,1);
      }
    }
  }
  mobsUpdate(dt);

  /* 粒子与飘字 */
  for(var i=parts.length-1;i>=0;i--){
    var p=parts[i];
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=GRAV*dt*0.5; p.life-=dt;
    if(p.life<=0) parts.splice(i,1);
  }
  for(var j=nums.length-1;j>=0;j--){
    var nm=nums[j]; nm.t-=dt; nm.y-=dt*1.2;
    if(nm.t<=0) nums.splice(j,1);
  }
  if(toastT>0){ toastT-=dt; if(toastT<=0) toastEl.classList.remove("on"); }
  /* 相机 */
  var tx2=px-view.w/(2*TILE), ty2=py-view.h/(2*TILE);
  tx2=Math.max(0,Math.min(W-view.w/TILE,tx2));
  ty2=Math.max(0,Math.min(H-view.h/TILE,ty2));
  cam.x+=(tx2-cam.x)*Math.min(1,dt*8);
  cam.y+=(ty2-cam.y)*Math.min(1,dt*8);

  frameN++;
  if(frameN%150===0) save();
  if(frameN%10===0){
    paintHearts();
    var hh=(6+time*24)%24, mm=Math.floor((hh%1)*60);
    clockEl.textContent=(isNight()?"夜里 ":"白天 ")+("0"+Math.floor(hh)).slice(-2)+":"+("0"+mm).slice(-2);
    if(boss){
      bossEl.style.display="block";
      bossFg.style.width=Math.max(0,boss.hp/boss.max*100)+"%";
    } else bossEl.style.display="none";
  }
}

function drawFrame(){
  g.save();
  if(shake>0){ g.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake); }
  drawSky();
  var d=dayness();
  var horizon=((surfaceY[Math.max(0,Math.min(W-1,Math.round(cam.x+view.w/TILE/2)))]-cam.y)*TILE)-6;
  hills(0.25,horizon-18,26,rgba(mix([26,34,44],[132,152,152],d),0.7));
  hills(0.55,horizon+6,34,rgba(mix([20,26,32],[92,116,108],d),0.8));
  drawWorld();
  for(var i=0;i<mobs.length;i++) drawMob(mobs[i]);
  if(boss) drawMob(boss);
  if(dead<=0){
    if(invul>0&&Math.floor(invul*10)%2===0){ /* 闪烁 */ } else drawPlayer();
  }
  /* 粒子 */
  for(var p2=0;p2<parts.length;p2++){
    var pp=parts[p2];
    g.fillStyle=pp.c; g.globalAlpha=Math.max(0,Math.min(1,pp.life*1.6));
    g.fillRect((pp.x-cam.x)*TILE,(pp.y-cam.y)*TILE,pp.s,pp.s);
  }
  g.globalAlpha=1;
  /* 飘字 */
  g.font="bold 12px system-ui"; g.textAlign="center";
  for(var n2=0;n2<nums.length;n2++){
    var nn=nums[n2];
    g.fillStyle="rgba(0,0,0,.55)"; g.fillText(nn.v,(nn.x-cam.x)*TILE+1,(nn.y-cam.y)*TILE+1);
    g.fillStyle=nn.c; g.fillText(nn.v,(nn.x-cam.x)*TILE,(nn.y-cam.y)*TILE);
  }
  g.textAlign="left";
  if(dead>0){
    g.fillStyle="rgba(10,8,8,.7)"; g.fillRect(0,0,view.w,view.h);
    g.fillStyle="#E2916F"; g.font="600 16px Georgia,serif"; g.textAlign="center";
    g.fillText("倒下 · 正在出生点复活",view.w/2,view.h/2);
    g.textAlign="left";
  }
  g.restore();
}

/* ================= 启动 ================= */
function boot(){
  genWorld();
  var cx=Math.floor(W*0.5);
  spawn.x=cx+0.5; spawn.y=surfaceY[cx]-PH-0.05;
  px=spawn.x; py=spawn.y;
  cam.x=Math.max(0,Math.min(W-view.w/TILE,px-view.w/(2*TILE)));
  cam.y=Math.max(0,Math.min(H-view.h/TILE,py-view.h/(2*TILE)));
  if(!load()){ paintBar(); }
  for(var i=0;i<16&&bodySolid(px,py);i++) py-=1;
  paintBar(); paintHearts(); paintPlaceBtn();
  /* 名字与开场 */
  try{
    var savedName=localStorage.getItem("rtsx.terraria.name");
    if(savedName){ playerName=savedName; }
  }catch(e){}
  var intro=document.getElementById("intro");
  var nameInput=document.getElementById("pname");
  if(intro){
    try{
      if(localStorage.getItem(KEY)){
        var gb=document.getElementById("go");
        if(gb) gb.textContent="继续世界";
        var tipEl=intro.querySelector?intro.querySelector(".sub"):null;
        if(tipEl) tipEl.textContent="上次的世界还在 · 挖到哪了接着挖";
      }
    }catch(e){}
    if(playerName&&playerName!=="67 探险者"){ intro.style.display="none"; }
    nameInput.value=playerName==="67 探险者"?"":playerName;
    document.getElementById("go").addEventListener("click",function(){
      var v=(nameInput.value||"").trim().slice(0,8);
      if(v) playerName=v;
      try{ localStorage.setItem("rtsx.terraria.name",playerName); }catch(e){}
      intro.style.display="none";

    });
  }
  if(intro&&intro.style.display!=="none"){ /* 等点“进入世界”再提示 */ } else { hint("先按住屏幕挖几块泥土和木头，砍树拿木头，合成木镐再往深处挖",5000); }
  save();
}

  requestAnimationFrame(loop);
  if(!lastT) lastT=ts||0;
  var dt=Math.min(0.05,((ts||0)-lastT)/1000);
