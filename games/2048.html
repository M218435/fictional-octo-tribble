<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" href="../icon.png">
<link rel="apple-touch-icon" href="../icon.png">

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2048 · RTSX</title>
<style>
  :root{
    --bg:#F4F1EA; --ink:#191817; --ink-2:#5F5B53; --ink-3:#938E85;
    --line:#E4E0D7; --brand:#D97757; --btn:#2A2724; --board:#EDE7DC;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;min-height:100dvh;
    padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom));
    overflow:auto;
    touch-action:manipulation;
  }
  .app{width:min(420px,94vw,64dvh);display:flex;flex-direction:column;gap:12px;position:relative;}
  .top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .lead{display:flex;align-items:center;gap:10px;}
  .back{
    border:0;background:none;font:inherit;font-size:12px;color:var(--ink-3);
    cursor:pointer;padding:4px 0;letter-spacing:.02em;
  }
  .back:hover{color:var(--ink-2);}
  .snd{
    border:1px solid var(--line);background:#fff;border-radius:8px;
    padding:3px 7px;font:inherit;font-size:10px;letter-spacing:.12em;
    color:var(--ink-3);cursor:pointer;
  }
  .snd.off{opacity:.5;text-decoration:line-through;}
  @media (max-height:600px){
    body{padding:8px;}
    .app{gap:8px;}
    .hint{display:none;}
  }
  .scores{display:flex;gap:8px;}
  .scorebox{
    min-width:74px;padding:6px 12px;border-radius:10px;
    background:#fff;border:1px solid var(--line);text-align:center;
  }
  .scorebox label{display:block;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);}
  .scorebox b{display:block;font-size:17px;font-weight:600;color:var(--ink);line-height:1.3;font-variant-numeric:tabular-nums;}
  .hint{margin:0;font-size:11.5px;color:var(--ink-3);letter-spacing:.02em;text-align:center;}

  .board{
    position:relative;
    width:100%;aspect-ratio:1/1;
    background:var(--board);
    border-radius:14px;
    padding:10px;
    display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);
    gap:10px;
    touch-action:none;
    user-select:none;
  }
  .cell{background:rgba(255,255,255,.5);border-radius:8px;position:relative;}
  .t{
    position:absolute;inset:0;border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:26px;letter-spacing:-.02em;
    color:#4A4238;
    font-variant-numeric:tabular-nums;
  }
  .t.s1{font-size:20px;}
  .t.s2{font-size:16px;}
  .t.pop{animation:pop .16s ease-out;}
  @keyframes pop{from{transform:scale(.72);opacity:.4;}to{transform:scale(1);opacity:1;}}

  .v2{background:#F3EADA;color:#6B6257;}
  .v4{background:#ECDCC5;color:#6B6257;}
  .v8{background:#E7B98E;color:#fff;}
  .v16{background:#E09A6B;color:#fff;}
  .v32{background:#D97A52;color:#fff;}
  .v64{background:#C8603D;color:#fff;}
  .v128{background:#B4533A;color:#fff;}
  .v256{background:#9C4632;color:#fff;}
  .v512{background:#84392A;color:#fff;}
  .v1024{background:#6B2D22;color:#fff;}
  .v2048{background:#52231A;color:#fff;box-shadow:0 0 0 2px rgba(217,119,87,.55) inset;}
  .vbig{background:#3D1A13;color:#fff;}

  .bottom{display:flex;justify-content:center;margin-top:2px;}
  /* 手机：居中的摇杆，往哪推就朝哪合并一步 */
  .stick{
    display:none;position:relative;width:132px;height:132px;margin:2px auto 0;
    border-radius:50%;touch-action:none;
    background:radial-gradient(circle at 50% 42%,#fff 0%,#f3efe7 68%,#e8e3d9 100%);
    border:1px solid var(--line);
    box-shadow:0 14px 30px -22px rgba(25,24,23,.55),inset 0 1px 0 #fff;
  }
  .stick::after{
    content:"";position:absolute;left:50%;top:50%;width:86px;height:86px;margin:-43px 0 0 -43px;
    border-radius:50%;border:1px dashed rgba(147,142,133,.28);pointer-events:none;
  }
  .stick .knob{
    position:absolute;left:50%;top:50%;width:56px;height:56px;border-radius:50%;
    background:linear-gradient(180deg,#e2875f,#cf7046);
    box-shadow:0 10px 20px -8px rgba(160,88,52,.75),inset 0 1px 0 rgba(255,255,255,.45);
    transform:translate(-50%,-50%);pointer-events:none;
  }
  @media (pointer:coarse),(max-width:640px){
    .stick{display:block;}
    .hint{display:none;}
  }
  .btn{
    height:40px;padding:0 22px;border:0;border-radius:10px;
    background:var(--btn);color:#fff;font:inherit;font-size:13.5px;font-weight:500;
    cursor:pointer;transition:transform .15s ease, background .15s ease;
  }
  .btn:hover{background:#000;transform:translateY(-1px);}
  .btn:active{transform:none;}

  .overlay{
    position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(244,241,234,.9);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
    padding:24px;z-index:5;
  }
  .overlay.show{display:flex;animation:fade .25s ease both;}
  @keyframes fade{from{opacity:0;}to{opacity:1;}}
  .panel{
    width:100%;max-width:300px;background:#fff;border:1px solid var(--line);border-radius:14px;
    padding:26px 22px 22px;text-align:center;
    box-shadow:0 20px 50px -24px rgba(25,24,23,.35);
  }
  .panel h2{margin:0 0 8px;font-size:19px;font-weight:600;font-family:Georgia,"Songti SC",serif;}
  .panel p{margin:0 0 18px;font-size:13px;color:var(--ink-2);line-height:1.6;}
  .panel .row{display:flex;gap:8px;justify-content:center;}
  .panel .ghost{
    height:40px;padding:0 18px;border-radius:10px;border:1px solid var(--line);
    background:#fff;color:var(--ink-2);font:inherit;font-size:13.5px;cursor:pointer;
  }
  .panel .ghost:hover{background:var(--bg);}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="top">
    <div class="lead">
      <button class="back" id="back" type="button">← 返回</button>
      <button class="snd" id="snd" type="button">SFX</button>
    </div>
    <div class="scores">
      <div class="scorebox"><label>分数</label><b id="score">0</b></div>
      <div class="scorebox"><label>最佳</label><b id="best">0</b></div>
    </div>
  </div>
  <p class="hint">方向键 / WASD / 滑动</p>
  <div class="board" id="board"></div>
  <div class="stick" id="stick"><div class="knob" id="knob"></div></div>
  <div class="bottom"><button class="btn" id="restart" type="button">重新开始</button></div>
</div>

<div class="overlay" id="overlay">
  <div class="panel">
    <h2 id="ov-title">—</h2>
    <p id="ov-text"></p>
    <div class="row">
      <button class="ghost" id="ov-continue" type="button" style="display:none">继续玩</button>
      <button class="btn" id="ov-restart" type="button">再来一局</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ---------- 音效：WebAudio 合成，零外部文件 ---------- */
  var SFX = (function(){
    var ctx = null, on = true, out = null;
    try { on = localStorage.getItem("rtsx.sound.v1") !== "off"; } catch(e) {}
    function ac(){
      if (!ctx) {
        var C = window.AudioContext || window.webkitAudioContext;
        if (!C) return null;
        try { ctx = new C(); } catch(e) { return null; }
      }
      if (ctx.state === "suspended") { try { ctx.resume(); } catch(e) {} }
      if (!out) {
        out = ctx.createDynamicsCompressor();      // 限制器：音量拉满也不炸耳朵
        out.threshold.value = -2;
        out.knee.value = 20;
        out.ratio.value = 12;
        out.attack.value = 0.004;
        out.release.value = 0.2;
        out.connect(ctx.destination);
      }
      return ctx;
    }
    function tone(f, dur, type, gain, delay, to){
      if (!on) return;
      var c = ac(); if (!c) return;
      var t0 = c.currentTime + (delay || 0);
      var o = c.createOscillator(), g = c.createGain();
      o.type = type || "sine";
      o.frequency.setValueAtTime(f, t0);
      if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(Math.min(0.99, (gain || 0.05) * 14), t0 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(out || c.destination);
      o.start(t0); o.stop(t0 + dur + 0.03);
    }
    var api = {
      click: function(){ tone(520, 0.055, "triangle", 0.045); },
      move:  function(){ tone(300, 0.05, "sine", 0.025, 0, 380); },
      pop:   function(n){ var f = 600 + Math.min(6, (n || 0)) * 95; tone(f, 0.1, "sine", 0.05, 0, f + 260); },
      hit:   function(){ tone(190, 0.1, "square", 0.04, 0, 130); },
      lose:  function(){ tone(260, 0.26, "sawtooth", 0.04, 0, 90); },
      win:   function(){ tone(660, 0.1, "sine", 0.05); tone(880, 0.12, "sine", 0.05, 0.1); tone(1240, 0.16, "sine", 0.045, 0.2); },
      isOn:  function(){ return on; },
      set:   function(v){ on = v; try { localStorage.setItem("rtsx.sound.v1", v ? "on" : "off"); } catch(e) {} }
    };
    window.addEventListener("storage", function(e){ if (e.key === "rtsx.sound.v1") on = e.newValue !== "off"; });
    return api;
  })();

  var sndBtn = document.getElementById("snd");
  function paintSnd(){ if (sndBtn) sndBtn.classList.toggle("off", !SFX.isOn()); }
  paintSnd();
  if (sndBtn) sndBtn.addEventListener("click", function(){
    SFX.set(!SFX.isOn()); paintSnd(); if (SFX.isOn()) SFX.click();
  });
  window.addEventListener("storage", paintSnd);

  var N = 4, BEST_KEY = "rtsx.2048.best";
  var cells = [], score = 0, best = 0, over = false, won = false, newIdx = -1;

  var boardEl = document.getElementById("board");
  var scoreEl = document.getElementById("score");
  var bestEl  = document.getElementById("best");
  var overlay = document.getElementById("overlay");

  for (var i = 0; i < N * N; i++) {
    var d = document.createElement("div");
    d.className = "cell";
    d.appendChild(document.createElement("div"));
    boardEl.appendChild(d);
  }

  function readBest(){ try{ return parseInt(localStorage.getItem(BEST_KEY) || "0", 10) || 0; }catch(e){ return 0; } }
  function writeBest(v){ try{ localStorage.setItem(BEST_KEY, String(v)); }catch(e){} }
  best = readBest();

  function idx(r, c){ return r * N + c; }

  function reset(){
    cells = [];
    for (var i = 0; i < N * N; i++) cells.push(0);
    score = 0; over = false; won = false; newIdx = -1;
    hideOverlay();
    addTile(); addTile();
    paint();
  }

  function emptyCells(){
    var list = [];
    for (var i = 0; i < cells.length; i++) if (!cells[i]) list.push(i);
    return list;
  }

  function addTile(){
    var empty = emptyCells();
    if (!empty.length) return;
    var pos = empty[Math.floor(Math.random() * empty.length)];
    cells[pos] = Math.random() < 0.9 ? 2 : 4;
    newIdx = pos;
  }

  function paint(){
    for (var i = 0; i < cells.length; i++) {
      var v = cells[i];
      var holder = boardEl.children[i];
      var t = holder.firstChild;
      if (!v) { t.className = ""; t.textContent = ""; continue; }
      var big = v >= 1024 ? " s2" : (v >= 100 ? " s1" : "");
      var cls = "t" + big + (v <= 2048 ? " v" + v : " vbig");
      if (i === newIdx) cls += " pop";
      t.className = cls;
      t.textContent = v;
    }
    newIdx = -1;
    scoreEl.textContent = score;
    bestEl.textContent = best;
  }

  function slideLine(line){
    var vals = [], gained = 0, i;
    for (i = 0; i < line.length; i++) if (line[i]) vals.push(line[i]);
    var out = [];
    for (i = 0; i < vals.length; i++) {
      if (i + 1 < vals.length && vals[i] === vals[i + 1]) {
        out.push(vals[i] * 2); gained += vals[i] * 2; i++;
      } else out.push(vals[i]);
    }
    while (out.length < N) out.push(0);
    return { line: out, gained: gained };
  }

  function same(a, b){
    for (var i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
    return true;
  }

  function coord(dir, k, j){
    if (dir === 0) return [k, j];              // 左
    if (dir === 1) return [k, N - 1 - j];      // 右
    if (dir === 2) return [j, k];              // 上
    return [N - 1 - j, k];                     // 下
  }

  function move(dir){
    if (over) return;
    var moved = false, gained = 0, k, j;
    for (k = 0; k < N; k++) {
      var line = [], positions = [];
      for (j = 0; j < N; j++) {
        var p = coord(dir, k, j);
        line.push(cells[idx(p[0], p[1])]);
        positions.push(p);
      }
      var res = slideLine(line);
      gained += res.gained;
      if (!same(line, res.line)) moved = true;
      for (j = 0; j < N; j++) cells[idx(positions[j][0], positions[j][1])] = res.line[j];
    }
    if (!moved) return;

    score += gained;
    if (score > best) { best = score; writeBest(best); }
    addTile();
    paint();

    if (gained) SFX.pop(Math.round(Math.log(gained) / Math.log(2))); else SFX.move();

    if (!won && cells.indexOf(2048) !== -1) { won = true; SFX.win(); showOverlay("达成 2048", "你已经拼出了 2048 方块。", true); return; }
    if (dead()) { over = true; SFX.lose(); showOverlay("这局结束了", "没有可以移动的方块了，分数 " + score + "。", false); }
  }

  function dead(){
    var i, r, c;
    for (i = 0; i < cells.length; i++) if (!cells[i]) return false;
    for (r = 0; r < N; r++) for (c = 0; c < N; c++) {
      var v = cells[idx(r, c)];
      if (c + 1 < N && v === cells[idx(r, c + 1)]) return false;
      if (r + 1 < N && v === cells[idx(r + 1, c)]) return false;
    }
    return true;
  }

  function showOverlay(title, text, canContinue){
    document.getElementById("ov-title").textContent = title;
    document.getElementById("ov-text").textContent = text;
    document.getElementById("ov-continue").style.display = canContinue ? "" : "none";
    overlay.classList.add("show");
  }
  function hideOverlay(){ overlay.classList.remove("show"); }

  /* ---------- 输入 ---------- */
  var KEYS = {
    ArrowLeft: 0, ArrowUp: 2, ArrowRight: 1, ArrowDown: 3,
    a: 0, w: 2, d: 1, s: 3, A: 0, W: 2, D: 1, S: 3
  };
  document.addEventListener("keydown", function(e){
    var dir = KEYS[e.key];
    if (dir === undefined) return;
    e.preventDefault();
    move(dir);
  });

  var sx = 0, sy = 0, tracking = false;
  var app = document.getElementById("app");
  app.addEventListener("touchstart", function(e){
    if (e.touches.length !== 1) return;
    if (e.target && e.target.closest && e.target.closest(".stick")) { tracking = false; return; }  // 摇杆上的拖动不算滑动
    tracking = true; sx = e.touches[0].clientX; sy = e.touches[0].clientY;
  }, { passive: true });
  app.addEventListener("touchmove", function(e){ if (tracking) e.preventDefault(); }, { passive: false });
  app.addEventListener("touchend", function(e){
    if (!tracking) return;
    tracking = false;
    var t = e.changedTouches[0];
    var dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 28) return;
    if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 1 : 0);
    else move(dy > 0 ? 3 : 2);
  });

  /* 触屏摇杆：居中在棋盘下方，往哪推就合并一步；回中后可以再推一次 */
  function mountStick(handler){
    var base = document.getElementById("stick"), knob = document.getElementById("knob");
    if (!base || !knob) return;
    var R = 40, pid = null;
    function place(cx, cy){
      var r = base.getBoundingClientRect();
      var x = cx - (r.left + r.width / 2), y = cy - (r.top + r.height / 2);
      var len = Math.sqrt(x * x + y * y);
      if (len > R) { x = x * R / len; y = y * R / len; }
      knob.style.transform = "translate(calc(-50% + " + x.toFixed(1) + "px),calc(-50% + " + y.toFixed(1) + "px))";
      handler(x / R, y / R);
    }
    function down(e){
      if (pid !== null) return;
      pid = e.pointerId;
      R = Math.max(26, base.clientWidth / 2 - 30);
      try { base.setPointerCapture(pid); } catch (err) {}
      place(e.clientX, e.clientY);
      e.preventDefault();
    }
    function move_(e){ if (pid === null || e.pointerId !== pid) return; place(e.clientX, e.clientY); e.preventDefault(); }
    function up(e){
      if (pid === null || e.pointerId !== pid) return;
      pid = null;
      knob.style.transform = "translate(-50%,-50%)";
      handler(0, 0);
    }
    base.addEventListener("pointerdown", down);
    base.addEventListener("pointermove", move_);
    base.addEventListener("pointerup", up);
    base.addEventListener("pointercancel", up);
    base.addEventListener("lostpointercapture", up);
  }
  var armed = true;
  mountStick(function(dx, dy){
    var big = Math.max(Math.abs(dx), Math.abs(dy));
    if (big < 0.18) { armed = true; return; }
    if (!armed || big < 0.5) return;
    armed = false;
    if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 1 : 0);
    else move(dy > 0 ? 3 : 2);
  });

  /* ---------- 按钮 ---------- */
  document.getElementById("restart").addEventListener("click", function(){ SFX.click(); reset(); });
  document.getElementById("ov-restart").addEventListener("click", function(){ SFX.click(); reset(); });
  document.getElementById("ov-continue").addEventListener("click", function(){
    SFX.click();
    hideOverlay();
    if (dead()) { over = true; showOverlay("这局结束了", "没有可以移动的方块了，分数 " + score + "。", false); }
  });
  document.getElementById("back").addEventListener("click", function(){
    if (window.parent !== window) window.parent.postMessage("rtsx-close", "*");
    else location.href = "../index.html";
  });

  reset();
})();
</script>
</body>
</html>
