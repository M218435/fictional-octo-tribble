<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>记忆翻牌 · RTSX</title>
<style>
  :root{
    --bg:#F4F1EA; --ink:#191817; --ink-2:#5F5B53; --ink-3:#938E85;
    --line:#E4E0D7; --brand:#D97757; --btn:#2A2724;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;min-height:100dvh;
    padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom));
    overflow:auto;
    touch-action:manipulation;
  }
  .app{width:min(420px,94vw,66dvh);display:flex;flex-direction:column;gap:14px;}
  .top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .lead{display:flex;align-items:center;gap:10px;}
  .back{border:0;background:none;font:inherit;font-size:12px;color:var(--ink-3);cursor:pointer;padding:4px 0;}
  .back:hover{color:var(--ink-2);}
  .snd{
    border:1px solid var(--line);background:#fff;border-radius:8px;
    padding:3px 7px;font:inherit;font-size:10px;letter-spacing:.12em;
    color:var(--ink-3);cursor:pointer;
  }
  .snd.off{opacity:.5;text-decoration:line-through;}
  @media (max-height:600px){
    body{padding:8px;}
    .app{gap:9px;}
    .hint{display:none;}
  }
  .scores{display:flex;gap:8px;}
  .scorebox{min-width:70px;padding:6px 12px;border-radius:10px;background:#fff;border:1px solid var(--line);text-align:center;}
  .scorebox label{display:block;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);}
  .scorebox b{display:block;font-size:16px;font-weight:600;line-height:1.3;font-variant-numeric:tabular-nums;}

  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .card{
    position:relative;aspect-ratio:1/1;padding:0;border:0;background:none;
    cursor:pointer;perspective:900px;
  }
  .inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .42s cubic-bezier(.3,.8,.4,1);}
  .card.flip .inner{transform:rotateY(180deg);}
  .face{
    position:absolute;inset:0;border-radius:11px;
    display:flex;align-items:center;justify-content:center;
    -webkit-backface-visibility:hidden;backface-visibility:hidden;
    background:#fff;border:1px solid var(--line);
    box-shadow:0 1px 2px rgba(25,24,23,.05);
  }
  .back-face::after{
    content:"✦";font-size:19px;color:rgba(217,119,87,.45);
  }
  .front-face{
    transform:rotateY(180deg);
    font-size:27px;color:var(--brand);
  }
  .card.matched .front-face{
    background:#FBF5F0;border-color:#E9DED2;color:#B98A72;
  }
  .card.matched{cursor:default;}
  .card.wrong .front-face{animation:wrong .32s ease;}
  @keyframes wrong{0%,100%{transform:rotateY(180deg) translateX(0);}25%{transform:rotateY(180deg) translateX(-4px);}75%{transform:rotateY(180deg) translateX(4px);}}

  .hint{margin:0;font-size:11.5px;color:var(--ink-3);text-align:center;}
  .bottom{display:flex;justify-content:center;}
  .btn{
    height:40px;padding:0 22px;border:0;border-radius:10px;background:var(--btn);color:#fff;
    font:inherit;font-size:13.5px;font-weight:500;cursor:pointer;
  }
  .btn:hover{background:#000;}

  .overlay{
    position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(244,241,234,.9);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);padding:24px;z-index:5;
  }
  .overlay.show{display:flex;animation:fade .25s ease both;}
  @keyframes fade{from{opacity:0;}to{opacity:1;}}
  .panel{
    width:100%;max-width:300px;background:#fff;border:1px solid var(--line);border-radius:14px;
    padding:26px 22px 22px;text-align:center;box-shadow:0 20px 50px -24px rgba(25,24,23,.35);
  }
  .panel h2{margin:0 0 8px;font-size:19px;font-weight:600;font-family:Georgia,"Songti SC",serif;}
  .panel p{margin:0 0 18px;font-size:13px;color:var(--ink-2);line-height:1.6;}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="lead">
      <button class="back" id="back" type="button">← 返回</button>
      <button class="snd" id="snd" type="button">SFX</button>
    </div>
    <div class="scores">
      <div class="scorebox"><label>步数</label><b id="moves">0</b></div>
      <div class="scorebox"><label>用时</label><b id="time">0:00</b></div>
    </div>
  </div>
  <div class="grid" id="grid"></div>
  <p class="hint">翻开两张相同的图案即配对成功</p>
  <div class="bottom"><button class="btn" id="restart" type="button">重新开始</button></div>
</div>

<div class="overlay" id="overlay">
  <div class="panel">
    <h2>全部配对</h2>
    <p id="ov-text"></p>
    <button class="btn" id="ov-btn" type="button">再来一局</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ---------- 音效：WebAudio 合成，零外部文件 ---------- */
  var SFX = (function(){
    var ctx = null, on = true, out = null;
    try { on = localStorage.getItem("rtsx.sound.v1") !== "off"; } catch(e) {}
    function ac(){
      if (!ctx) {
        var C = window.AudioContext || window.webkitAudioContext;
        if (!C) return null;
        try { ctx = new C(); } catch(e) { return null; }
      }
      if (ctx.state === "suspended") { try { ctx.resume(); } catch(e) {} }
      if (!out) {
        out = ctx.createDynamicsCompressor();      // 限制器：音量拉满也不炸耳朵
        out.threshold.value = -2;
        out.knee.value = 20;
        out.ratio.value = 12;
        out.attack.value = 0.004;
        out.release.value = 0.2;
        out.connect(ctx.destination);
      }
      return ctx;
    }
    function tone(f, dur, type, gain, delay, to){
      if (!on) return;
      var c = ac(); if (!c) return;
      var t0 = c.currentTime + (delay || 0);
      var o = c.createOscillator(), g = c.createGain();
      o.type = type || "sine";
      o.frequency.setValueAtTime(f, t0);
      if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(Math.min(0.99, (gain || 0.05) * 14), t0 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(out || c.destination);
      o.start(t0); o.stop(t0 + dur + 0.03);
    }
    var api = {
      click: function(){ tone(540, 0.06, "triangle", 0.045, 0, 620); },
      pop:   function(){ tone(880, 0.11, "sine", 0.055, 0, 1180); tone(1180, 0.07, "sine", 0.03, 0.09); },
      hit:   function(){ tone(220, 0.12, "square", 0.035, 0, 150); },
      lose:  function(){ tone(260, 0.26, "sawtooth", 0.04, 0, 90); },
      win:   function(){ tone(660, 0.1, "sine", 0.05); tone(880, 0.12, "sine", 0.05, 0.1); tone(1240, 0.16, "sine", 0.045, 0.2); },
      isOn:  function(){ return on; },
      set:   function(v){ on = v; try { localStorage.setItem("rtsx.sound.v1", v ? "on" : "off"); } catch(e) {} }
    };
    window.addEventListener("storage", function(e){ if (e.key === "rtsx.sound.v1") on = e.newValue !== "off"; });
    return api;
  })();

  var sndBtn = document.getElementById("snd");
  function paintSnd(){ if (sndBtn) sndBtn.classList.toggle("off", !SFX.isOn()); }
  paintSnd();
  if (sndBtn) sndBtn.addEventListener("click", function(){
    SFX.set(!SFX.isOn()); paintSnd(); if (SFX.isOn()) SFX.click();
  });
  window.addEventListener("storage", paintSnd);

  var SYMS = ["◆", "●", "▲", "■", "✦", "✚", "❍", "✳"];
  var grid = document.getElementById("grid");
  var movesEl = document.getElementById("moves"), timeEl = document.getElementById("time");
  var overlay = document.getElementById("overlay");

  var deck, flipped, lock, moves, matched, timerId, startedAt, clockId;

  function shuffle(a){
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function reset(){
    clearInterval(clockId);
    clockId = null; startedAt = 0;
    moves = 0; matched = 0; flipped = []; lock = false;
    movesEl.textContent = "0";
    timeEl.textContent = "0:00";

    var pool = SYMS.concat(SYMS);
    deck = shuffle(pool.slice());

    grid.innerHTML = "";
    for (var i = 0; i < deck.length; i++) {
      var card = document.createElement("button");
      card.className = "card";
      card.type = "button";
      card.setAttribute("data-i", i);
      card.innerHTML =
        '<span class="inner">' +
          '<span class="face back-face"></span>' +
          '<span class="face front-face">' + deck[i] + '</span>' +
        '</span>';
      grid.appendChild(card);
    }
    overlay.classList.remove("show");
  }

  function startClock(){
    if (clockId) return;
    startedAt = Date.now();
    clockId = setInterval(function(){
      var s = Math.floor((Date.now() - startedAt) / 1000);
      var m = Math.floor(s / 60);
      timeEl.textContent = m + ":" + String(s % 60).padStart(2, "0");
    }, 500);
  }

  grid.addEventListener("click", function(e){
    var card = e.target.closest ? e.target.closest(".card") : null;
    if (!card || lock) return;
    var i = parseInt(card.getAttribute("data-i"), 10);
    if (card.classList.contains("flip")) return;

    startClock();
    SFX.click();
    card.classList.add("flip");
    flipped.push({ el: card, i: i });

    if (flipped.length < 2) return;

    moves++;
    movesEl.textContent = moves;
    lock = true;

    var a = flipped[0], b = flipped[1];
    if (deck[a.i] === deck[b.i]) {
      SFX.pop();
      setTimeout(function(){
        a.el.classList.add("matched");
        b.el.classList.add("matched");
        a.el.classList.remove("flip");
        b.el.classList.remove("flip");
        matched++;
        lock = false;
        flipped = [];
        if (matched === SYMS.length) finish();
      }, 380);
    } else {
      SFX.hit();
      setTimeout(function(){
        a.el.classList.add("wrong");
        b.el.classList.add("wrong");
      }, 120);
      setTimeout(function(){
        a.el.classList.remove("flip", "wrong");
        b.el.classList.remove("flip", "wrong");
        lock = false;
        flipped = [];
      }, 820);
    }
  });

  function finish(){
    clearInterval(clockId);
    clockId = null;
    SFX.win();
    var s = startedAt ? Math.floor((Date.now() - startedAt) / 1000) : 0;
    document.getElementById("ov-text").textContent =
      "共 " + moves + " 步，用时 " + Math.floor(s / 60) + " 分 " + (s % 60) + " 秒。";
    overlay.classList.add("show");
  }

  document.getElementById("restart").addEventListener("click", function(){ SFX.click(); reset(); });
  document.getElementById("ov-btn").addEventListener("click", function(){ SFX.click(); reset(); });
  document.getElementById("back").addEventListener("click", function(){
    if (window.parent !== window) window.parent.postMessage("rtsx-close", "*");
    else location.href = "../index.html";
  });

  reset();
})();
</script>
</body>
</html>
